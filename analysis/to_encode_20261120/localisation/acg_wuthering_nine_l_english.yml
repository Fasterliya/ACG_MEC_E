l_english:

 # ===== JZH 今州 =====

 JZH: "今州"
 JZH_ADJ: "今州的"
 JZH_ADJ2: "今州的"
 JZH_ideas: "今州理念"
 JZH_ideas_start: "今州传统"
 JZH_ideas_start_desc: "今州立国之初便已凝结的传承。"
 JZH_ideas_bonus: "今州野心"
 JZH_ideas_bonus_desc: "今州理念浑然一体之时，便是其真正野心显形之日。"
 JZH_idea_1: "玉京守望"
 JZH_idea_1_desc: "玉京的城墙下，工匠与农人各自守着一截工事。今州的秩序从不是靠一个人撑起来的。"
 JZH_idea_2: "今州铁壁"
 JZH_idea_2_desc: "凡入今州者，都要先过城门。城墙一寸寸夯起来，也一寸寸记住了倒在这里的人。"
 JZH_idea_3: "鸣钟之律"
 JZH_idea_3_desc: "钟声一响，市集开、城门闭、兵甲归位。今州人用一口钟管住了整座城的脾气。"
 JZH_idea_4: "龙泉军工"
 JZH_idea_4_desc: "龙泉的炉火昼夜不熄。从这里出去的刀、甲、铳，从不将就。"
 JZH_idea_5: "潮汐军阵"
 JZH_idea_5_desc: "今州的兵在潮水边练兵。潮起则进，潮落则守，敌人的节奏由海来定。"
 JZH_idea_6: "边地屯垦"
 JZH_idea_6_desc: "边地不只有戍卒，还有犁。仓廪满了，才轮得到谈守边。"
 JZH_idea_7: "岁主遗训"
 JZH_idea_7_desc: "岁主留下的话只有一句：地可以失，人不能散。今州历代的征召令，都从这句里来。"

 # ===== RGU 拉古那 =====

 RGU: "拉古那"
 RGU_ADJ: "拉古那的"
 RGU_ADJ2: "拉古那的"
 RGU_ideas: "拉古那理念"
 RGU_ideas_start: "拉古那传统"
 RGU_ideas_start_desc: "拉古那立国之初便已凝结的传承。"
 RGU_ideas_bonus: "拉古那野心"
 RGU_ideas_bonus_desc: "拉古那理念浑然一体之时，便是其真正野心显形之日。"
 RGU_idea_1: "狂欢之港"
 RGU_idea_1_desc: "港口的锣鼓一年到头不歇。拉古那人把生意做成了节日，又把节日做成了生意。"
 RGU_idea_2: "商路辐辏"
 RGU_idea_2_desc: "从海峡到内海，每一条航路的终点都是拉古那的码头。"
 RGU_idea_3: "群岛船团"
 RGU_idea_3_desc: "拉古那的船从不单独出海。船团一起走，货一起卖，遇上风浪一起沉——所以从不沉。"
 RGU_idea_4: "假面舞会"
 RGU_idea_4_desc: "面具之下才能说真话。拉古那的盟约，多半是在舞池边谈成的。"
 RGU_idea_5: "剧院之城"
 RGU_idea_5_desc: "拉古那的剧院比军械库大。这里的名声，是一场场戏攒出来的。"
 RGU_idea_6: "金穗税制"
 RGU_idea_6_desc: "税单写得比账本还细。商人不恨它，因为它算得清。"
 RGU_idea_7: "远洋护航"
 RGU_idea_7_desc: "自家的船自家护。拉古那的护航队从不等别人来救命。"

 # ===== XJA 星炬学院 =====

 XJA: "星炬学院"
 XJA_ADJ: "星炬学院的"
 XJA_ADJ2: "星炬学院的"
 XJA_ideas: "星炬学院理念"
 XJA_ideas_start: "星炬学院传统"
 XJA_ideas_start_desc: "星炬学院立国之初便已凝结的传承。"
 XJA_ideas_bonus: "星炬学院野心"
 XJA_ideas_bonus_desc: "星炬学院理念浑然一体之时，便是其真正野心显形之日。"
 XJA_idea_1: "星炬讲堂"
 XJA_idea_1_desc: "讲堂的灯整夜亮着。学院相信，答案总在下一次试验里。"
 XJA_idea_2: "共鸣研究"
 XJA_idea_2_desc: "把声音拆开再拼回去——学院用这种方式理解世界，也用来改进它的机器。"
 XJA_idea_3: "学院工坊"
 XJA_idea_3_desc: "图纸画到第三稿才准开工。慢，但一次就对。"
 XJA_idea_4: "学术声望"
 XJA_idea_4_desc: "别的国家送子弟来求学，带来的不只是学费，还有敬意。"
 XJA_idea_5: "交换学者"
 XJA_idea_5_desc: "学院的门对所有人开，只要他带得动一个问题。"
 XJA_idea_6: "学园产业"
 XJA_idea_6_desc: "实验室旁边就是作坊。学问落地成货，货换回经费，经费再养学问。"
 XJA_idea_7: "护院卫队"
 XJA_idea_7_desc: "学院不养大军，但护院的人个个知道自己守的是什么。"

 # ===== MGZ 梦州 =====

 MGZ: "梦州"
 MGZ_ADJ: "梦州的"
 MGZ_ADJ2: "梦州的"
 MGZ_ideas: "梦州理念"
 MGZ_ideas_start: "梦州传统"
 MGZ_ideas_start_desc: "梦州立国之初便已凝结的传承。"
 MGZ_ideas_bonus: "梦州野心"
 MGZ_ideas_bonus_desc: "梦州理念浑然一体之时，便是其真正野心显形之日。"
 MGZ_idea_1: "梦泽烟波"
 MGZ_idea_1_desc: "梦州的名声像雾，看不清，却到处都在。"
 MGZ_idea_2: "州府编户"
 MGZ_idea_2_desc: "州府的册子上写着每一户、每一亩。梦州靠这个把水乡管成了国。"
 MGZ_idea_3: "织造之邦"
 MGZ_idea_3_desc: "梦州的织机声比更鼓还密。一匹锦，换一年太平。"
 MGZ_idea_4: "锁氏亲军"
 MGZ_idea_4_desc: "锁氏的亲军不从外姓里招。他们守的不是国，是家门。"
 MGZ_idea_5: "泽国堤防"
 MGZ_idea_5_desc: "堤一决，半个梦州就没了。所以修堤的钱，谁也不敢省。"
 MGZ_idea_6: "归化之策"
 MGZ_idea_6_desc: "梦州不急着改别人的风俗，先让人吃饱，再谈别的。"
 MGZ_idea_7: "梦州声望"
 MGZ_idea_7_desc: "梦州的使节走到哪里，都有人愿意先听他说完。"

 # ===== CXT 残星会 =====

 CXT: "残星会"
 CXT_ADJ: "残星会的"
 CXT_ADJ2: "残星会的"
 CXT_ideas: "残星会理念"
 CXT_ideas_start: "残星会传统"
 CXT_ideas_start_desc: "残星会立国之初便已凝结的传承。"
 CXT_ideas_bonus: "残星会野心"
 CXT_ideas_bonus_desc: "残星会理念浑然一体之时，便是其真正野心显形之日。"
 CXT_idea_1: "残星锐士"
 CXT_idea_1_desc: "残星会挑人只看一件事：敢不敢在最前面站住。"
 CXT_idea_2: "暗潮渗透"
 CXT_idea_2_desc: "城还没围上，城门已经在里面开了。残星会向来这么打仗。"
 CXT_idea_3: "星屑回响"
 CXT_idea_3_desc: "残星会从不浪费一具尸体，也不浪费一个活人。"
 CXT_idea_4: "不惜代价"
 CXT_idea_4_desc: "残星会的军令里没有「撤退」，只有「值不值」。"
 CXT_idea_5: "铁腕统御"
 CXT_idea_5_desc: "恐惧是最省钱的税。残星会算得很清楚。"
 CXT_idea_6: "疆域清算"
 CXT_idea_6_desc: "打下来的地要清得干净，残星会从来不留旧账。"
 CXT_idea_7: "残星征召"
 CXT_idea_7_desc: "残星会征兵不问出身，只问能活几天。"

 # ===== FGL 浮光林 =====

 FGL: "浮光林"
 FGL_ADJ: "浮光林的"
 FGL_ADJ2: "浮光林的"
 FGL_ideas: "浮光林理念"
 FGL_ideas_start: "浮光林传统"
 FGL_ideas_start_desc: "浮光林立国之初便已凝结的传承。"
 FGL_ideas_bonus: "浮光林野心"
 FGL_ideas_bonus_desc: "浮光林理念浑然一体之时，便是其真正野心显形之日。"
 FGL_idea_1: "林间伏兵"
 FGL_idea_1_desc: "浮光林的兵不列阵，他们趴着。等敌人走进林子，仗就打完了。"
 FGL_idea_2: "守林游猎"
 FGL_idea_2_desc: "在林子里，猎人和兵的差别只在于猎什么。"
 FGL_idea_3: "木寨工事"
 FGL_idea_3_desc: "浮光林不修石城，只修木寨。木头会烂，但修得比石头快。"
 FGL_idea_4: "浮光木产"
 FGL_idea_4_desc: "林子里出的东西不多，但每一样别人都缺。"
 FGL_idea_5: "林贡之制"
 FGL_idea_5_desc: "林贡收得不重，但从不间断。浮光林靠这个养住了整片山。"
 FGL_idea_6: "山林征召"
 FGL_idea_6_desc: "号角一响，猎户放下弓就来。他们本来就住在战场上。"
 FGL_idea_7: "林誓之约"
 FGL_idea_7_desc: "浮光林的人不立契，只立誓。誓一立，几代人都认。"

 # ===== FSL 翡萨烈 =====

 FSL: "翡萨烈"
 FSL_ADJ: "翡萨烈的"
 FSL_ADJ2: "翡萨烈的"
 FSL_ideas: "翡萨烈理念"
 FSL_ideas_start: "翡萨烈传统"
 FSL_ideas_start_desc: "翡萨烈立国之初便已凝结的传承。"
 FSL_ideas_bonus: "翡萨烈野心"
 FSL_ideas_bonus_desc: "翡萨烈理念浑然一体之时，便是其真正野心显形之日。"
 FSL_idea_1: "重舰传统"
 FSL_idea_1_desc: "翡萨烈的船厂只造大船。小船护不住航道，也护不住脸面。"
 FSL_idea_2: "海峡操练"
 FSL_idea_2_desc: "海峡里的每一道暗流，翡萨烈的舵手都背得下来。"
 FSL_idea_3: "水手世家"
 FSL_idea_3_desc: "翡萨烈的水手是生下来的，不是招来的。"
 FSL_idea_4: "香料航路"
 FSL_idea_4_desc: "从产地到港口，翡萨烈人自己走完全程，不让中间人碰一手。"
 FSL_idea_5: "远洋传承"
 FSL_idea_5_desc: "老船长退了也不下船，坐在船尾教下一辈看星。"
 FSL_idea_6: "群岛商权"
 FSL_idea_6_desc: "翡萨烈的商旗插在每一个能停船的礁上。"
 FSL_idea_7: "港务税关"
 FSL_idea_7_desc: "港口收的每一文钱，都记着它从哪条船上来。"

 # ===== MTL 莫塔里 =====

 MTL: "莫塔里"
 MTL_ADJ: "莫塔里的"
 MTL_ADJ2: "莫塔里的"
 MTL_ideas: "莫塔里理念"
 MTL_ideas_start: "莫塔里传统"
 MTL_ideas_start_desc: "莫塔里立国之初便已凝结的传承。"
 MTL_ideas_bonus: "莫塔里野心"
 MTL_ideas_bonus_desc: "莫塔里理念浑然一体之时，便是其真正野心显形之日。"
 MTL_idea_1: "家族金库"
 MTL_idea_1_desc: "莫塔里的金库不在地窖里，在账本上。"
 MTL_idea_2: "商会网络"
 MTL_idea_2_desc: "莫塔里的商会横跨数国，货没到，消息先到。"
 MTL_idea_3: "城邦营造"
 MTL_idea_3_desc: "城是一砖一瓦买下来的，所以每一块都算得清。"
 MTL_idea_4: "名门声望"
 MTL_idea_4_desc: "莫塔里的名字本身就是抵押品，比任何契约都硬。"
 MTL_idea_5: "契约精神"
 MTL_idea_5_desc: "签了就是签了。莫塔里从不毁约——毁约比赔钱贵。"
 MTL_idea_6: "私兵护卫"
 MTL_idea_6_desc: "商队自己带枪。护得住货，才谈得上做买卖。"
 MTL_idea_7: "外交联姻"
 MTL_idea_7_desc: "莫塔里的婚事都是生意，而且是做成了的生意。"

 # ===== YHH 隐海修会 =====

 YHH: "隐海修会"
 YHH_ADJ: "隐海修会的"
 YHH_ADJ2: "隐海修会的"
 YHH_ideas: "隐海修会理念"
 YHH_ideas_start: "隐海修会传统"
 YHH_ideas_start_desc: "隐海修会立国之初便已凝结的传承。"
 YHH_ideas_bonus: "隐海修会野心"
 YHH_ideas_bonus_desc: "隐海修会理念浑然一体之时，便是其真正野心显形之日。"
 YHH_idea_1: "深海圣所"
 YHH_idea_1_desc: "修会的圣所建在潮水边。信徒说，海听得见誓言。"
 YHH_idea_2: "修会戒律"
 YHH_idea_2_desc: "修会的规矩不多，但破一条就再没有第二次机会。"
 YHH_idea_3: "海疆归化"
 YHH_idea_3_desc: "修会不烧神庙，只把新神像摆在旧神像旁边。过两代，人就忘了区别。"
 YHH_idea_4: "圣殿卫队"
 YHH_idea_4_desc: "圣殿卫队守的不是墙，是门。门开了，墙就没意义了。"
 YHH_idea_5: "教区治理"
 YHH_idea_5_desc: "每一个渔村都有一个执事。修会的手，比任何官府都长。"
 YHH_idea_6: "布道四方"
 YHH_idea_6_desc: "修会的船队走到哪里，经就念到哪里。"
 YHH_idea_7: "虔诚之刃"
 YHH_idea_7_desc: "修会的剑上刻着祷词。他们说，砍下去的时候神听得见。"
