<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="dsh-htmlui" content="placement=float; size=780x680; store=wuwa_prov">
<title>鸣潮九国 · 省份分地台</title>
<style>
  :root{
    --bg:#12141a; --panel:#191c25; --panel2:#20242f; --line:#2c3140;
    --fg:#e8eaf0; --muted:#8a91a6; --accent:#4fd1c5; --warn:#e0645a; --gold:#e6b64c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--fg);
    font:13px/1.5 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    padding:10px 14px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:linear-gradient(180deg,#1b1f2a,#151821);
  }
  header h1{font-size:14px; margin:0; letter-spacing:.5px; font-weight:600}
  header h1 span{color:var(--accent)}
  .stat{color:var(--muted); font-size:12px}
  .stat b{color:var(--fg); font-variant-numeric:tabular-nums}
  .grow{flex:1}
  .btn{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    border-radius:7px; padding:5px 11px; cursor:pointer; font-size:12px; font-family:inherit;
    transition:.15s;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.primary{background:#1f6f68; border-color:#2a8f86; color:#eafffb}
  .btn.primary:hover{background:#27887f; color:#fff}
  .btn.ghost{border-style:dashed; color:var(--muted)}

  nav{
    display:flex; gap:4px; padding:8px 10px; overflow-x:auto;
    border-bottom:1px solid var(--line); background:#14171f; flex-wrap:wrap;
  }
  .tab{
    display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px;
    border:1px solid transparent; cursor:pointer; white-space:nowrap; font-size:12.5px;
    color:var(--muted);
  }
  .tab:hover{background:#1d212b}
  .tab.on{background:#232936; border-color:var(--accent); color:var(--fg)}
  .sw{width:10px;height:10px;border-radius:3px;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
  .cnt{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
  .tab.on .cnt{color:var(--accent)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--warn);display:inline-block}
  .dot.ok{background:var(--accent)}

  main{flex:1; overflow-y:auto; padding:14px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px}
  .nation-head{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
  .nation-head .nm{font-size:17px; font-weight:600}
  .nation-head .tg{font-family:ui-monospace,Consolas,monospace; color:var(--accent); font-size:12px; letter-spacing:1px}
  .nation-head .fl{color:var(--muted); font-size:11.5px; font-family:ui-monospace,monospace}

  .inrow{display:flex; gap:8px}
  input[type=text]{
    background:#101319; border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:9px 11px; font-size:13.5px; font-family:inherit; outline:none; width:100%;
  }
  input[type=text]:focus{border-color:var(--accent); box-shadow:0 0 0 2px rgba(79,209,197,.12)}
  input.mini{padding:6px 9px; font-size:12.5px}
  .hint{color:var(--muted); font-size:11.5px; margin:6px 0 0}
  .hint kbd{background:#232936;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:ui-monospace,monospace;font-size:11px}

  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; min-height:34px}
  .chip{
    display:inline-flex; align-items:center; gap:6px; padding:4px 6px 4px 9px;
    background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    font-family:ui-monospace,Consolas,monospace; font-size:12.5px; cursor:pointer;
    user-select:none;
  }
  .chip:hover{border-color:#3c4557}
  .chip .k{color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.5px}
  .chip.cap{background:#2c2418; border-color:var(--gold); color:var(--gold)}
  .chip.cap .k{color:var(--gold)}
  .chip .x{
    color:var(--muted); padding:0 3px; border-radius:4px; font-size:14px; line-height:1;
  }
  .chip .x:hover{color:var(--warn); background:#2a1c1c}
  .chip.bad{border-color:var(--warn)}
  .empty{color:var(--muted); font-size:12px; padding:6px 0}

  .metagrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px}
  footer{
    padding:10px 14px; border-top:1px solid var(--line); background:#151821;
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .capinfo{font-size:12px; color:var(--muted)}
  .capinfo b{color:var(--gold)}
  .warnline{color:var(--warn); font-size:11.5px}
  textarea{
    width:100%; min-height:80px; background:#101319; border:1px solid var(--line);
    color:var(--fg); border-radius:8px; padding:9px; font:11.5px/1.55 ui-monospace,Consolas,monospace;
    resize:vertical; outline:none;
  }
  details summary{cursor:pointer; color:var(--muted); font-size:12px; padding:4px 0}
  details summary:hover{color:var(--accent)}
  .toast{
    position:fixed; left:50%; bottom:64px; transform:translateX(-50%);
    background:#1f6f68; color:#eafffb; padding:8px 16px; border-radius:8px; font-size:12.5px;
    opacity:0; transition:.25s; pointer-events:none; z-index:99;
  }
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>鸣潮九国 · <span>省份分地台</span></h1>
  <div class="stat">已填 <b id="sFilled">0</b>/9 国 · 共 <b id="sProv">0</b> 省 · 首都 <b id="sCap">0</b></div>
  <div class="grow"></div>
  <button class="btn ghost" id="btnNext">跳到下一个未填 ▸</button>
</header>

<nav id="tabs"></nav>

<main>
  <div class="card">
    <div class="nation-head">
      <span class="nm" id="nName">—</span>
      <span class="tg" id="nTag">—</span>
      <span class="fl" id="nFile">—</span>
    </div>

    <div class="inrow">
      <input type="text" id="idInput" placeholder="输入省 ID，回车添加（可粘贴多个：33 34, 1961、 33；前面加 * 表示设为首都，如 *33）" autocomplete="off" spellcheck="false">
      <button class="btn" id="btnAdd">添加</button>
    </div>
    <p class="hint">数字键 <kbd>1</kbd>–<kbd>9</kbd> 切换国家 · 点芯片 = 设为首都 · 点 <b>×</b> 删除 · <kbd>Enter</kbd> 连续添加</p>

    <div class="chips" id="chips"></div>

    <div class="metagrid">
      <div class="field"><label>君主名（中文直写，走明文）</label><input type="text" class="mini" id="fMonarch" placeholder="例：今汐"></div>
      <div class="field"><label>王朝 / 家族名</label><input type="text" class="mini" id="fDynasty" placeholder="例：今州"></div>
    </div>
  </div>

  <div class="card">
    <details id="sumBox">
      <summary>汇总预览（提交时一并送出）</summary>
      <textarea id="summary" readonly></textarea>
    </details>
  </div>
</main>

<footer>
  <span class="capinfo" id="capInfo">首都：<b>未设</b></span>
  <span class="warnline" id="warn"></span>
  <div class="grow"></div>
  <button class="btn" id="btnCopy">复制汇总</button>
  <button class="btn" id="btnThis">只提交本国</button>
  <button class="btn primary" id="btnAll">提交全部九国</button>
</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  const NATIONS = [
    {tag:'JZH', name:'今州',     file:'Jinzhou.txt',        color:'#3cc8aa'},
    {tag:'LGN', name:'拉古那',   file:'Ragunna.txt',        color:'#e6963c'},
    {tag:'XJA', name:'星炬学院', file:'Xingju-Academy.txt', color:'#aa82e6'},
    {tag:'MGZ', name:'梦州',     file:'Mengzhou.txt',       color:'#dc82be'},
    {tag:'CXT', name:'残星会',   file:'Fractsidus.txt',     color:'#c0392b'},
    {tag:'FGL', name:'浮光林',   file:'Fuguanglin.txt',     color:'#5aaa5a'},
    {tag:'FSL', name:'翡萨烈',   file:'Fisalia.txt',        color:'#3f7ad0'},
    {tag:'MTL', name:'莫塔里',   file:'Montelli.txt',       color:'#b05070'},
    {tag:'YHH', name:'隐海修会', file:'OrderOfTheDeep.txt', color:'#78c8d2'}
  ];
  const SLOT = 'wuwa_prov';
  const byTag = Object.fromEntries(NATIONS.map(n => [n.tag, n]));

  const blank = () => {
    const o = {active:'JZH', nations:{}};
    NATIONS.forEach(n => o.nations[n.tag] = {list:[], cap:null, monarch:'', dynasty:''});
    return o;
  };

  function load(){
    let v = null;
    try { if (window.dshHTML && dshHTML.store) v = dshHTML.store.get(SLOT); } catch(e){}
    if (!v) { try { if (window.dshHTML && dshHTML.state) v = dshHTML.state.get(); } catch(e){} }
    const base = blank();
    if (!v || typeof v !== 'object') return base;
    NATIONS.forEach(n => {
      const s = v.nations && v.nations[n.tag];
      if (s) base.nations[n.tag] = {
        list: Array.isArray(s.list) ? s.list.filter(x => Number.isInteger(x)) : [],
        cap: Number.isInteger(s.cap) ? s.cap : null,
        monarch: typeof s.monarch === 'string' ? s.monarch : '',
        dynasty: typeof s.dynasty === 'string' ? s.dynasty : ''
      };
    });
    if (v.active && byTag[v.active]) base.active = v.active;
    return base;
  }

  let DB = load();
  let saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { if (window.dshHTML && dshHTML.store) dshHTML.store.set(SLOT, DB); } catch(e){}
      try { if (window.dshHTML && dshHTML.state) dshHTML.state.set(DB); } catch(e){}
    }, 250);
  }

  const $ = s => document.querySelector(s);
  const cur = () => DB.nations[DB.active];

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1600);
  }

  function stats(){
    let filled = 0, prov = 0, caps = 0;
    NATIONS.forEach(n => {
      const s = DB.nations[n.tag];
      if (s.list.length) filled++;
      prov += s.list.length;
      if (s.cap != null && s.list.includes(s.cap)) caps++;
    });
    $('#sFilled').textContent = filled;
    $('#sProv').textContent = prov;
    $('#sCap').textContent = caps;
    return {filled, prov, caps};
  }

  function renderTabs(){
    const nav = $('#tabs'); nav.innerHTML = '';
    NATIONS.forEach((n, i) => {
      const s = DB.nations[n.tag];
      const el = document.createElement('div');
      el.className = 'tab' + (n.tag === DB.active ? ' on' : '');
      el.dataset.tag = n.tag;
      const hasCap = s.cap != null && s.list.includes(s.cap);
      el.innerHTML =
        '<span class="sw" style="background:' + n.color + '"></span>' +
        '<span>' + n.name + '</span>' +
        '<span class="cnt">' + (s.list.length || '·') + '</span>' +
        '<span class="dot ' + (hasCap ? 'ok' : '') + '"></span>';
      el.onclick = () => { DB.active = n.tag; save(); renderAll(); };
      nav.appendChild(el);
    });
  }

  function renderNation(){
    const n = byTag[DB.active], s = cur();
    $('#nName').textContent = n.name;
    $('#nTag').textContent = n.tag;
    $('#nFile').textContent = 'countries/' + n.file;
    $('#fMonarch').value = s.monarch;
    $('#fDynasty').value = s.dynasty;

    const box = $('#chips');
    box.innerHTML = '';
    if (!s.list.length) {
      box.innerHTML = '<div class="empty">还没有省。把省 ID 打进去，回车。</div>';
    } else {
      s.list.forEach(id => {
        const chip = document.createElement('span');
        const isCap = s.cap === id;
        chip.className = 'chip' + (isCap ? ' cap' : '') + (id < 1 || id > 9999 ? ' bad' : '');
        chip.dataset.id = id;
        chip.title = isCap ? '当前首都 · 再点一次取消' : '点击设为首都';
        chip.innerHTML = (isCap ? '<span class="k">首都</span>' : '') +
          '<span>' + id + '</span><span class="x" data-del="1">×</span>';
        chip.onclick = (ev) => {
          if (ev.target.dataset.del) {
            s.list = s.list.filter(x => x !== id);
            if (s.cap === id) s.cap = null;
          } else {
            s.cap = (s.cap === id) ? null : id;
          }
          save(); renderAll();
        };
        box.appendChild(chip);
      });
    }

    $('#capInfo').innerHTML = '首都：' + (s.cap != null ? '<b>' + s.cap + '</b>' : '<b>未设</b>');
    const warn = [];
    if (!s.list.length) warn.push('本国 0 省');
    if (s.cap == null) warn.push('未设首都');
    else if (!s.list.includes(s.cap)) warn.push('首都不在列表里');
    $('#warn').textContent = warn.length ? '⚠ ' + warn.join(' · ') : '';
    $('#summary').value = buildText();
  }

  function renderAll(){ renderTabs(); renderNation(); stats(); }

  function parseInput(raw){
    const out = [];
    raw.split(/[\s,，;；、\/]+/).forEach(tok => {
      if (!tok) return;
      const isCap = tok.startsWith('*');
      const digits = tok.replace(/[^\d]/g, '');
      if (!digits) return;
      const id = parseInt(digits, 10);
      if (!Number.isFinite(id)) return;
      out.push({id, isCap});
    });
    return out;
  }

  function addFromInput(){
    const el = $('#idInput');
    const items = parseInput(el.value);
    if (!items.length) return;
    const s = cur();
    let added = 0, capSet = null;
    items.forEach(({id, isCap}) => {
      if (!s.list.includes(id)) { s.list.push(id); added++; }
      if (isCap) capSet = id;
    });
    if (capSet != null) s.cap = capSet;
    s.list.sort((a, b) => a - b);
    el.value = '';
    save(); renderAll();
    if (added || capSet != null) {
      toast(added ? ('+' + added + ' 省' + (capSet != null ? ' · 首都 ' + capSet : '')) : ('首都 ' + capSet));
    }
    el.focus();
  }

  function buildText(){
    const lines = [];
    lines.push('## 鸣潮九国 · 省份分地表');
    lines.push('');
    lines.push('| 省 ID | 归属 | 首都 | 省份数 |');
    lines.push('|---|---|---|---|');
    NATIONS.forEach(n => {
      const s = DB.nations[n.tag];
      if (!s.list.length) {
        lines.push('| — | ' + n.tag + ' ' + n.name + ' | ' + (s.cap != null ? s.cap : '—') + ' | 0 |');
      } else {
        s.list.forEach(id => {
          lines.push('| ' + id + ' | ' + n.tag + ' ' + n.name + ' | ' + (s.cap === id ? '★' : '') + ' | ' + s.list.length + ' |');
        });
      }
    });
    lines.push('');
    lines.push('详细：');
    NATIONS.forEach(n => {
      const s = DB.nations[n.tag];
      const cap = s.cap != null ? ' (首都 ' + s.cap + ')' : ' (首都未设)';
      const m = s.monarch || s.dynasty ? ' 君主=' + (s.monarch || '?') + ' 王朝=' + (s.dynasty || '?') : '';
      lines.push('- ' + n.tag + ' ' + n.name + ': ' + (s.list.join(', ') || '（空）') + cap + m);
    });
    return lines.join('\n');
  }

  function payload(onlyTag){
    const out = {submittedAt:new Date().toISOString(), nations:{}};
    NATIONS.forEach(n => {
      if (onlyTag && n.tag !== onlyTag) return;
      const s = DB.nations[n.tag];
      out.nations[n.tag] = {
        name: n.name, file: n.file,
        provinces: s.list.slice(),
        capital: s.cap,
        monarch: s.monarch,
        dynasty: s.dynasty
      };
    });
    return out;
  }

  function send(action, onlyTag){
    const data = payload(onlyTag);
    const text = buildText();
    const box = $('#sumBox'); box.open = true;
    if (window.dshHTML && dshHTML.send) {
      dshHTML.send(action, {text, data});
      toast('已送出 · 等爸爸回话');
    } else {
      toast('这里没有 dshHTML，先复制汇总');
    }
  }

  // events
  $('#btnAdd').onclick = addFromInput;
  $('#idInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addFromInput(); }
  });
  $('#fMonarch').addEventListener('input', e => { cur().monarch = e.target.value; save(); $('#summary').value = buildText(); });
  $('#fDynasty').addEventListener('input', e => { cur().dynasty = e.target.value; save(); $('#summary').value = buildText(); });
  $('#btnNext').onclick = () => {
    const i = NATIONS.findIndex(n => n.tag === DB.active);
    for (let k = 1; k <= NATIONS.length; k++) {
      const cand = NATIONS[(i + k) % NATIONS.length];
      const s = DB.nations[cand.tag];
      if (!s.list.length || s.cap == null) { DB.active = cand.tag; save(); renderAll(); $('#idInput').focus(); return; }
    }
    toast('九国都填完了');
  };
  $('#btnCopy').onclick = async () => {
    const t = buildText();
    try { await navigator.clipboard.writeText(t); toast('已复制'); }
    catch(e){
      const ta = $('#summary'); ta.value = t; $('#sumBox').open = true;
      ta.select(); toast('选好了，Ctrl+C');
    }
  };
  $('#btnThis').onclick = () => send('submitNation', DB.active);
  $('#btnAll').onclick = () => send('submitAll', null);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) { DB.active = NATIONS[n - 1].tag; save(); renderAll(); }
  });

  renderAll();
  $('#idInput').focus();
})();
</script>
</body>
</html>
