<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="dsh-htmlui" content="store=archon_events">
<title>七神 &amp; 三月 · 事件效果编辑台 v2</title>
<style>
  :root{
    --bg:#0d1016; --bg2:#131822; --bg3:#1a2130; --line:#262f3f;
    --ink:#e7edf6; --ink2:#9aa8bd; --ink3:#6b7993;
    --gold:#e8c479; --cyan:#63d2e8; --green:#7ed6a5; --red:#f08090; --warn:#ffcf6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.6}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#161d29,#0f141d);flex-wrap:wrap}
  header h1{font-size:14.5px;margin:0;letter-spacing:.05em;font-weight:600}
  header h1 span{color:var(--gold)}
  .stat{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  .stat b{color:var(--gold);font-weight:600}
  .stat.w b{color:var(--warn)}
  .grow{flex:1}
  button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--bg3);border:1px solid var(--line);
    border-radius:8px;padding:5px 11px;cursor:pointer;transition:.15s}
  button:hover{border-color:#3b4a63;background:#222c3d}
  button.primary{background:linear-gradient(180deg,#2b3a52,#1d2739);border-color:#3f5573;color:#fff}
  button.primary:hover{border-color:var(--gold);color:var(--gold)}
  button.approve{background:linear-gradient(180deg,#26402f,#1a2a20);border-color:#3c6a4d;color:#cdf0da}
  #body{display:flex;flex:1;min-height:0}
  nav{width:236px;flex:0 0 236px;border-right:1px solid var(--line);overflow-y:auto;padding:8px 8px 90px;background:#0f141d}
  .navsec{font-size:11px;letter-spacing:.16em;color:var(--ink3);padding:12px 10px 4px}
  .navitem{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2)}
  .navitem:hover{background:#17202c;color:var(--ink)}
  .navitem.on{background:#1d2839;color:var(--ink);box-shadow:inset 2px 0 0 var(--gold)}
  .dot{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
  .navitem .cnt{margin-left:auto;font-size:11px;color:var(--ink3)}
  .navitem .cnt.done{color:var(--green)}
  .navitem .cnt.w{color:var(--warn)}
  main{flex:1;overflow-y:auto;padding:18px 26px 130px;min-width:0}
  .dhead{margin:2px 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .dhead .k{font-size:11.5px;letter-spacing:.2em;color:var(--ink3)}
  .dhead h2{margin:5px 0 3px;font-size:21px}
  .dhead .sub{color:var(--ink2);font-size:13px}
  .tipbox{background:#111a24;border:1px solid #2b4152;border-radius:11px;padding:12px 16px;margin-bottom:16px}
  .tipbox summary{cursor:pointer;font-size:12.5px;color:var(--cyan);letter-spacing:.05em;outline:none}
  .tipbox ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:#c6d2e4}
  .tipbox li{margin:3px 0}
  .tipbox code{color:#8fb4d8;background:#0d1620;padding:1px 5px;border-radius:4px;font-size:12px}
  .tipbox pre{margin:10px 0 0;background:#0b1219;border:1px solid #22303f;border-radius:8px;padding:10px 12px;
    font-family:ui-monospace,Consolas,monospace;font-size:11.8px;color:#9fc4dd;overflow-x:auto;line-height:1.6;white-space:pre}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin-bottom:16px}
  .card.edited{border-color:#4a5f3c;box-shadow:0 0 0 1px rgba(232,196,121,.12)}
  .chead{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
  .idx{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink3)}
  .flag{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#7fa8c8;background:#0e1721;
    border:1px solid #22303f;border-radius:5px;padding:1px 7px}
  .kind{font-size:11px;padding:1px 8px;border-radius:5px;border:1px solid;letter-spacing:.05em}
  .kind.bless{color:var(--green);border-color:#33513f;background:#14201a}
  .kind.choice{color:var(--cyan);border-color:#2b4a55;background:#131f24}
  .kind.rite{color:var(--gold);border-color:#4d4126;background:#1d1a12}
  input.title-in{flex:1;min-width:170px;background:#0f1620;border:1px solid transparent;border-radius:6px;
    color:#eef4ff;font:inherit;font-size:16px;font-weight:600;padding:2px 6px}
  input.title-in:hover{border-color:#2c3a4d}
  input.title-in:focus{outline:none;border-color:#42607f;background:#0b1219}
  .lbl{font-size:10.5px;letter-spacing:.22em;color:var(--ink3);margin:11px 0 5px}
  .flavor{background:#101722;border-left:2px solid #2c3d54;border-radius:0 8px 8px 0;padding:9px 13px;
    color:#c6d2e4;font-size:13.4px;line-height:1.8}
  .warnbox{display:flex;gap:8px;align-items:flex-start;margin-top:10px;background:#1e1a10;border:1px solid #4a3d1e;
    border-radius:8px;padding:7px 11px;font-size:12.4px;color:#e8d9a6}
  .warnbox b{color:var(--warn);flex:0 0 auto}
  .opt{border:1px solid var(--line);border-radius:9px;padding:9px 11px 7px;margin-top:8px;background:#141b26}
  .opt .orow{display:flex;align-items:center;gap:8px}
  .opt .lead{color:var(--cyan);font-size:13px;font-weight:700;flex:0 0 auto}
  input.oname{flex:1;background:#0f1620;border:1px solid #202b3a;border-radius:6px;color:#dfe8f5;
    font:inherit;font-size:13px;font-weight:600;padding:3px 8px}
  input.oname:focus{outline:none;border-color:#42607f}
  .eff{list-style:none;margin:7px 0 0;padding:0}
  .eff li{display:flex;align-items:center;gap:6px;margin:4px 0}
  .tp{flex:0 0 auto;width:34px;padding:2px 0;font-size:11px;text-align:center;border-radius:6px;cursor:pointer;
    background:#0e1721;border:1px solid #22303f;color:var(--ink3)}
  .tp.g{color:var(--green);border-color:#33513f}
  .tp.b{color:var(--red);border-color:#4a2f36}
  .tp.n{color:var(--ink2)}
  input.effin{flex:1;background:#0e1721;border:1px solid #1e2a38;border-radius:6px;color:#c9d6e8;
    font:inherit;font-size:12.8px;padding:3px 8px}
  input.effin:focus{outline:none;border-color:#42607f;background:#0b1219}
  .del{flex:0 0 auto;padding:1px 7px;font-size:12px;color:#7d8ba1;background:transparent;border-color:transparent}
  .del:hover{color:var(--red);border-color:#4a2f36;background:#1c1418}
  .optfoot{display:flex;gap:6px;margin-top:6px}
  .optfoot button{font-size:11.5px;padding:2px 9px;color:var(--ink3)}
  .cond{margin-top:9px;font-size:12px;color:var(--ink3)}
  .cond code{color:#8fb4d8;background:#101722;padding:1px 5px;border-radius:4px;font-size:11.5px}
  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(13,17,24,.97);border-top:1px solid var(--line);
    padding:9px 16px;display:flex;gap:12px;align-items:flex-end;backdrop-filter:blur(6px)}
  footer textarea{min-height:36px;height:36px}
  textarea{width:100%;background:#0f1620;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font:inherit;font-size:12.8px;resize:vertical}
  textarea:focus{outline:none;border-color:#42607f}
  .toast{position:fixed;right:16px;bottom:74px;background:#1d2839;border:1px solid var(--gold);color:var(--gold);
    padding:8px 13px;border-radius:9px;font-size:12.5px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  .hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>原神 · <span>信仰事件效果编辑台 v2</span></h1>
    <div class="stat">事件 <b>30</b></div>
    <div class="stat">本轮改动 <b id="s-edit">0</b></div>
    <div class="stat w">待你定 <b id="s-warn">0</b></div>
    <div class="grow"></div>
    <button id="btn-filter">只看本轮改动</button>
    <button id="btn-warn">只看待定项</button>
    <button id="btn-reset">撤销本轮改动</button>
    <button class="primary" id="btn-submit">提交改稿</button>
    <button class="approve" id="btn-approve">全部通过 · 开始写脚本</button>
  </header>

  <div id="body">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>

  <footer>
    <div class="grow">
      <textarea id="global" placeholder="全局意见（数值尺度 / 共用冷却 / 疑点怎么定…）"></textarea>
      <div class="hint">v2 基准 = 你 11-25 提交的 14 件改稿；flag 已统一为共用 <code>acg_mec_e_had_deity_event_flag</code>。改动自动留档。</div>
    </div>
  </footer>
  <div class="toast" id="toast"></div>
</div>

<script>
/* =========================================================
   v2 基准稿：已并入用户 11-25 的 14 件改动
   flag 统一：acg_mec_e_had_deity_event_flag（全局互斥）
   warn = 我标的疑点（只提示，不改你的数值）
   ========================================================= */
const SHARED_FLAG = 'acg_mec_e_had_deity_event_flag';

const BASE = [
{ id:'anemo', group:'七神信仰', name:'巴巴托斯', el:'风', cls:'#7ed6a5', theme:'自由 · 漂泊 · 吟游',

    opts:[{ name:'让风带路', eff:[
      {t:'g',x:'全国修正「风起之时」· 10 年：陆军移动速度 +15%、陆军损耗 −20%'},
      {t:'g',x:'军事点数 +25'} ]}]},
  { code:'A-2', kind:'抉择', kc:'choice', title:'无主之歌',

    opts:[
      { name:'让它唱：自由是风的本性', eff:[
        {t:'b',x:'稳定度 −1'},
        {t:'g',x:'全国修正「自由吟唱」· 10 年：全国叛乱 −2、理念花费 −5%'} ]},
      { name:'封住他的琴', eff:[
        {t:'g',x:'威望 +10、正统性 +5'},
        {t:'g',x:'行政点数 +25'} ]}]},
  { code:'A-3', kind:'仪式', kc:'rite', title:'高天之琴',
    text:'教团请求在都城外办一场持续七日的风花节。费用不轻：酒、花、以及每一座钟楼都要整夜敲响。但风神从不在意形式，祂只在意有没有人抬头看天。',
    opts:[
      { name:'办，办足七日', eff:[
        {t:'b',x:'花费 200 金币'},
        {t:'g',x:'全国修正「风花节」· 15 年：陆军士气 +10%、外交声望 +1'},
        {t:'g',x:'外交点数 +50'} ]},
      { name:'省下这笔钱', eff:[ {t:'n',x:'行政点数 +25'} ]}]}
  ]},

{ id:'geo', group:'七神信仰', name:'摩拉克斯', el:'岩', cls:'#d9b26a', theme:'契约 · 商业 · 坚固',
  events:[
  { code:'B-1', kind:'恩泽', kc:'bless', title:'契约之神的天平',
    text:'商人们在港口立起一块新石碑，刻着所有已经兑现的契约。第七天，石碑裂开一道缝，缝里流出的不是水，是金沙。长老说：契约之神在看。也有人说，祂只是在算利息。',
    opts:[{ name:'立碑为证', eff:[
      {t:'g',x:'全国修正「岩之契」· 12 年：全国税收 +10%、建造花费 −10%'},

    opts:[
      { name:'借', eff:[ {t:'g',x:'金币 +200'}, {t:'b',x:'稳定度 −1、正统性 −5'} ]},
      { name:'不借，先勒紧腰带', eff:[ {t:'g',x:'行政点数 +50'}, {t:'g',x:'正统性 +10、威望 +5'} ]}]},
  { code:'B-3', kind:'仪式', kc:'rite', title:'璃月港的仲裁',
    text:'两家商会为一条航线的归属吵到总督府，双方都举着契约，两份契约的日期是同一天、同一个时辰。只有神能判。祭司说：判了，就要有人不服。',
    warn:'「获得重商主义 +2」需确认效果名（vanilla 多为 mercantilism 修正或 add_mercantilism）。',
    opts:[
      { name:'判给先交货的一家', eff:[
        {t:'g',x:'全国修正「港规」· 15 年：贸易效率 +15%、商人 +1'},
        {t:'g',x:'获得重商主义 +2'} ]},
      { name:'判给两家共有', eff:[

{ id:'electro', group:'七神信仰', name:'巴尔', el:'雷', cls:'#b48cff', theme:'永恒 · 锁国 · 威权',
  events:[
  { code:'C-1', kind:'恩泽', kc:'bless', title:'永恒之愿',

  { code:'C-2', kind:'抉择', kc:'choice', title:'锁国令',

    opts:[
      { name:'锁', eff:[
        {t:'g',x:'全国修正「锁国」· 15 年：全国叛乱 −3、稳定花费 −15%'} ]},
      { name:'开', eff:[
        {t:'g',x:'全国修正「开港」· 15 年：贸易效率 +15%、商人 +1'} ]}]},

    warn:'50 军事点换 12 年「冲击伤害 +15%」偏便宜（原稿 150 点还附 4 队兵）。要么抬价，要么降到 +10%。',
    opts:[
      { name:'铸像，扩军', eff:[
        {t:'b',x:'花费 50 军事点'},
        {t:'g',x:'全国修正「雷罚」· 12 年：冲击伤害 +15%、陆军士气 +5%'} ]},
      { name:'只铸一尊，意思到了', eff:[ {t:'n',x:'威望 +5'}, {t:'g',x:'军事点数 +25'} ]}]}

{ id:'dendro', group:'七神信仰', name:'布耶尔', el:'草', cls:'#8fd46a', theme:'智慧 · 梦境 · 发展',

  { code:'D-1', kind:'恩泽', kc:'bless', title:'智慧的馈赠',

const $ = s => document.querySelector(s);
const TOTAL = BASE.reduce((n,d)=>n+d.events.length,0);
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm = (x,y) => x.code===y.code && x.title===y.title && JSON.stringify(x.opts)===JSON.stringify(y.opts);

let DOC = clone(BASE);
const state = { active: BASE[0].id, filter:'all' };  // all | edited | warn
let saveTimer = null;

async function loadDoc(){
  try{
    if (window.dshHTML && dshHTML.store && dshHTML.store.rows && dshHTML.store.rows.get){
      const v = await dshHTML.store.rows.get('doc_v2');
      if (v) return typeof v === 'string' ? JSON.parse(v) : v;
    }
  }catch(e){}
  try{ const raw = localStorage.getItem('archon_doc_v2'); if (raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function saveDoc(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const data = JSON.stringify(DOC);
    try{
      if (window.dshHTML && dshHTML.store && dshHTML.store.rows && dshHTML.store.rows.set){
        await dshHTML.store.rows.set('doc_v2', data); return;
      }
    }catch(e){}
    try{ localStorage.setItem('archon_doc_v2', data); }catch(e){}
  }, 400);
}

const baseOf = (di, code) => BASE.find(x=>x.id===di).events.find(e=>e.code===code);
function eventEdited(d, e){ return !norm(e, baseOf(d.id, e.code)); }
function counts(){
  let ed = 0, wn = 0;
  DOC.forEach(d=>d.events.forEach(e=>{ if (eventEdited(d,e)) ed++; if (e.warn) wn++; }));
  return { ed, wn };
}

function renderNav(){
  const nav = $('#nav');
  let html = '', last = '';
  DOC.forEach(d=>{
    if (d.group !== last){ html += '<div class="navsec">' + d.group + '</div>'; last = d.group; }
    const ed = d.events.filter(e=>eventEdited(d,e)).length;
    const wn = d.events.filter(e=>e.warn).length;
    const tag = ed ? (ed + '/3') : (wn ? '!' : '3');
    html += '<div class="navitem' + (state.active===d.id?' on':'') + '" data-id="' + d.id + '">' +
      '<span class="dot" style="background:' + d.cls + '"></span><span>' + d.name + '</span>' +
      '<span class="cnt' + (ed?' done':(wn?' w':'')) + '">' + tag + '</span></div>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.navitem').forEach(el=>{
    el.onclick = ()=>{ state.active = el.dataset.id; renderNav(); renderMain(); $('#main').scrollTop = 0; };
  });
}

function renderMain(){
  const d = DOC.find(x=>x.id===state.active);
  let evs = d.events.slice();
  if (state.filter === 'edited') evs = evs.filter(e=>eventEdited(d,e));
  if (state.filter === 'warn') evs = evs.filter(e=>e.warn);

  let html = '<div class="dhead"><div class="k">' + d.group + ' · ' + d.el + '</div>' +
    '<h2><span style="color:' + d.cls + '">' + d.name + '</span></h2>' +
    '<div class="sub">' + d.theme + '</div></div>';

  html += '<details class="tipbox"' + (state.active===DOC[0].id?' open':'') + '>' +
    '<summary>统一触发规范（30 件共用一个 flag）· 点开看骨架</summary><ul>' +
    '<li>判定：<code>religion</code> + <code>has_personal_deity</code>，不设 fire_only_once。</li>' +
    '<li>频率：<code>mean_time_to_happen = { months = 120 }</code>（持有该神即 10 年 MTTH）。</li>' +
    '<li>互斥：全场只有 <code>' + SHARED_FLAG + '</code> 一个 flag —— 任意一件信仰事件在场时，其余 29 件都不会判定。</li>' +
    '<li><code>immediate</code> 设 flag（带 <code>days = 30</code> 自动过期兜底）、<code>after</code> 清 flag；<code>trigger</code> 里 <code>NOT</code> 查它。</li>' +
    '<li>副作用：事件窗口挂着不点，全场信仰事件就停摆；30 天过期后自动解锁，靠这条兜底不会永久锁死。</li>' +
    '</ul><pre id="tipcode"></pre></details>';

  if (!evs.length) html += '<div class="card"><div class="flavor">这一组在这个筛选下没有条目。</div></div>';

  evs.forEach(e=>{
    const idx = d.events.indexOf(e);
    html += '<section class="card' + (eventEdited(d,e)?' edited':'') + '">';
    html += '<div class="chead"><span class="idx">' + d.id.toUpperCase() + ' · ' + e.code + '</span>' +
      '<span class="kind ' + e.kc + '">' + e.kind + '</span>' +
      '<input class="title-in" data-di="' + d.id + '" data-ei="' + idx + '" value="' + esc(e.title) + '">' +
      '<span class="flag">flag 共用</span></div>';
    html += '<div class="lbl">文本</div><div class="flavor">' + e.text + '</div>';
    if (e.warn) html += '<div class="warnbox"><b>待定</b><span>' + e.warn + '</span></div>';
    html += '<div class="lbl">选项与效果（可直接改）</div>';
    e.opts.forEach((o, oi)=>{
      html += '<div class="opt"><div class="orow"><span class="lead">' + String.fromCharCode(65+oi) + '.</span>' +
        '<input class="oname" data-di="' + d.id + '" data-ei="' + idx + '" data-oi="' + oi + '" value="' + esc(o.name) + '"></div><ul class="eff">';
      o.eff.forEach((f, fi)=>{
        html += '<li><button class="tp ' + f.t + '" data-di="' + d.id + '" data-ei="' + idx + '" data-oi="' + oi + '" data-fi="' + fi + '">' +
          (f.t==='g'?'益':f.t==='b'?'损':'平') + '</button>' +
          '<input class="effin" data-di="' + d.id + '" data-ei="' + idx + '" data-oi="' + oi + '" data-fi="' + fi + '" value="' + esc(f.x) + '">' +
          '<button class="del" data-di="' + d.id + '" data-ei="' + idx + '" data-oi="' + oi + '" data-fi="' + fi + '">×</button></li>';
      });
      html += '</ul><div class="optfoot">' +
        '<button class="addeff" data-di="' + d.id + '" data-ei="' + idx + '" data-oi="' + oi + '">+ 加一条效果</button>' +
        '<button class="clreff" data-di="' + d.id + '" data-ei="' + idx + '" data-oi="' + oi + '">清空本选项</button>' +
        '</div></div>';
    });
    html += '<div class="cond">触发：<code>MTTH 120 月</code> · 共用互斥 flag <code>' + SHARED_FLAG + '</code></div>';
    html += '</section>';
  });

  $('#main').innerHTML = html;
  const pre = $('#tipcode'); if (pre) pre.textContent = TIP_CODE;
  bindEditors();
}

function bindEditors(){
  const main = $('#main');
  const nodes = (di, ei, oi, fi) => {
    const d = DOC.find(x=>x.id===di);
    const e = d.events[ei];
    const o = oi==null ? null : e.opts[oi];
    const f = fi==null ? null : o.eff[fi];
    return { d, e, o, f };
  };
  main.querySelectorAll('input.title-in').forEach(inp=>{
    inp.oninput = ()=>{ nodes(inp.dataset.di, +inp.dataset.ei).e.title = inp.value; saveDoc(); };
    inp.onblur = ()=>{ renderNav(); renderMain(); };
  });
  main.querySelectorAll('input.oname').forEach(inp=>{
    inp.oninput = ()=>{ nodes(inp.dataset.di, +inp.dataset.ei, +inp.dataset.oi).o.name = inp.value; saveDoc(); };
  });
  main.querySelectorAll('input.effin').forEach(inp=>{
    inp.oninput = ()=>{ nodes(inp.dataset.di, +inp.dataset.ei, +inp.dataset.oi, +inp.dataset.fi).f.x = inp.value; saveDoc(); };
  });
  main.querySelectorAll('button.tp').forEach(btn=>{
    btn.onclick = ()=>{
      const f = nodes(btn.dataset.di, +btn.dataset.ei, +btn.dataset.oi, +btn.dataset.fi).f;
      f.t = f.t==='g' ? 'b' : f.t==='b' ? 'n' : 'g';
      btn.className = 'tp ' + f.t;
      btn.textContent = f.t==='g'?'益':f.t==='b'?'损':'平';
      saveDoc();
    };
  });
  main.querySelectorAll('button.del').forEach(btn=>{
    btn.onclick = ()=>{
      nodes(btn.dataset.di, +btn.dataset.ei, +btn.dataset.oi).o.eff.splice(+btn.dataset.fi,1);
      saveDoc(); renderNav(); renderMain();
    };
  });
  main.querySelectorAll('button.addeff').forEach(btn=>{
    btn.onclick = ()=>{
      nodes(btn.dataset.di, +btn.dataset.ei, +btn.dataset.oi).o.eff.push({t:'n',x:''});
      saveDoc(); renderNav(); renderMain();
    };
  });
  main.querySelectorAll('button.clreff').forEach(btn=>{
    btn.onclick = ()=>{
      nodes(btn.dataset.di, +btn.dataset.ei, +btn.dataset.oi).o.eff = [];
      saveDoc(); renderNav(); renderMain();
    };
  });
}

function updateStat(){ const c = counts(); $('#s-edit').textContent = c.ed; $('#s-warn').textContent = c.wn; }
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2200);
}

$('#btn-filter').onclick = ()=>{
  state.filter = state.filter==='edited' ? 'all' : 'edited';
  $('#btn-filter').textContent = state.filter==='edited' ? '显示全部' : '只看本轮改动';
  renderMain();
};
$('#btn-warn').onclick = ()=>{
  state.filter = state.filter==='warn' ? 'all' : 'warn';
  $('#btn-warn').textContent = state.filter==='warn' ? '显示全部' : '只看待定项';
  renderMain();
};
$('#btn-reset').onclick = ()=>{
  DOC = clone(BASE); saveDoc(); renderNav(); renderMain(); updateStat(); toast('已撤回本轮改动，回到 11-25 的稿子');
};
$('#btn-submit').onclick = ()=>{
  const items = [];
  DOC.forEach(d=>d.events.forEach(e=>{
    if (!eventEdited(d,e)) return;
    items.push({
      deity:d.name, group:d.group, code:e.code, kind:e.kind, title:e.title,
      flag:SHARED_FLAG,
      options:e.opts.map(o=>({ name:o.name, effects:o.eff.map(f=>({type:f.t,text:f.x})) })),
      warn:e.warn || ''
    });
  }));
  const g = $('#global').value.trim();
  if (!items.length && !g){ toast('没有新的改动'); return; }
  try{ if (window.dshHTML) dshHTML.send('revision', { round:2, changed:items, global:g }); }catch(e){}
  toast('已提交：改动 ' + items.length + ' 件');
};
$('#btn-approve').onclick = ()=>{
  try{ if (window.dshHTML) dshHTML.send('approve', { approved:true, changed:counts().ed }); }catch(e){}
  toast('已按「全部通过」提交');
};
$('#global').oninput = saveDoc;

(async ()=>{
  const saved = await loadDoc();
  if (saved && Array.isArray(saved) && saved.length === BASE.length) DOC = saved;
  renderNav(); renderMain(); updateStat();
})();
</script>
</body>
</html>
