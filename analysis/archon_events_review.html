<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="dsh-htmlui" content="store=archon_events">
<title>七神 &amp; 三月 · 信仰事件设计（30 件）</title>
<style>
  :root{
    --bg:#0d1016; --bg2:#131822; --bg3:#1a2130; --line:#262f3f;
    --ink:#e7edf6; --ink2:#9aa8bd; --ink3:#6b7993;
    --gold:#e8c479; --cyan:#63d2e8; --green:#7ed6a5; --red:#f08090; --violet:#b48cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.65}
  #app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#161d29,#0f141d)}
  header h1{font-size:15px;margin:0;letter-spacing:.06em;font-weight:600}
  header h1 span{color:var(--gold)}
  .stat{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
  .stat b{color:var(--gold);font-weight:600}
  .grow{flex:1}
  button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--bg3);border:1px solid var(--line);
    border-radius:8px;padding:6px 12px;cursor:pointer;transition:.15s}
  button:hover{border-color:#3b4a63;background:#222c3d}
  button.primary{background:linear-gradient(180deg,#2b3a52,#1d2739);border-color:#3f5573;color:#fff}
  button.primary:hover{border-color:var(--gold);color:var(--gold)}
  button.approve{background:linear-gradient(180deg,#26402f,#1a2a20);border-color:#3c6a4d;color:#cdf0da}
  button.approve:hover{border-color:var(--green);color:#fff}
  #body{display:flex;flex:1;min-height:0}
  nav{width:250px;flex:0 0 250px;border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 60px;background:#0f141d}
  .navsec{font-size:11px;letter-spacing:.16em;color:var(--ink3);padding:12px 10px 4px}
  .navitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink2)}
  .navitem:hover{background:#17202c;color:var(--ink)}
  .navitem.on{background:#1d2839;color:var(--ink);box-shadow:inset 2px 0 0 var(--gold)}
  .dot{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
  .navitem .cnt{margin-left:auto;font-size:11px;color:var(--ink3)}
  .navitem .cnt.done{color:var(--green)}
  main{flex:1;overflow-y:auto;padding:22px 30px 120px;min-width:0}
  .dhead{margin:6px 0 18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  .dhead .k{font-size:11.5px;letter-spacing:.2em;color:var(--ink3)}
  .dhead h2{margin:6px 0 4px;font-size:22px;letter-spacing:.04em}
  .dhead .sub{color:var(--ink2);font-size:13px}
  .badgerow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .badge{font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--ink2);background:#121a25}
  .badge.good{color:var(--green);border-color:#2f4a3c}
  .badge.bad{color:var(--red);border-color:#4a2f36}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px 18px 14px;margin-bottom:18px}
  .card.annotated{border-color:#3c5e4b;box-shadow:0 0 0 1px rgba(126,214,165,.12)}
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .idx{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink3)}
  .kind{font-size:11px;padding:1px 8px;border-radius:5px;border:1px solid;letter-spacing:.05em}
  .kind.bless{color:var(--green);border-color:#33513f;background:#14201a}
  .kind.choice{color:var(--cyan);border-color:#2b4a55;background:#131f24}
  .kind.rite{color:var(--gold);border-color:#4d4126;background:#1d1a12}
  .card h3{margin:0;font-size:16.5px;font-weight:600;letter-spacing:.03em}
  .lbl{font-size:10.5px;letter-spacing:.22em;color:var(--ink3);margin:12px 0 5px}
  .flavor{background:#101722;border-left:2px solid #2c3d54;border-radius:0 8px 8px 0;padding:10px 14px;
    color:#c6d2e4;font-size:13.5px;line-height:1.8}
  .opt{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:8px;background:#141b26}
  .opt .on{font-size:13.5px;font-weight:600;color:#dfe8f5;margin-bottom:6px}
  .opt .on .lead{color:var(--cyan);margin-right:6px}
  .eff{list-style:none;margin:0;padding:0}
  .eff li{font-size:12.8px;color:var(--ink2);padding:1.5px 0}
  .eff li.g{color:#a8efc6}
  .eff li.b{color:#ffb0ba}
  .eff li.n{color:var(--ink2)}
  .cond{margin-top:10px;font-size:12px;color:var(--ink3)}
  .cond code{color:#8fb4d8;background:#101722;padding:1px 5px;border-radius:4px;font-size:11.5px}
  textarea{width:100%;margin-top:10px;background:#0f1620;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;resize:vertical;min-height:40px}
  textarea:focus{outline:none;border-color:#42607f}
  footer{position:fixed;left:0;right:0;bottom:0;background:rgba(13,17,24,.96);border-top:1px solid var(--line);
    padding:10px 18px;display:flex;gap:12px;align-items:flex-end;backdrop-filter:blur(6px)}
  footer .fwrap{flex:1}
  footer textarea{margin-top:0;min-height:38px;height:38px}
  .toast{position:fixed;right:18px;bottom:78px;background:#1d2839;border:1px solid var(--gold);color:var(--gold);
    padding:9px 14px;border-radius:9px;font-size:12.5px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
  .toast.on{opacity:1;transform:none}
  .hint{font-size:11.5px;color:var(--ink3);margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>原神 · <span>七神信仰 / 三月信仰</span> 事件设计稿</h1>
    <div class="stat">事件 <b id="s-total">30</b></div>
    <div class="stat">已批注 <b id="s-done">0</b>/30</div>
    <div class="grow"></div>
    <button id="btn-filter">只看未批注</button>
    <button id="btn-reset">清空批注</button>
    <button class="approve" id="btn-approve">全部通过 · 开始写脚本</button>
  </header>

  <div id="body">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>

  <footer>
    <div class="fwrap">
      <textarea id="global" placeholder="全局意见（数值尺度、命名前缀、MTTH、是否要互相排斥…）"></textarea>
      <div class="hint">每条事件下方可单独写意见；右侧按钮一次性提交给我。</div>
    </div>
    <button class="primary" id="btn-submit">提交意见</button>
  </footer>
  <div class="toast" id="toast"></div>
</div>

<script>
const DEITIES = [
{ id:'anemo', group:'七神信仰', name:'巴巴托斯', el:'风', cls:'#7ed6a5', theme:'自由 · 漂泊 · 吟游',
  has:'七神国｜主祭神＝巴巴托斯', scale:'机动与损耗：给全军的"能走、少死人"，不给硬战力',
  events:[
  { code:'A-1', kind:'恩泽', kc:'bless', title:'风起之时',
    text:'蒙德的风一夜之间改了方向。酒馆的门被吹得整夜作响，第二天清晨，驿道上的尘土不见了，商队的车辙深了一寸——车夫说他们赶了三天路，只用了两天。牧羊人发誓看见一个抱着琴的少年坐在城墙上，等他爬上去，只有一朵塞西莉亚花。',
    cond:'主祭神=巴巴托斯；恩泽类，MTTH 约 8 年，和平时权重 ×2',
    opts:[
      {name:'让风带路', eff:[['g','全国修正「风起之时」· 12 年：陆军移动速度 +15%、陆军损耗 −20%'],['g','军事点数 +25']]}
    ]},
  { code:'A-2', kind:'抉择', kc:'choice', title:'无主之歌',
    text:'一名吟游诗人在集市上唱起了不该唱的歌——歌词讲的是神明不该坐在王座上。卫兵要抓人，人群却跟着合唱。风把歌声送进了每一扇窗，连议政厅的窗子也没关严。',
    cond:'主祭神=巴巴托斯；抉择类，MTTH 约 10 年',
    opts:[
      {name:'让它唱：自由是风的本性', eff:[['b','稳定度 −1'],['g','全国修正「自由吟唱」· 10 年：全国叛乱 −2、文化转换成本 −15%']]},
      {name:'封住他的琴', eff:[['g','威望 +10、正统性 +5'],['g','行政点数 +25']]}
    ]},
  { code:'A-3', kind:'仪式', kc:'rite', title:'高天之琴',
    text:'教团请求在都城外办一场持续七日的风花节。费用不轻：酒、花、以及每一座钟楼都要整夜敲响。但风神从不在意形式，祂只在意有没有人抬头看天。',
    cond:'主祭神=巴巴托斯；仪式类，需 250 金币；30 年内只触发一次',
    opts:[
      {name:'办，办足七日（花费 250 金币）', eff:[['g','全国修正「风花节」· 15 年：陆军士气 +10%、外交声望 +1'],['g','外交点数 +50']]},
      {name:'省下这笔钱', eff:[['n','行政点数 +25']]}
    ]}
  ]},

{ id:'geo', group:'七神信仰', name:'摩拉克斯', el:'岩', cls:'#d9b26a', theme:'契约 · 商业 · 坚固',
  has:'七神国｜主祭神＝摩拉克斯', scale:'钱财与守成：税收、造价、契约带来的正统性',
  events:[
  { code:'B-1', kind:'恩泽', kc:'bless', title:'契约之神的天平',
    text:'商人们在港口立起一块新石碑，刻着所有已经兑现的契约。第七天，石碑裂开一道缝，缝里流出的不是水，是金沙。长老说：契约之神在看。也有人说，祂只是在算利息。',
    cond:'主祭神=摩拉克斯；恩泽类，MTTH 约 8 年',
    opts:[
      {name:'立碑为证', eff:[['g','全国修正「岩之契」· 12 年：全国税收 +10%、建造花费 −10%'],['g','行政点数 +25']]}
    ]},
  { code:'B-2', kind:'抉择', kc:'choice', title:'摩拉的重量',
    text:'国库见底，而军饷下月就要发。祭司抬来神库的钥匙，说这笔钱本来就是为了这种时候。可契约上写着：神库只借给还得出的人。你看了看账本，又看了看钥匙。',
    cond:'主祭神=摩拉克斯；抉择类，MTTH 约 10 年；国库 &lt; 2 个月收入时权重 ×3',
    opts:[
      {name:'借', eff:[['g','金币 +200'],['b','稳定度 −1、正统性 −5']]},
      {name:'不借，先勒紧腰带', eff:[['g','行政点数 +50'],['g','正统性 +10、威望 +5']]}
    ]},
  { code:'B-3', kind:'仪式', kc:'rite', title:'璃月港的仲裁',
    text:'两家商会为一条航线的归属吵到总督府，双方都举着契约，两份契约的日期是同一天、同一个时辰。只有神能判。祭司说：判了，就要有人不服。',
    cond:'主祭神=摩拉克斯；仪式类（不花钱，靠裁决），40 年内只触发一次',
    opts:[
      {name:'判给先交货的一家', eff:[['g','全国修正「港规」· 15 年：贸易效率 +10%、商人 +1'],['b','全国叛乱 +1 · 10 年']]},
      {name:'判给两家共有', eff:[['g','全国修正「共契」· 12 年：生产效率 +10%、稳定花费 −10%'],['g','行政点数 +50']]}
    ]}
  ]},

{ id:'electro', group:'七神信仰', name:'巴尔', el:'雷', cls:'#b48cff', theme:'永恒 · 锁国 · 威权',
  has:'七神国｜主祭神＝巴尔', scale:'纪律与秩序：给硬战力，代价是自由与经济',
  events:[
  { code:'C-1', kind:'恩泽', kc:'bless', title:'永恒之愿',
    text:'雷雨在都城外下了四十天，没有一道雷落在城里。占星官翻遍典籍，只说了一句：将军要的是不变。于是那一夜，所有人都梦见了同一把刀，插在同一个位置。',
    cond:'主祭神=巴尔；恩泽类，MTTH 约 8 年',
    opts:[
      {name:'接受永恒', eff:[['g','全国修正「永恒之愿」· 15 年：纪律 +5%、稳定花费 −10%'],['g','军事点数 +25']]}
    ]},
  { code:'C-2', kind:'抉择', kc:'choice', title:'锁国令',
    text:'外邦商船在海面上排成一线，等着进港。老臣跪在殿前，说开门则乱，闭门则穷。雷电将军的雕像在雨里看着这一切，不置一词——祂从来只回答一个问题：要不要变。',
    cond:'主祭神=巴尔；抉择类，MTTH 约 12 年；有贸易节点商船竞争时权重 ×2',
    opts:[
      {name:'锁', eff:[['g','全国修正「锁国」· 15 年：全国叛乱 −3、稳定花费 −15%'],['b','贸易效率 −10%（同一修正内）']]},
      {name:'开', eff:[['g','全国修正「开港」· 15 年：贸易效率 +15%、商人 +1'],['b','全国叛乱 +1 · 10 年']]}
    ]},
  { code:'C-3', kind:'仪式', kc:'rite', title:'千手百眼',
    text:'新的军旗下立着千尊石像，每尊的眼睛都朝向海。军费账目送上来时，将军只写了两个字：值得。财务官在旁边补了一行小字：国库不同意。',
    cond:'主祭神=巴尔；仪式类，花费 150 军事点；30 年内只触发一次',
    opts:[
      {name:'铸像，扩军（花费 150 军事点）', eff:[['g','获得 4 队步兵（首都）'],['g','全国修正「雷罚」· 12 年：冲击伤害 +10%、陆军士气 +5%']]},
      {name:'只铸一尊，意思到了', eff:[['n','威望 +5'],['g','军事点数 +25']]}
    ]}
  ]},

{ id:'dendro', group:'七神信仰', name:'布耶尔', el:'草', cls:'#8fd46a', theme:'智慧 · 梦境 · 发展',
  has:'七神国｜主祭神＝布耶尔', scale:'三系点数与发展：最"干净"的收益，数值给足但不碰军事',
  events:[
  { code:'D-1', kind:'恩泽', kc:'bless', title:'智慧的馈赠',
    text:'须弥的学者在山顶发现一座从未被打开的书库。门没有锁，只要回答一个问题：你为什么要知道？第一个答题的人答"因为不知道难受"，门开了。里面没有书，只有一排空书架和一张写着"写吧"的字条。',
    cond:'主祭神=布耶尔；恩泽类，MTTH 约 10 年；条件：发展度 ≥ 100 或本国拥有大学',
    opts:[
      {name:'翻开', eff:[['g','行政点数 +50、外交点数 +50、军事点数 +50']]}
    ]},
  { code:'D-2', kind:'抉择', kc:'choice', title:'梦境之试',
    text:'全城的孩子在同一个夜里做了同一个梦：一棵树问他们要不要看看明天。醒来后，一半的孩子会写字了，另一半开始说一种没人听得懂的话。学者们争论了三天，最后一致同意：先别叫醒他们。',
    cond:'主祭神=布耶尔；抉择类，MTTH 约 10 年',
    opts:[
      {name:'入梦求知', eff:[['g','行政点数 +100'],['b','稳定度 −1（政务荒废）']]},
      {name:'封梦，先办实务', eff:[['g','稳定度 +1、行政点数 +25'],['g','全国修正「务实」· 10 年：发展成本 −5%']]}
    ]},
  { code:'D-3', kind:'仪式', kc:'rite', title:'兰那罗的园圃',
    text:'林子里的小家伙们答应帮忙，条件是把王家的猎场让出来。它们不种粮食，种的是"会记住事情"的种子。三年后那里会长出一片没人敢砍的森林——因为砍树的人第二天会忘记自己为什么拿斧头。',
    cond:'主祭神=布耶尔；仪式类，花费 200 金币；40 年内只触发一次',
    opts:[
      {name:'答应它们（花费 200 金币）', eff:[['g','全国修正「兰那罗的园圃」· 20 年：发展成本 −10%、思潮传播 +5%、全国叛乱 −1'],['g','行政点数 +25']]},
      {name:'猎场不能给', eff:[['n','军事点数 +50（贵族满意）']]}
    ]}
  ]},

{ id:'hydro', group:'七神信仰', name:'芙卡洛斯', el:'水', cls:'#5fc7e8', theme:'正义 · 审判 · 繁荣',
  has:'七神国｜主祭神＝芙卡洛斯', scale:'繁荣与稳定：繁荣度 + 经济修正，全场唯一直接点繁荣度的信仰',
  events:[
  { code:'E-1', kind:'恩泽', kc:'bless', title:'正义的审判',
    text:'歌剧院的最后一场演出没有演员，只有被告席。被判有罪的是这座城市自己——罪名是"让穷人站在雨里看戏"。判决下来时全场起立，没有人为被告辩护，包括被告。',
    cond:'主祭神=芙卡洛斯；恩泽类，MTTH 约 10 年',
    opts:[
      {name:'执行判决', eff:[['g','首都繁荣度 +1'],['g','全国修正「枫丹的公正」· 15 年：生产效率 +10%、稳定花费 −10%']]}
    ]},
  { code:'E-2', kind:'抉择', kc:'choice', title:'歌剧院的判决',
    text:'一位公爵被指控侵吞赈灾款，证据确凿，但他是三支军团的实际供养人。法官把判决书递到你面前，说：神只问对错，不问代价。窗外的雨下得很有节奏，像在等一个答案。',
    cond:'主祭神=芙卡洛斯；抉择类，MTTH 约 12 年',
    opts:[
      {name:'依法处决', eff:[['g','正统性 +10、行政点数 +50'],['b','全国叛乱 +1 · 10 年']]},
      {name:'特赦，让他连本带利还钱', eff:[['g','金币 +300、外交点数 +50'],['b','正统性 −10']]}
    ]},
  { code:'E-3', kind:'仪式', kc:'rite', title:'水神的谢幕',
    text:'大审判庭要开一场持续三日的公开审判：任何人都可以控告任何人，包括神明自己。祭司说，上一次有人这么干，城市繁荣了整整一代人。他没说的是，上一次主持审判的法官没有活到闭幕。',
    cond:'主祭神=芙卡洛斯；仪式类，花费 250 金币；40 年内只触发一次',
    opts:[
      {name:'开审（花费 250 金币）', eff:[['g','全国修正「大审判庭」· 20 年：全国税收 +10%、全国叛乱 −2'],['g','行政点数 +50']]},
      {name:'不必，留着钱修堤', eff:[['n','行政点数 +25']]}
    ]}
  ]},

{ id:'pyro', group:'七神信仰', name:'玛薇卡', el:'火', cls:'#ff8a5c', theme:'战争 · 热血 · 重生',
  has:'七神国｜主祭神＝玛薇卡', scale:'人力与补员：全场唯一大幅抬人力的信仰，战时收益翻倍',

const $ = s => document.querySelector(s);
const state = { active: DEITIES[0].id, onlyTodo: false, notes: {} };
const TOTAL = DEITIES.reduce((n,d)=>n+d.events.length, 0);

/* ---------- persistence ---------- */
function persist(){
  try{
    if (window.dshHTML && dshHTML.store && typeof dshHTML.store.set === 'function'){
      dshHTML.store.set({ notes: state.notes, global: $('#global').value });
      return;
    }
  }catch(e){}
  try{ localStorage.setItem('archon_notes', JSON.stringify(state.notes)); }catch(e){}
}
function restore(){
  try{
    if (window.dshHTML && dshHTML.store && typeof dshHTML.store.get === 'function'){
      const v = dshHTML.store.get();
      if (v && v.notes) state.notes = v.notes;
      if (v && v.global) $('#global').value = v.global;
      return;
    }
  }catch(e){}
  try{
    const raw = localStorage.getItem('archon_notes');
    if (raw) state.notes = JSON.parse(raw) || {};
  }catch(e){}
}

/* ---------- helpers ---------- */
const keyOf = (d,e) => d.id + '/' + e.code;
const effClass = t => t.charAt(0) === '＋' ? 'g' : (t.charAt(0) === '－' ? 'b' : 'n');

function renderNav(){
  const nav = $('#nav');
  let html = '';
  let lastGroup = '';
  DEITIES.forEach(d=>{
    if (d.group !== lastGroup){
      html += '<div class="navsec">' + d.group + '</div>';
      lastGroup = d.group;
    }
    const done = d.events.filter(e => (state.notes[keyOf(d,e)]||'').trim()).length;
    html += '<div class="navitem' + (state.active===d.id?' on':'') + '" data-id="' + d.id + '">' +
      '<span class="dot" style="background:' + d.cls + '"></span>' +
      '<span>' + d.name + '</span>' +
      '<span class="cnt' + (done===3?' done':'') + '">' + done + '/3</span></div>';
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.navitem').forEach(el=>{
    el.onclick = ()=>{ state.active = el.dataset.id; renderNav(); renderMain(); $('#main').scrollTop = 0; };
  });
}

function renderMain(){
  const d = DEITIES.find(x=>x.id===state.active);
  const main = $('#main');
  let evs = d.events.slice();
  if (state.onlyTodo) evs = evs.filter(e => !(state.notes[keyOf(d,e)]||'').trim());

  let html = '<div class="dhead">' +
    '<div class="k">' + d.group + ' · ' + d.el + '</div>' +
    '<h2><span style="color:' + d.cls + '">' + d.name + '</span></h2>' +
    '<div class="sub">' + d.theme + '</div>' +
    '<div class="badgerow">' +
      '<span class="badge">' + d.has + '</span>' +
      '<span class="badge good">设计定位：' + d.scale + '</span>' +
    '</div></div>';

  if (!evs.length){
    html += '<div class="card"><div class="lbl">全部已批注</div><div class="flavor">这一组三条都写了意见，切到下一组，或者直接点右上角"提交意见"。</div></div>';
  }

  evs.forEach(e=>{
    const k = keyOf(d,e);
    const note = state.notes[k] || '';
    html += '<section class="card' + (note.trim()?' annotated':'') + '">';
    html += '<div class="chead"><span class="idx">' + d.id.toUpperCase() + ' · ' + e.code + '</span>' +
            '<span class="kind ' + e.kc + '">' + e.kind + '</span>' +
            '<h3>' + e.title + '</h3></div>';
    html += '<div class="lbl">文本</div><div class="flavor">' + e.text + '</div>';
    html += '<div class="lbl">选项与效果</div>';
    e.opts.forEach((o,i)=>{
      html += '<div class="opt"><div class="on"><span class="lead">' + String.fromCharCode(65+i) + '.</span>' + o.name + '</div><ul class="eff">';
      o.eff.forEach(f=>{ html += '<li class="' + f[0] + '">' + f[1] + '</li>'; });
      html += '</ul></div>';
    });
    html += '<div class="cond">触发建议：<code>' + e.cond + '</code></div>';
    html += '<textarea placeholder="对这条的意见…（留空＝没问题，按原样收）" data-key="' + k + '">' + note.replace(/</g,'&lt;') + '</textarea>';
    html += '</section>';
  });

  main.innerHTML = html;
  main.querySelectorAll('textarea').forEach(t=>{
    t.oninput = ()=>{ state.notes[t.dataset.key] = t.value; persist(); updateStat(); };
    t.onblur = ()=>{ state.notes[t.dataset.key] = t.value; persist(); renderNav(); updateStat(); };
  });
}

function updateStat(){
  const done = Object.values(state.notes).filter(v => (v||'').trim()).length;
  $('#s-done').textContent = done;
  $('#s-total').textContent = TOTAL;
}

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'), 2200);
}

/* ---------- events ---------- */
$('#btn-filter').onclick = ()=>{
  state.onlyTodo = !state.onlyTodo;
  $('#btn-filter').textContent = state.onlyTodo ? '显示全部' : '只看未批注';
  renderMain();
};
$('#btn-reset').onclick = ()=>{
  state.notes = {}; persist(); renderNav(); renderMain(); updateStat(); toast('批注已清空');
};
$('#btn-submit').onclick = ()=>{
  const items = [];
  DEITIES.forEach(d=>d.events.forEach(e=>{
    const v = (state.notes[keyOf(d,e)]||'').trim();
    if (v) items.push({ deity:d.name, group:d.group, code:e.code, title:e.title, comment:v });
  }));
  const g = $('#global').value.trim();
  if (!items.length && !g){ toast('还没有写任何意见'); return; }
  const payload = { comments: items, global: g };
  try{ if (window.dshHTML) dshHTML.send('feedback', payload); }catch(e){}
  persist();
  toast('已提交 ' + items.length + ' 条意见');
};
$('#btn-approve').onclick = ()=>{
  const payload = { approved:true, total:TOTAL, unresolved: Object.values(state.notes).filter(v=>(v||'').trim()).length };
  try{ if (window.dshHTML) dshHTML.send('approve', payload); }catch(e){}
  toast('已按"全部通过"提交');
};
$('#global').oninput = persist;

restore(); renderNav(); renderMain(); updateStat();
</script>
</body>
