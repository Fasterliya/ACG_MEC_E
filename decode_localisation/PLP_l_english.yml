l_english:
 PLP_awakening: "紫曜觉醒"
 PLP_awakening_desc: "沉睡的守护女神自紫曜之都的深处苏醒。涅普缇努伸了个懒腰——虽然她更想再睡一会儿，但既然信徒们都在期待，那就认真当一回女神吧。紫曜的旗帜在信德的天空下升起。"
 PLP_sindh_dominion: "信德的女神"
 PLP_sindh_dominion_desc: "信德的城邦已向紫曜之都俯首。涅普缇努亲自检阅了人间的军队——步兵们惊讶地发现，这位女神纠正军姿的样子意外地可靠。"
 PLP_north_sindh: "北信德壁垒"
 PLP_north_sindh_desc: "北信德的要塞修葺一新，守军士气高昂。涅普缇努给每个堡垒都取了可爱的名字——虽然守将们觉得叫「布丁要塞」有点丢脸，但没人敢反对女神。"
 PLP_patan: "巴坦演武"
 PLP_patan_desc: "巴坦平原上，女神亲自指挥了一场盛大的演武。士兵们发现，只要提到「打完仗就发布丁」，士气就会奇迹般高涨。"
 PLP_gujarat_coast: "湾岸女神"
 PLP_gujarat_coast_desc: "古吉拉特的海岸线纳入版图。涅普缇努站在船头，自称「海之女神」——尽管她晕船的样子被妮普吉雅悄悄记在了日记里。"
 PLP_kathiawar: "半岛征服者"
 PLP_kathiawar_desc: "卡提瓦尔半岛的烽火平息。紫曜的炮火与剑光让整个西印度记住了这位女神的威名——涅普缇努的称号列表又变长了。"
 PLP_malwa: "马尔瓦的紫旗"
 PLP_malwa_desc: "马尔瓦高原升起了紫曜的旗帜。女神军队的步兵与炮兵阵列如山，游汐叶界的传说在人间战场再次上演。"
 PLP_eternal_capital: "永恒紫曜之都"
 PLP_eternal_capital_desc: "当疆域辽阔到足以承载整个梦想，涅普缇努将国度更名为「永恒紫曜之都」——这是女神对子民的承诺：紫曜的光芒将永远照耀这片土地，如同游汐叶界中永不熄灭的游戏之心。"
 PLP_harbor: "商港繁荣"
 PLP_harbor_desc: "信德的港口千帆竞发。涅普缇努发现贸易比想象中有趣——毕竟，有钱才能买更多的布丁。"
 PLP_market: "集市网络"
 PLP_market_desc: "集市如雨后春笋般遍布全国。女神的子民们学会了讨价还价的艺术，涅普缇努偶尔也会混进集市，用女神的名义换一根烤串。"
 PLP_guild: "商人行会"
 PLP_guild_desc: "商人行会成立，紫曜的商人们把货物运往远方。涅普缇努亲自设计了行会的徽章——据说上面画着一只布丁。"
 PLP_node_dominance: "节点主导"
 PLP_node_dominance_desc: "紫曜的商船主导了贸易节点。涅普缇努宣布：「从今天起，这里的每一枚金币都要交一份布丁税！」——当然，只是玩笑。"
 PLP_route: "商路延伸"
 PLP_route_desc: "商路向远方延伸，紫曜的货物穿越沙漠与海洋。女神派出的商队总能带回稀奇的玩意儿——以及各地的布丁配方。"
 PLP_caravan: "商队网络"
 PLP_caravan_desc: "庞大的商队网络覆盖了通往东方的道路。紫曜之都的名字随着商队的驼铃声传遍四方。"
 PLP_trade_route: "紫曜商路"
 PLP_trade_route_desc: "紫曜商路成为东西方贸易的大动脉。涅普缇努骄傲地宣布，这是她「认真工作」的成果——尽管她只工作了五分钟。"
 PLP_trade_queen: "世界商路女王"
 PLP_trade_queen_desc: "紫曜的商船驶向已知世界的每一个角落。涅普缇努加冕为「世界商路女王」——她表示头衔太长，还是叫她「最强的女神」就好。"
 PLP_granary: "信德粮仓"
 PLP_granary_desc: "信德的田野丰收，粮仓充盈。女神下令：「让所有人都吃饱，这样才有力气陪我玩！」——这大概是紫曜之都最得民心的政策。"
 PLP_workshop_start: "工坊启蒙"
 PLP_workshop_start_desc: "第一座工坊在紫曜之都落成。涅普缇努对工匠们的手艺赞不绝口，并亲自提供了设计建议——虽然图纸上画的是布丁。"
 PLP_craft: "工匠网络"
 PLP_craft_desc: "工匠网络遍布全国，紫曜的工艺品质闻名遐迩。妮普吉雅负责监督生产——她比姐姐认真得多，这点谁都知道。"
 PLP_vault: "金库充盈"
 PLP_vault_desc: "紫曜的金库堆满了金币。涅普缇努偶尔会溜进金库，把自己埋进金币堆里——她说这是「女神的例行检查」。"
 PLP_tax: "税制整理"
 PLP_tax_desc: "税制被整理得井井有条。女神亲自审阅了税册，虽然她看不太懂，但坚持要在这件事上「表现出女神的威严」。"
 PLP_industrial: "生产革命"
 PLP_industrial_desc: "工坊的炉火昼夜不息，紫曜的工业迎来革命。涅普缇努宣称这是她领导的结果——实际上大部分工作都是妮普吉雅做的。"
 PLP_rich_vault: "紫耀金库"
 PLP_rich_vault_desc: "紫耀的金库深不见底。女神开始考虑用金币给首都铺路——被财政大臣以死相谏后，她只好遗憾地放弃了这个计划。"
 PLP_economy: "紫耀经济帝国"
 PLP_economy_desc: "紫曜之都的经济版图横跨大陆。涅普缇努终于可以买下全世界的布丁——她对此非常满意。"
 PLP_preach: "女神布道"
 PLP_preach_desc: "女神亲自布道，信众如潮。涅普缇努的讲道通俗易懂——核心内容是「相信女神就能幸福，顺便记得供奉布丁」。"
 PLP_spread: "女神教传播"
 PLP_spread_desc: "女神教的信仰在新征服的土地上生根发芽。祭司们四处传教，涅普缇努偶尔会「神降」到集市上检验信仰的纯度。"
 PLP_temple: "神殿网络"
 PLP_temple_desc: "神殿在各地拔地而起。信徒们供奉的祭品以布丁为最——祭司们不得不立法限制布丁的供奉数量，以防神殿被甜食淹没。"
 PLP_orthodox: "女神正统"
 PLP_orthodox_desc: "女神教确立了正统教义——《布丁福音书》正式编撰完成，成为信徒们的精神食粮。"
 PLP_zeal: "信仰火焰"
 PLP_zeal_desc: "信仰的火焰在紫曜的国土上熊熊燃烧。涅普缇努的狂热信徒们开始自称「紫曜十字军」——女神觉得这名字很酷，就默许了。"
 PLP_cathedrals: "圣殿群"
 PLP_cathedrals_desc: "宏伟的圣殿群环绕着紫曜之都。每一座圣殿都供奉着女神的雕像——雕像手中的布丁格外醒目。"
 PLP_devotee: "狂热信徒"
 PLP_devotee_desc: "狂热的信仰转化为力量。守军们相信女神与他们同在——事实也确实如此，涅普缇努偶尔会溜到城墙上「巡视」。"
 PLP_goddom: "紫耀神国"
 PLP_goddom_desc: "紫曜之都升华为名副其实的神国。女神教的钟声响彻四方，涅普缇努终于可以名正言顺地自称「紫耀的神」——虽然她一直这么自称。"
 PLP_blend: "文化融合"
 PLP_blend_desc: "普兰提努的文化与当地风俗开始融合。涅普缇努发现，把紫曜的节庆和当地传统结合起来，能收获双倍的快乐——和双倍的布丁。"
 PLP_planeptune: "普兰提努化"
 PLP_planeptune_desc: "紫曜的生活方式逐渐普及。人们开始用女神的问候语打招呼，集市上飘着紫曜风味小吃的香气。"
 PLP_language: "语言统一"
 PLP_language_desc: "紫曜的语言成为通用语。涅普缇努亲自编写了教材——第一课是「如何优雅地向女神打招呼」，第二课是「布丁的一百种吃法」。"
 PLP_sphere: "紫曜文化圈"
 PLP_sphere_desc: "紫曜文化圈在印度次大陆悄然成型。异乡人开始向往紫曜之都——那里据说有吃不完的布丁和一位可爱的女神。"
 PLP_cultural_power: "文化霸权"
 PLP_cultural_power_desc: "紫曜的文化成为令人向往的潮流。吟游诗人们传唱着紫曜女神的传说——虽然传说里女神总是和布丁一起出现。"
 PLP_assimilation: "同化浪潮"
 PLP_assimilation_desc: "同化的浪潮席卷全国。旧日的文化差异在紫曜的融合政策下渐渐消融，人们以身为紫曜子民为荣。"
 PLP_eternal_culture: "永恒紫曜文化"
 PLP_eternal_culture_desc: "紫曜文化渗透到社会的每一个角落。连最偏远的村庄都知道紫曜女神的传说——以及布丁的传说。"
 PLP_cultural_empire: "紫曜文化帝国"
 PLP_cultural_empire_desc: "从信德到马尔瓦，紫曜文化成为不可动摇的主流。涅普缇努的国度既是疆域的帝国，也是文化的帝国——女神对此评价：「这才像话嘛！」"

 PLP_purple_heart_reform: "紫心女神政体"
 PLP_purple_heart_reform_desc: "涅普缇努解放了女神之力，化身为紫色之心（Purple Heart）统御国度。在女神形态下，她的军队如紫电般迅捷，她的子民沐浴在紫曜的恩泽之中——当然，女神形态的她也依然爱吃布丁。"

 PLP_eternal_purple_capital: "永恒紫曜之都"

 PLP_missions_1_1_title: "紫曜觉醒"
 PLP_missions_1_1_desc: "紫曜之都的守护女神从沉睡中苏醒。是时候向这个世界宣告——涅普缇努，女神，降临！第一步，当然是先确立女神的威严（和政体）。"
 PLP_missions_1_2_title: "统一信德"
 PLP_missions_1_2_desc: "信德是紫曜之都的家园。作为女神，首先要让家门口的城邦都承认你的权威——如果他们不承认，就让他们见识见识女神军队的实力。"
 PLP_missions_1_3_title: "北信德开拓"
 PLP_missions_1_3_desc: "北信德的土地等待着紫曜的旗帜。筑起堡垒，稳固后方，女神的后花园必须固若金汤。"
 PLP_missions_1_4_title: "巴坦平原"
 PLP_missions_1_4_desc: "巴坦平原是通往古吉拉特的门户。女神军队在此演武练兵，为接下来的征服积蓄力量。"
 PLP_missions_1_5_title: "古吉拉特湾岸"
 PLP_missions_1_5_desc: "古吉拉特的海岸线富庶而繁华。把这片湾岸纳入版图，紫曜之都就有了通向海洋的窗口——也能进口更多布丁。"
 PLP_missions_1_6_title: "卡提瓦尔半岛"
 PLP_missions_1_6_desc: "卡提瓦尔半岛伸入海洋，是商路的要冲。女神的炮火将让这片半岛明白，紫曜的意志不可违抗。"
 PLP_missions_1_7_title: "马尔瓦高原"
 PLP_missions_1_7_desc: "马尔瓦高原是西印度的腹地。征服这里，西印度将尽归紫曜——女神的版图正在变成她想要的样子。"
 PLP_missions_1_8_title: "永恒紫曜之都"
 PLP_missions_1_8_desc: "当疆域足够辽阔，梦想足够宏大，紫曜之都将升华为「永恒紫曜之都」。这是女神与子民的约定——紫曜之光，永世不灭。"
 PLP_missions_2_1_title: "商港繁荣"
 PLP_missions_2_1_desc: "信德的港口是紫曜之都的门面。让商船云集，让贸易兴旺——女神需要足够的金币来维持「布丁储备计划」。"
 PLP_missions_2_2_title: "集市网络"
 PLP_missions_2_2_desc: "集市是城市的血脉。在全国建立起繁荣的集市网络，让紫曜的每一座城市都充满活力。"
 PLP_missions_2_3_title: "商人行会"
 PLP_missions_2_3_desc: "组织商人行会，让紫曜的商人们团结起来。女神保证：行会成员可以优先品尝御用布丁。"
 PLP_missions_2_4_title: "节点主导"
 PLP_missions_2_4_desc: "主导古吉拉特贸易节点，让紫曜的商船成为这片海域最强大的力量。女神的旗帜将在贸易榜单上高居榜首。"
 PLP_missions_2_5_title: "商路延伸"
 PLP_missions_2_5_desc: "商路向远方延伸，通往阿拉伯海与更远的世界。紫曜的商人将像女神一样，走到哪里都受欢迎——至少金币很受欢迎。"
 PLP_missions_2_6_title: "商队网络"
 PLP_missions_2_6_desc: "组建庞大的商队网络，让紫曜的货物穿越沙漠与海洋。丝绸之路上的每一支商队都该认得紫曜的旗帜。"
 PLP_missions_2_7_title: "紫曜商路"
 PLP_missions_2_7_desc: "紫曜商路成为东西方贸易的大动脉。女神宣布，这条商路的名字是「以她之名命名」——虽然她只是恰好在场。"
 PLP_missions_2_8_title: "世界商路女王"
 PLP_missions_2_8_desc: "当紫曜的商人遍布世界，涅普缇努将加冕为世界商路女王。头衔很长，但女神的称号一向很长——「涅普缇努·紫耀·永恒·布丁·女神」，听起来如何？"
 PLP_missions_3_1_title: "信德开发"
 PLP_missions_3_1_desc: "发展信德的土地，让紫曜之都的家园繁荣富庶。女神的子民值得更好的生活——以及更多的布丁。"
 PLP_missions_3_2_title: "工坊启蒙"
 PLP_missions_3_2_desc: "建立第一座工坊，开启紫曜的工业时代。女神对工匠的技艺充满信心——至少比她自己动手强。"
 PLP_missions_3_3_title: "工匠网络"
 PLP_missions_3_3_desc: "让工坊遍布全国，紫曜的工匠技艺闻名遐迩。优质的产品是紫曜的名片——仅次于女神本人的魅力。"
 PLP_missions_3_4_title: "金库充盈"
 PLP_missions_3_4_desc: "让紫曜的金库充盈起来。财政大臣说这是为了国家，涅普缇努知道，这其实是为了布丁自由。"
 PLP_missions_3_5_title: "税制整理"
 PLP_missions_3_5_desc: "整理税制，让税收更加高效公平。女神亲自监督——虽然她只负责在税册上签名，但签名也很重要。"
 PLP_missions_3_6_title: "生产革命"
 PLP_missions_3_6_desc: "掀起生产革命，让紫曜的工坊昼夜不息。产量翻倍，品质依旧——这是紫曜工匠的骄傲。"
 PLP_missions_3_7_title: "紫耀金库"
 PLP_missions_3_7_desc: "金库中的财富堆积如山。女神开始认真地考虑：是把它们铸成金币，还是铸成布丁形状的金币？"
 PLP_missions_3_8_title: "紫耀经济帝国"
 PLP_missions_3_8_desc: "紫曜之都的经济实力足以傲视群雄。当女神的金币足以买下整个世界，世界就会认真听女神说话。"
 PLP_missions_4_1_title: "女神布道"
 PLP_missions_4_1_desc: "派遣传教士传播女神教——「信女神，得布丁」。涅普缇努亲自为传教士们培训，虽然培训内容主要是她自己的英姿。"
 PLP_missions_4_2_title: "女神教传播"
 PLP_missions_4_2_desc: "让女神教的信仰在新土地上扎根。紫曜的光芒所至，女神之名远扬——祭坛上的布丁供奉也会越来越多。"
 PLP_missions_4_3_title: "神殿网络"
 PLP_missions_4_3_desc: "修建神殿，让信徒们有地方供奉女神。每座神殿都有一座女神的雕像——雕像的姿势是她精心设计的。"
 PLP_missions_4_4_title: "女神正统"
 PLP_missions_4_4_desc: "确立女神教的正统教义，消除异端杂音。女神的话就是真理——而真理的第一条是「布丁是神圣的」。"
 PLP_missions_4_5_title: "信仰火焰"
 PLP_missions_4_5_desc: "让信仰的火焰烧得更旺。狂热的信徒是紫曜最坚定的支柱——他们甚至愿意为女神献上最后一颗布丁。"
 PLP_missions_4_6_title: "圣殿群"
 PLP_missions_4_6_desc: "建造宏伟的圣殿群，让紫曜之都成为信仰的中心。朝圣者从四面八方赶来，瞻仰女神的光辉。"
 PLP_missions_4_7_title: "狂热信徒"
 PLP_missions_4_7_desc: "当信徒的狂热达到顶点，女神的力量也将达到顶峰。守军们高呼女神之名作战——他们的勇气无可匹敌。"
 PLP_missions_4_8_title: "紫耀神国"
 PLP_missions_4_8_desc: "紫曜之都成为真正的神国。女神教的钟声回荡在每一座城市，涅普缇努终于实现了「让全世界都信仰我」的梦想——虽然她嘴上说这只是「顺便」。"
 PLP_missions_5_1_title: "文化融合"
 PLP_missions_5_1_desc: "让普兰提努的文化与本土风俗交融。女神的包容与魅力，能让最陌生的土地也感受到紫曜的温度。"
 PLP_missions_5_2_title: "普兰提努化"
 PLP_missions_5_2_desc: "推广紫曜的生活方式与习俗。当人们习惯了女神节庆与紫曜美食，他们就再也离不开紫曜了。"
 PLP_missions_5_3_title: "语言统一"
 PLP_missions_5_3_desc: "统一语言，让紫曜的言语成为共识。沟通顺畅的国度，才能凝聚成坚不可摧的整体——女神深谙此道。"
 PLP_missions_5_4_title: "紫曜文化圈"
 PLP_missions_5_4_desc: "构建紫曜文化圈，让紫曜的价值观深入人心。文化的征服比刀剑更持久——但女神两者都要。"
 PLP_missions_5_5_title: "文化霸权"
 PLP_missions_5_5_desc: "紫曜文化成为地区的主流。异乡人开始模仿紫曜的服饰与礼仪——女神对此的评价是：「品味不错！」"
 PLP_missions_5_6_title: "同化浪潮"
 PLP_missions_5_6_desc: "同化的浪潮席卷全国。旧日隔阂在紫曜的融合中消融，所有人都是女神的孩子——紫曜的孩子。"
 PLP_missions_5_7_title: "永恒紫曜文化"
 PLP_missions_5_7_desc: "让紫曜文化永恒传承。从都市到乡村，紫曜的精神深入每一寸土地——正如女神的光芒无处不在。"
 PLP_missions_5_8_title: "紫曜文化帝国"
 PLP_missions_5_8_desc: "紫曜文化帝国屹立于世。当整个国度都说紫曜的语言、过紫曜的节庆、爱戴他们的女神，涅普缇努的梦想便真正完成了——「这下总该承认我是最强的女神了吧？」"
