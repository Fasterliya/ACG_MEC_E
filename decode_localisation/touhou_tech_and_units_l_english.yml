 cavalry_lgk_t14_01: "现代化月人轻骑兵"
 cavalry_lgk_t14_01DESCR: "月人的轻骑兵专精于进行远距战斗。"
 cavalry_lgk_t17_01: "现代化月人重骑兵"
 cavalry_lgk_t17_01DESCR: "重骑兵是骑士的荣耀升级版。他们身披重甲，于战斗中挥舞长剑。"
