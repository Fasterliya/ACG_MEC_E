 infantry_lcu_t1_01: "月兔进攻步兵"
 infantry_lcu_t1_01DESCR: "攻击步兵由专精于进攻的凶猛勇士组成。装备着月球的钢材以及轻型的火力，这些狂热份子会把自身安危置之度外以冲入战斗。"
 infantry_lcu_t1_02: "月兔防御步兵"
 infantry_lcu_t1_02DESCR: "不像用于进攻的同行，防御步兵是由在战斗中运用战术而非嗜血的的月兔组成的。由于月兔的自身素质阵亡率仍旧是居高不下。"
 infantry_lcu_t5_01: "月兔劫掠者"
 infantry_lcu_t5_01DESCR: "战争并不总是决胜于沙场，也会较量于后勤。针对这种情况，月人把他们的一些宠物训练成了完美的劫掠者，其可于敌方的土地上保持存在。"
 infantry_lcu_t5_02: "月兔狂热者"
 infantry_lcu_t5_02DESCR: "狂热者是前线的战士。以牺牲其防护装备来换取骇人的武具。"
 infantry_lcu_t9_01: "月兔陆战队"
 infantry_lcu_t9_01DESCR: "由于幻想乡的动荡以及人类为抵达月球而奋斗，月人重启了正式的陆战队计划，该计划对月兔加以强征及高强度训练。最是声名狼藉的陆战队员为曾经的铃仙·优昙华院·因幡。"
 infantry_lcu_t9_02: "月兔净化者"
 infantry_lcu_t9_02DESCR: "月人派出部队以净化所有的不洁之地。净化的流程有很多种模样，不过最常用的净化还是用火。要是有人告诉了兔子们说她们的耳朵很容易被点着……"
 infantry_lcu_t13_01: "月兔线列步兵"
 infantry_lcu_t13_01DESCR: "经过了严格训练的月兔兵以避免像过去那样开小差。"
 infantry_lcu_t13_02: "月兔掷弹兵"
 infantry_lcu_t13_02DESCR: "勇敢且精锐的千锤百炼月兔兵佼佼者。"
 infantry_lcu_t19_01: "月面精英陆战队"
 infantry_lcu_t19_01DESCR: "自月之民与八云紫之间展开的第一次战争中的那时造就的老兵。其经验、护甲、武器及战斗意志，只有皇家卫队能够超越。"
 infantry_lcu_t26_01: "月兔皇家卫队"
 infantry_lcu_t26_01DESCR: "月人的兵没有预期寿命可言，无论如何，她们唯一有价值之处是其武器。然而，皇家卫队则并非是如此情况。这些兔子不仅在众多战斗中幸存了下来，而且对此还取得了胜利。凭借其长期以来的经验以及月人领域中的高质量武器，皇家卫队成了军事领域中最令人忌惮的部队。"
