 cavalry_lgk_t23_01DESCR: "龙骑兵是一种编制特殊的骑兵，旨在通过马匹来将步兵送抵前线。大多数情况下由一位月人指挥骑马附带运送四只月兔士兵。龙骑兵的优点在于不再会有月人的性命在前线受到威胁。"
 cavalry_lgk_t28_01: "现代化月人胸甲骑兵s"
