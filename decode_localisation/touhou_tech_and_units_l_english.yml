 cavalry_gen_t28_02DESCR: "通过活用她们的速度及操风术使得仅是小部队规模的天狗也是相当的危险。"
 cavalry_lcu_t1_01: "月人游猎者"
 cavalry_lcu_t1_01DESCR: "月面的防守从来不需要靠骑兵，但是仍有一些月人想要在军队中服务。通常这些月人会是狩猎的爱好者，不过他们比起骑上月球的马匹的月兔还是要更胜一筹的。"
 cavalry_lcu_t1_02: "地狱妖精骑手"
 cavalry_lcu_t1_02DESC: "单纯的地狱妖精，还在练习骑术中。考虑到他们的经验，其尚不能发挥出他们的全部潜力，不过他们依然是用于战斗的雄厚资本。"
 cavalry_lcu_t6_01: "月人比武者"
 cavalry_lcu_t6_01DESCR: "比武者和一般的游猎者相比在骑术方面有着更丰富的经验。然而，他们依然只是从长枪比武中学到战斗经验的月人骑手罢了。"
 cavalry_lcu_t6_02: "地狱妖精冲锋者"
 cavalry_lcu_t6_02DESCR: "在见到稚嫩的骑手有着成功的曙光后，赫卡提亚决定在妖精军营内保留一所正经的骑术学校。这次试验的结果便是有了胜任的地狱妖精骑手，其坐于驯服的幻想乡野兽上冲入战斗。"
 cavalry_lcu_t10_01: "月人骑士"
 cavalry_lcu_t10_01DESCR: "骑士是正经的战士以及骑手。他们在机动与战斗方面的技巧均远胜于比武者或游猎者。"
 cavalry_lcu_t17_01: "月人重骑兵"
 cavalry_lcu_t17_01DESCR: "重骑兵是骑士的荣耀升级版。他们身披重甲，于战斗中挥舞长剑。"
 cavalry_lcu_t23_01: "月人龙骑兵"
 cavalry_lcu_t23_01DESCR: "龙骑兵是一种编制特殊的骑兵，旨在通过马匹来将步兵送抵前线。大多数情况下由一位月人指挥骑马附带运送四只月兔士兵。龙骑兵的优点在于不再会有月人的性命在前线受到威胁。"
 cavalry_lcu_t28_01: "月人胸甲骑兵"
 cavalry_lcu_t28_01DESCR: "胸甲骑兵是月人的骑术精英。威武的月人指挥官会带领这些骑兵奔向胜利！"
 cavalry_lgk_t1_01: "现代化月人游猎者"
