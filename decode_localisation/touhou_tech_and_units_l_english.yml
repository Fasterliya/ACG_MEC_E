 infantry_lgk_t12_01: "现代化战兔"
 infantry_lgk_t12_01DESCR: "「战兔」是月人的敌人们为月人的兵取下的绰号，其在多于一场的作战中幸存了下来——对月兔来说这并不寻常。其最大的本领便是将生存的本能结合至杀手的直觉。"
