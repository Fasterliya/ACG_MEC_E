l_english:

 FTN: "枫丹"
 FTN_ADJ: "枫丹的"
 FTN_ADJ2: "枫丹的"
 FTN_ideas: "枫丹理念"
 FTN_ideas_start: "枫丹传统"
 FTN_ideas_start_desc: "水自有其秩序：涨落有时，审判有据。枫丹人相信，只要法庭仍在开庭、歌剧仍在开演，文明就没有沉没。"
 FTN_ideas_bonus: "枫丹野心"
 FTN_ideas_bonus_desc: "正义不该只在一国之内实现。枫丹要让每一条河流、每一座港口都记得：水会流向低处，而审判终会抵达。"
 FTN_idea_1: "最高审判庭"
 FTN_idea_1_desc: "在枫丹，贵族与平民站在同一道栏杆前。判决一旦落下，连水神也不能随意更改——这让每一次判决都足以平息街巷的怒气。"
 FTN_idea_2: "水神的神谕"
 FTN_idea_2_desc: "水神的声音从歌剧院的水面传来，宣告的既是神意，也是国是。臣民听得懂：那不是预言，那是命令。"
 FTN_idea_3: "歌剧与舆论"
 FTN_idea_3_desc: "枫丹的报纸比军舰更快抵达邻国，歌剧院里的一个段子能毁掉一位部长的前程。舆论是这里最锋利的武器，也是最体面的外交。"
 FTN_idea_4: "发条工坊"
 FTN_idea_4_desc: "从钟楼到港口吊机，枫丹把时间拆成齿轮再装回去。工匠们相信，凡是能被计算的东西，就一定能被做得更好。"
 FTN_idea_5: "律法之邦"
 FTN_idea_5_desc: "律法写在石头上，也写在每一个官吏的日常里。办一件事需要几道手续、盖几个印，枫丹人一清二楚——这让庞大的国家仍然运转如钟。"
 FTN_idea_6: "水上舰队"
 FTN_idea_6_desc: "枫丹的船坞终年潮湿，木料与铁件在雾气里成型。舰队不必远征，只要守住河口，就能让整条商路听命于法庭。"
 FTN_idea_7: "正义决斗"
 FTN_idea_7_desc: "当辩论无法分出胜负，枫丹人会走向决斗场。这不是野蛮的残余，而是最后一道程序——输赢由天意裁定，输家必须服判。"
