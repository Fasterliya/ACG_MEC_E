 ### MISSION TITLES ###

 BLS_missions_1: "守岸人之地"
 BLS_missions_2: "潮声航线"
 BLS_missions_3: "永夜之壁"
 BLS_missions_4: "鸣潮远征"
 BLS_missions_5: "黑海岸霸业"

 BLS_missions_1_1_title: "统一婆罗洲"
 BLS_missions_1_1_desc: "黑海岸的根基在婆罗洲。守岸人世代守望的每一寸土地都必须置于旗帜之下，以潮声为誓，统一整个婆罗洲。"
 BLS_missions_1_2_title: "发展之心"
 BLS_missions_1_2_desc: "首都是黑海岸跳动的心脏。让首都的繁荣远超四方，以财富与人力供养整个守望之国。"
 BLS_missions_1_3_title: "海防壁垒"
 BLS_missions_1_3_desc: "黑海岸以海为家，也以海为屏。在要地筑起坚固的要塞，让任何来犯之敌都寸步难行。"
 BLS_missions_1_4_title: "守望者议会"
 BLS_missions_1_4_desc: "守岸人并非孤身一人。召集贤能，稳定国政，让守望的意志在议会的灯火中代代相传。"
 BLS_missions_1_5_title: "传承永续"
 BLS_missions_1_5_desc: "当黑海岸的根基稳固、人心安定，守望者的传承将永不熄灭。这片海岸，将永远是潮声与守护的家园。"

 BLS_missions_2_1_title: "潮声商路"
 BLS_missions_2_1_desc: "商人们沿潮声往来四海。派遣商人，让黑海岸的名字随着货船传遍整个马六甲海域。"
 BLS_missions_2_2_title: "通达之潮"
 BLS_missions_2_2_desc: "提高贸易效率，让每一艘商船都满载而归。潮水带来远方的财富，也带来远方的敬意。"
 BLS_missions_2_3_title: "香料寻迹"
 BLS_missions_2_3_desc: "香料群岛的芬芳是海商的梦想。沿潮声向东，将香料产地纳入黑海岸的贸易版图。"
 BLS_missions_2_4_title: "马六甲之主"
 BLS_missions_2_4_desc: "掌控马六甲，便掌控了东方的咽喉。让黑海岸成为这片海域无可争议的贸易主宰。"
 BLS_missions_2_5_title: "黄金商路"
 BLS_missions_2_5_desc: "当黄金如潮水般涌入国库，黑海岸将拥有足以撼动整个东方世界的力量。"

 BLS_missions_3_1_title: "舰船集结"
 BLS_missions_3_1_desc: "守望之海需要强大的舰队。扩充港口，让无数战船在潮声中整齐列阵。"
 BLS_missions_3_2_title: "制海权"
 BLS_missions_3_2_desc: "赢得海战的胜利，让海军传统在战火中淬炼。黑海岸的旗帜将在每一片海域扬起。"
 BLS_missions_3_3_title: "永夜舰队"
 BLS_missions_3_3_desc: "即使在永夜，舰队也能找到归路。建造强大的重舰编队，让黑夜成为黑海岸的盟友。"
 BLS_missions_3_4_title: "潮汐壁垒"
 BLS_missions_3_4_desc: "扩充海军规模，让黑海岸拥有足以封锁整个海域的庞大战力。"
 BLS_missions_3_5_title: "深海霸权"
 BLS_missions_3_5_desc: "当黑海岸的舰队强大到无人能敌，大海便不再是边界，而是黑海岸真正的疆域。"

 BLS_missions_4_1_title: "跨海进军"
 BLS_missions_4_1_desc: "越过海峡，踏上马来半岛。潮声所指，便是黑海岸征服的方向。"
 BLS_missions_4_2_title: "群岛之潮"
 BLS_missions_4_2_desc: "从苏门答腊到爪哇，印尼群岛的富庶等待着守岸人的统御。以潮为剑，以浪为盾。"
 BLS_missions_4_3_title: "南海之望"
 BLS_missions_4_3_desc: "向南中国海的岛屿进军，将黑海岸的守望延伸到每一片漂浮的陆地。"
 BLS_missions_4_4_title: "中南之岸"
 BLS_missions_4_4_desc: "登上中南半岛的海岸，让黑海岸的威名从海洋蔓延至大陆。"
 BLS_missions_4_5_title: "海洋帝国"
 BLS_missions_4_5_desc: "当马来与印尼尽归黑海岸所有，一个以海洋为疆土的帝国便已屹立于东方。"

 BLS_missions_5_1_title: "声望远扬"
 BLS_missions_5_1_desc: "让黑海岸的名号响彻四方。威望，是守望者最重要的财富。"
 BLS_missions_5_2_title: "万国来朝"
 BLS_missions_5_2_desc: "以羁绊而非恐惧维系属国。让四方国度自愿臣服于黑海岸的潮声之下。"
 BLS_missions_5_3_title: "大国之姿"
 BLS_missions_5_3_desc: "跻身列强之林。黑海岸不仅是海上的主宰，更将成为世界的强权。"
 BLS_missions_5_4_title: "黑海帝冠"
 BLS_missions_5_4_desc: "加冕为帝国。黑海岸将以其无上的荣耀与权威，统御整片东方之海。"
 BLS_missions_5_5_title: "潮汐之主"
 BLS_missions_5_5_desc: "当黑海岸成为世界的巨擘，守岸人的誓言终于圆满——潮汐为证，守望永存。"


