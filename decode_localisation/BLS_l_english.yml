l_english:

 BLS: "黑海岸"
 BLS_ADJ: "黑海岸的"
 BLS_ADJ2: "黑海岸的"
 BLS_ideas: "黑海岸理念"
 BLS_ideas_start: "守望者的传承"
 BLS_ideas_start_desc: "黑海岸的守护者们世代守望这片海域。潮水带来远方的声音，以智慧回应世界。"
 BLS_ideas_bonus: "潮声共鸣"
 BLS_ideas_bonus_desc: "当黑海岸的理念终为一体，海与人的共鸣是无尽的力量，每一位国人都如守岸人的回声。"
 BLS_idea_1: "黑海岸的守望"
 BLS_idea_1_desc: "守望者们立于潮水之间，以不可动摇的意志守护这片海域。"
 BLS_idea_2: "鸣潮之声"
 BLS_idea_2_desc: "来自浪潮远方的回响为黑海岸指出前路，这个国家从不落后于时代之潮。"
 BLS_idea_3: "潮声回响"
 BLS_idea_3_desc: "商人们沿潮声往来于四海之间，将海洋的财富全部收入库中。"
 BLS_idea_4: "永夜航线"
 BLS_idea_4_desc: "即使在永夜，舰队也能找到归路。大海无边，无法到达的地方不存在。"
 BLS_idea_5: "共鸣之音"
 BLS_idea_5_desc: "守岸人以共鸣之声统御大军，人与潮水同声共进，军心如山。"
 BLS_idea_6: "守岸人之誓"
 BLS_idea_6_desc: "守岸人立下的誓言，是这片海岸最坚固的基石，誓言永存，国家便不会动摇。"
 BLS_idea_7: "黑海守护"
 BLS_idea_7_desc: "黑海岸的力量源自对这片海的守护。守护的意志让军队永不言败。"

 ### CULTURE ###

 wuthering_waves_group: "鸣潮"
 wuthering_waves: "鸣潮"

 ### GOVERNMENT REFORM ###

 BLS_black_shore_reform: "黑海岸守望"
 BLS_black_shore_reform_desc: "黑海岸由守岸人与泰提斯世代守望。潮声不仅是远方的回响，更是国家统御四海的意志。在这片永夜与潮汐交织的海岸上，舰队与守军以共鸣之声捍卫黑海岸的每一寸水域。"

