l_english:
 # ---------- unit group names (registered tech groups, keep loc so no raw key shows) ----------
 acg_teyvat: "提瓦特兵种"
 acg_solaris: "索拉里斯兵种"
 # ---------- 提瓦特 · 锋矢（acg_tv_assault_*） ----------
 acg_tv_assault_infantry_01: "丘丘人"
 acg_tv_assault_infantry_01DESCR: "提瓦特最常见的原生部族，抄起木棒就敢冲锋，成群时比看上去难缠。"
 acg_tv_assault_infantry_05: "盗宝团斥候"
 acg_tv_assault_infantry_05DESCR: "遗迹前总先看到他们，跑得比谁都快，抢得比谁都狠。"
 acg_tv_assault_infantry_09: "愚人众先遣队"
 acg_tv_assault_infantry_09DESCR: "至冬伸出的第一只手，装备精良、行动整齐，从不单独出现。"
 acg_tv_assault_infantry_12: "镀金旅团刀舞者"
 acg_tv_assault_infantry_12DESCR: "沙漠商路上的雇佣刀客，出手花哨，刀刀却都奔着要害。"
 acg_tv_assault_infantry_15: "愚人众火枪手"
 acg_tv_assault_infantry_15DESCR: "列队齐射的至冬铳兵，一轮火力能压得人抬不起头。"
 acg_tv_assault_infantry_19: "西风骑士团先锋"
 acg_tv_assault_infantry_19DESCR: "蒙德的骑士先锋，风元素开路，冲阵最快也最先挨打。"
 acg_tv_assault_infantry_26: "愚人众执行官卫队"
 acg_tv_assault_infantry_26DESCR: "执行官身边最后一道人墙，全员精锐，不退不降。"
 acg_tv_assault_cavalry_01: "蕈兽"
 acg_tv_assault_cavalry_01DESCR: "元素富集地带的孢子生物，受惊后成群冲撞，蹄步沉得能震塌木栅。"
 acg_tv_assault_cavalry_06: "圣骸兽"
 acg_tv_assault_cavalry_06DESCR: "远古巨兽的遗骸被元素重新驱动，冲起来几乎停不下来。"
 acg_tv_assault_cavalry_10: "兽境猎犬"
 acg_tv_assault_cavalry_10DESCR: "从裂隙里钻出的猎兽，成群追击，跑得比马还快。"
 acg_tv_assault_cavalry_14: "驮兽骑手"
 acg_tv_assault_cavalry_14DESCR: "须弥商路上的驮兽骑手，跑得远、跑得久，正面不行。"
 acg_tv_assault_cavalry_23: "深海龙蜥"
 acg_tv_assault_cavalry_23DESCR: "从深海爬上岸的龙蜥，鳞甲厚重，一口能咬穿盾牌。"
 acg_tv_assault_cavalry_28: "遗迹龙兽"
 acg_tv_assault_cavalry_28DESCR: "悬空飞行的坎瑞亚机关，俯冲时以元素刃开路。"
 acg_tv_assault_artillery_07: "丘丘萨满"
 acg_tv_assault_artillery_07DESCR: "举着骨杖的丘丘人施术者，火球准头差，但架不住多。"
 acg_tv_assault_artillery_12: "遗迹猎手"
 acg_tv_assault_artillery_12DESCR: "悬停空中的坎瑞亚机关，以元素光束点杀目标。"
 acg_tv_assault_artillery_16: "冰铳重卫士"
 acg_tv_assault_artillery_16DESCR: "愚人众重装铳兵，一发冰弹能把阵型撕开缺口。"
 acg_tv_assault_artillery_22: "元能构装体"
 acg_tv_assault_artillery_22DESCR: "沙漠深处游走的元能造物，射程之内没有安全区。"
 acg_tv_assault_artillery_26: "遗迹重机"
 acg_tv_assault_artillery_26DESCR: "笨重但可靠的攻城机关，一炮换一段城墙。"
 acg_tv_assault_artillery_29: "半永恒统辖矩阵"
 acg_tv_assault_artillery_29DESCR: "沙漠深处浮起的统辖机关，光棱扫过之处寸草不生。"
 # ---------- 提瓦特 · 坚壁（acg_tv_guard_*） ----------
 acg_tv_guard_infantry_01: "木盾丘丘人"
 acg_tv_guard_infantry_01DESCR: "举着粗制木盾的丘丘人，挡得住石头，挡不住火。"
 acg_tv_guard_infantry_05: "盗宝团打手"
 acg_tv_guard_infantry_05DESCR: "拿钱办事的粗汉，站桩能扛，跑起来就散。"
 acg_tv_guard_infantry_09: "千岩军"
 acg_tv_guard_infantry_09DESCR: "璃月常备守军，靠阵型与长枪吃饭，守城是行家，追击是外行。"
 acg_tv_guard_infantry_12: "天领奉行与力"
 acg_tv_guard_infantry_12DESCR: "稻妻的治安武者，列阵守备，短兵相接时稳得很。"
 acg_tv_guard_infantry_15: "西风骑士团盾卫"
 acg_tv_guard_infantry_15DESCR: "顶在最前面的蒙德盾手，扛线能力全大陆闻名。"
 acg_tv_guard_infantry_19: "枫丹廷警备队"
 acg_tv_guard_infantry_19DESCR: "枫丹廷的常驻警备武力，纪律严整，擅长以阵地消耗对手。"
 acg_tv_guard_infantry_26: "千岩军镇石卫队"
 acg_tv_guard_infantry_26DESCR: "以镇石为核心的璃月重装守军，退一步就是璃月港。"
 acg_tv_guard_cavalry_01: "岩蕈兽"
 acg_tv_guard_cavalry_01DESCR: "披着岩壳的蕈兽，冲不快，但撞上去像撞墙。"
 acg_tv_guard_cavalry_06: "圣骸角鳄"
 acg_tv_guard_cavalry_06DESCR: "披着圣骸甲壳的巨鳄，正面顶阵几乎推不动。"
 acg_tv_guard_cavalry_10: "兽境王兽"
 acg_tv_guard_cavalry_10DESCR: "兽境猎犬的首领，护住阵线时比进攻更难缠。"
 acg_tv_guard_cavalry_14: "镀金旅团驯兽师"
 acg_tv_guard_cavalry_14DESCR: "带着沙兽上阵的须弥雇佣兵，稳住侧翼就够用。"
 acg_tv_guard_cavalry_23: "渊下龙蜥"
 acg_tv_guard_cavalry_23DESCR: "白夜国的守土龙蜥，伏在阵地前一步不退。"
 acg_tv_guard_cavalry_28: "深海龙蜥王"
 acg_tv_guard_cavalry_28DESCR: "深海龙蜥的首领，鳞甲与体量都到了另一个层级。"
 acg_tv_guard_artillery_07: "丘丘岩盔王"
 acg_tv_guard_artillery_07DESCR: "岩盔加身的丘丘人巨汉，扔石头比谁都狠。"
 acg_tv_guard_artillery_12: "遗迹侦察者"
 acg_tv_guard_artillery_12DESCR: "低空巡逻的侦查机关，先发现，先开火。"
 acg_tv_guard_artillery_16: "冰萤术士"
 acg_tv_guard_artillery_16DESCR: "以冰萤牵制的愚人众术士，能拖住整条战线。"
 acg_tv_guard_artillery_22: "元能构装体守望者"
 acg_tv_guard_artillery_22DESCR: "守着遗迹入口的元能构装体，站着不动反而最难打。"
 acg_tv_guard_artillery_26: "遗迹守卫"
 acg_tv_guard_artillery_26DESCR: "坎瑞亚的经典守门机关，正面硬顶最合适。"
 acg_tv_guard_artillery_29: "无相之岩"
 acg_tv_guard_artillery_29DESCR: "凝成实体的岩元素生命，砸下去就是一片废墟。"
 # ---------- 索拉里斯 · 共鸣（acg_sl_fire_*） ----------
 acg_sl_fire_infantry_01: "残星会新兵"
 acg_sl_fire_infantry_01DESCR: "被鸣式低语蛊惑的年轻人，拿着拼凑的武器就上阵。"
 acg_sl_fire_infantry_05: "声骸猎手"
 acg_sl_fire_infantry_05DESCR: "在无音区靠猎杀声骸为生的人，熟悉每一声鸣响意味着什么。"
 acg_sl_fire_infantry_09: "共鸣者小队"
 acg_sl_fire_infantry_09DESCR: "能听见共鸣的战士编组，火力集中时能把声骸打散。"
 acg_sl_fire_infantry_12: "黑海岸巡队"
 acg_sl_fire_infantry_12DESCR: "黑海岸的外围巡防队，装备统一，火力优先。"
 acg_sl_fire_infantry_15: "拉古那剑士"
 acg_sl_fire_infantry_15DESCR: "拉古那的剑术流派传人，出手快，收招更快。"
 acg_sl_fire_infantry_19: "残星会执裁者"
 acg_sl_fire_infantry_19DESCR: "残星会的中坚，以鸣式为信仰，以火力为语言。"
 acg_sl_fire_infantry_26: "鸣式军团"
 acg_sl_fire_infantry_26DESCR: "被鸣式彻底吞并的整编制军团，只剩进攻一个指令。"
 acg_sl_fire_cavalry_01: "荒野驮兽"
 acg_sl_fire_cavalry_01DESCR: "荒野上最常见的驮兽，被驯来驮货，也驮人。"
 acg_sl_fire_cavalry_06: "声骸狼骑"
 acg_sl_fire_cavalry_06DESCR: "把声骸狼当作坐骑的猎手，追击速度快得离谱。"
 acg_sl_fire_cavalry_10: "鸣钟之龟"
 acg_sl_fire_cavalry_10DESCR: "背着鸣钟的巨型声骸，移动缓慢，但一路都在响。"
 acg_sl_fire_cavalry_14: "无常鹭骑手"
 acg_sl_fire_cavalry_14DESCR: "骑乘无常鹭的轻骑，起伏之间已经换了位置。"
 acg_sl_fire_cavalry_23: "无冠者铁骑"
 acg_sl_fire_cavalry_23DESCR: "无冠者麾下的重装骑队，冲开阵型就不回头。"
 acg_sl_fire_cavalry_28: "鸣式巨兽"
 acg_sl_fire_cavalry_28DESCR: "被鸣式放大的巨兽，体型本身就是武器。"
 acg_sl_fire_artillery_07: "声骸投石手"
 acg_sl_fire_artillery_07DESCR: "把碎石与声骸残片当弹丸的投手，准头一般，密度惊人。"
 acg_sl_fire_artillery_12: "巡哨机傀"
 acg_sl_fire_artillery_12DESCR: "黑海岸外围的自动哨兵，用声波锁定目标后倾泻火力。"
 acg_sl_fire_artillery_16: "机械偶"
 acg_sl_fire_artillery_16DESCR: "缴获后改造的机械偶，火力不精，但数量管够。"
 acg_sl_fire_artillery_22: "共鸣炮手"
 acg_sl_fire_artillery_22DESCR: "以共鸣聚焦火力的炮组，齐射时连空气都在振。"
 acg_sl_fire_artillery_26: "残星重炮"
 acg_sl_fire_artillery_26DESCR: "残星会拆解遗迹铸成的重炮，射程覆盖整片无音区。"
 acg_sl_fire_artillery_29: "终末序列炮"
 acg_sl_fire_artillery_29DESCR: "残星会最深的造物，一发就是一整条战线的终点。"
 # ---------- 索拉里斯 · 潮涌（acg_sl_shock_*） ----------
 acg_sl_shock_infantry_01: "今州守备兵"
 acg_sl_shock_infantry_01DESCR: "今州的常备守军，守土意识强过一切。"
 acg_sl_shock_infantry_05: "黑海岸拾荒者"
 acg_sl_shock_infantry_05DESCR: "在废墟里捡出一条命的人，皮实、耐打、不讲章法。"
 acg_sl_shock_infantry_09: "今州刀卫"
 acg_sl_shock_infantry_09DESCR: "今州城门的刀手，近身缠斗是本职。"
 acg_sl_shock_infantry_12: "残星会信徒"
 acg_sl_shock_infantry_12DESCR: "被鸣式许诺了未来的信徒，冲起来不要命。"
 acg_sl_shock_infantry_15: "拉古那盾卫"
 acg_sl_shock_infantry_15DESCR: "拉古那的盾阵兵，一步不退。"
 acg_sl_shock_infantry_19: "无冠者信徒"
 acg_sl_shock_infantry_19DESCR: "追随无冠者的狂信者，越挨打越凶。"
 acg_sl_shock_infantry_26: "无归的谬误"
 acg_sl_shock_infantry_26DESCR: "鸣式具现出的错误存在，冲击时连地形一起抹掉。"
 acg_sl_shock_cavalry_01: "岩背龟"
 acg_sl_shock_cavalry_01DESCR: "背甲厚实的野生龟兽，冲不快，但撞得动。"
 acg_sl_shock_cavalry_06: "棘背兽骑手"
 acg_sl_shock_cavalry_06DESCR: "骑着棘背兽的冲阵骑兵，第一波撞击最致命。"
 acg_sl_shock_cavalry_10: "燎照之骑"
 acg_sl_shock_cavalry_10DESCR: "踏火而行的鸣式骑士，冲锋时把整片战场犁成焦土。"
 acg_sl_shock_cavalry_14: "哀声鸷骑手"
 acg_sl_shock_cavalry_14DESCR: "骑乘哀声鸷的骑手，尖啸先到，人后到。"
 acg_sl_shock_cavalry_23: "湮灭之潮骑兵"
 acg_sl_shock_cavalry_23DESCR: "被湮灭之潮推着前进的骑队，停下来就会被吞掉。"
 acg_sl_shock_cavalry_28: "海啸骑士"
 acg_sl_shock_cavalry_28DESCR: "以鸣式造出巨浪随行的重骑，一次冲锋就是一次登陆。"
 acg_sl_shock_artillery_07: "残星会术士"
 acg_sl_shock_artillery_07DESCR: "以鸣式为媒介施术的信徒，落点不准，威力够狠。"
 acg_sl_shock_artillery_12: "声骸弩手"
 acg_sl_shock_artillery_12DESCR: "用声骸骨骼做弩的射组，近距离穿透力惊人。"
 acg_sl_shock_artillery_16: "今州弩炮"
 acg_sl_shock_artillery_16DESCR: "今州城头的老式弩炮，守城时最好用。"
 acg_sl_shock_artillery_22: "鸣钟炮台"
 acg_sl_shock_artillery_22DESCR: "以鸣钟共振增幅的炮台，声到，弹到。"
 acg_sl_shock_artillery_26: "无冠者炮座"
 acg_sl_shock_artillery_26DESCR: "架在无冠者残骸上的重炮，开火即暴露位置。"
 acg_sl_shock_artillery_29: "无音区坍缩体"
 acg_sl_shock_artillery_29DESCR: "无音区里被压缩到极致的鸣式，落地就吞掉一片。"
