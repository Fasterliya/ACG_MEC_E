l_english:
 ALC_south_italy: "南意大利統一"
 ALC_south_italy_desc: "南意大利的城邦與港口已盡數臣服於愛麗絲的人偶軍團。統一的故土為人偶帝國奠定了第一塊基石。"
 ALC_naples_crown: "那不勒斯王冠"
 ALC_naples_crown_desc: "那不勒斯的鐵王冠加冕於愛麗絲的額頭。地中海的暖風帶來充沛的人力，為人偶大軍注入源源不斷的血液。"
 ALC_italy_crown: "意大利霸主"
 ALC_italy_crown_desc: "從阿爾卑斯山巔到西西里的海岸，整個意大利半島已在愛麗絲的掌中。歐洲列強不得不正視這位人形使的崛起。"
 ALC_italy_hegemon: "意大利霸權"
 ALC_italy_hegemon_desc: "愛麗絲的威名響徹歐洲——意大利不再是列強爭霸的舞台，而是人偶女王的王座。"
 ALC_iberia_claim: "伊比利亞宣示"
 ALC_iberia_claim_desc: "跨過第勒尼安海，人偶軍團的旗幟飄揚在伊比利亞的海岸。大西洋的貿易財富開始流向愛麗絲的金庫。"
 ALC_mediterranean: "地中海帝國"
 ALC_mediterranean_desc: "地中海已化作愛麗絲的內湖。人偶艦隊巡弋在直布羅陀與塞浦路斯之間，商路與航道盡在掌握。"
 ALC_africa_claim: "非洲經略"
 ALC_africa_claim_desc: "馬格里布的沙漠無法阻擋人偶的腳步。北非的礦產與人力被源源輸入人偶帝國的戰爭機器。"
 ALC_balkan_crown: "巴爾幹王冠"
 ALC_balkan_crown_desc: "巴爾幹的山脈與平原被人偶的鐵蹄踏平。愛麗絲的軍團士氣如虹，兵鋒所向無不披靡。"
 ALC_doll_hegemony: "人偶霸權"
 ALC_doll_hegemony_desc: "愛麗絲·瑪格特羅伊德已成就人偶霸權——戰爭因她而起，和平由她而定。整個世界都在她的指尖舞動。"
 ALC_doll_workshop: "人形工房"
 ALC_doll_workshop_desc: "人偶工房在全境遍地開花，日夜不停地生產著戰爭人形。工業的齒輪與人偶的關節一同轉動。"
 ALC_magic_academy: "魔法學院"
 ALC_magic_academy_desc: "愛麗絲創立了魔法學院，系統性地培養新一代魔法使。創新的火花在每一間實驗室中迸發。"
 ALC_trade_empire: "貿易帝國"
 ALC_trade_empire_desc: "貿易站與商人公會遍布各大節點，人偶商隊穿越沙漠與海洋——愛麗絲的貿易網絡覆蓋了已知世界的每一個角落。"
 ALC_industry: "工業革命"
 ALC_industry_desc: "人偶工廠的煙囪取代了手工作坊。從紡織到冶鐵，從軍火到奢侈品——愛麗絲引領的工業革命重塑了整個世界。"
 ALC_economic_hegemony: "經濟霸權"
 ALC_economic_hegemony_desc: "當愛麗絲的人偶帝國控制了全球半數以上的財富，連最強大的國家也不得不向其銀行借貸。金錢即是力量。"
 ALC_fortification: "要塞防線"
 ALC_fortification_desc: "星形要塞與人偶守衛構築了堅不可摧的防線。任何膽敢入侵的敵軍都將被人偶的炮火撕成碎片。"
 ALC_naval_power: "運河艦隊"
 ALC_naval_power_desc: "人偶操控的艦船填滿了每一個港口。愛麗絲的艦隊不僅控制著貿易航線，更是海上不可挑戰的霸主。"
 ALC_grand_cathedral: "大聖堂"
 ALC_grand_cathedral_desc: "宏偉的大聖堂在全國各地拔地而起。信仰與人偶的魔力交織，為帝國帶來前所未有的精神統一。"
 ALC_monument_master: "奇觀大師"
 ALC_monument_master_desc: "愛麗絲以人偶的精密技藝修復了古代世界的奇蹟。奇觀的光芒照耀著首都，吸引著全世界的朝聖者與學者。"
 ALC_world_wonder: "世界奇觀收集者"
 ALC_world_wonder_desc: "從金字塔到故宮，從吳哥窟到馬丘比丘——世界上所有的偉大奇觀都已歸於愛麗絲的名下。"
 ALC_doll_research: "人形研究"
 ALC_doll_research_desc: "愛麗絲深入研究了人偶製造的終極奧秘。每一個新發現都讓人偶部隊更加致命、更加高效。"
 ALC_doll_mass_prod: "人形量產"
 ALC_doll_mass_prod_desc: "流水線式的人偶量產系統全面啟動。過去需要數月精心製作的人偶，如今在數日內便可完成武裝。"
 ALC_doll_legion: "人偶軍團"
 ALC_doll_legion_desc: "當人偶的數量超過了人類士兵，愛麗絲的軍團便不再是一支軍隊——而是一股不可阻擋的洪流。"
 ALC_doll_army: "人偶軍勢"
 ALC_doll_army_desc: "人偶部隊以超人的速度行軍與作戰。沒有疲勞，沒有恐懼——只有完美執行命令的戰爭機器。"
 ALC_doll_master: "人偶大師"
 ALC_doll_master_desc: "愛麗絲·瑪格特羅伊德的名字已成為傳奇。人形使的技藝達到了神域，她的軍團就是力量的代名詞。"
 ALC_master_spark: "武操·人形戰争"
 ALC_master_spark_desc: "愛麗絲解放了禁忌的終極魔法——武操「人形戰爭」。千具人偶同時啟動，如同死亡的潮水般淹沒一切防線。首都化為永不陷落的魔偶要塞，全國人偶部隊在主人的共鳴下爆發出毀滅性的火力。"
 ALC_capital_fort: "魔偶要塞"
 ALC_capital_fort_desc: "首都已被改造為一座由魔法與人偶共同守護的超級要塞。任何圍城的企圖都將遭遇毀滅性的反擊。"

 Magic_user_ALC: "魔法使研究"
 Magic_user_ALC_desc: "作為七色的人形使，愛麗絲對魔法與人偶的研究遠超同時代的所有學者。"
 Making_doll: "人形製作"
 Making_doll_desc: "精密的人偶製造技藝讓愛麗絲可以輕鬆維持一支龐大的傭兵隊伍，維護成本遠低於血肉之軀。"
 Doll_support: "人偶支援"
 Doll_support_desc: "人偶部隊的衝鋒如同一道鋼鐵的巨浪——沒有恐懼，沒有猶豫，只有毀滅性的衝擊力。"
 dushipai: "都市派策略"
 dushipai_desc: "愛麗絲在城市管理方面同樣展現出了驚人的才能——行政與軍事政策的自由調配讓帝國運轉更加高效。"
 preserve_one: "蓬萊人形"
 preserve_one_desc: "愛麗絲將蓬萊人形賦予了自我戰鬥的意識。她那遠超人類的軍事傳統在每一代傭兵將領中傳承，人偶也可以在戰場上熟稔地操練。"
 Doll_giantism: "人偶巨像"
 Doll_giantism_desc: "巨像化的人偶在戰場上如同移動的堡壘，步兵的作戰能力得到了質的飛躍，騎兵與人偶步兵的協同也更為完美。"
 Doll_factory: "人偶工廠"
 Doll_factory_desc: "愛麗絲以魔法驅動的工廠日夜運轉，人偶的製造速度與建設效率都達到了令人難以置信的水平。"

 ALC_missions_6_1_title: "蓬萊之門"
 ALC_missions_6_1_desc: "穿過蓬萊之扉，阿普利亞的港口與城市已納入版圖。向南——卡拉布里亞的海岸線正等待著人偶艦隊的到來。"
 ALC_missions_6_2_title: "人偶戰記·序章"
 ALC_missions_6_2_desc: "卡拉布里亞的硝煙散盡，人偶軍團泊於第勒尼安海畔。下一章——那不勒斯的沃野與西西里的波濤已在呼喚。"
 ALC_missions_6_3_title: "七色加冕"
 ALC_missions_6_3_desc: "七色之光降臨那不勒斯。西西里與坎帕尼亞的豐收之地已然臣服。古老王冠加冕之時，北方——教宗的聖城與托斯卡納的榮光正等待著人偶女王的駕臨。"
 ALC_missions_6_4_title: "魔女祝祭"
 ALC_missions_6_4_desc: "魔女踏入了永恆之城。拉齊奧的聖境與托斯卡納的璀璨文化皆歸於人偶帝國。祝祭的焰火點亮了亞平寧半島的夜空——下一步，威尼斯的運河與倫巴第的鐵冠。"
 ALC_missions_6_5_title: "千夜幻想"
 ALC_missions_6_5_desc: "威尼斯在炮火中陷落，倫巴第的鐵王冠被摘下。亞平寧半島——從靴尖到髮際——漫長的幻想終化為現實。整個意大利都將是愛麗絲的領地。"
 ALC_missions_6_6_title: "魔女之座"
 ALC_missions_6_6_desc: "千級發展度，列強之名——愛麗絲不再只是征服者，而是意大利的女王。魔女的玉座穩固於亞平寧之巔，無人可動搖。"
 ALC_missions_7_1_title: "海涯戲偶"
 ALC_missions_7_1_desc: "第勒尼安海的彼岸——科西嘉與撒丁的碧波之中，人偶的戲曲悄然開演。跨越這片海洋，巴利阿里群島與阿拉貢的海岸便映入眼簾。"
 ALC_missions_7_2_title: "赤靴進軍"
 ALC_missions_7_2_desc: "紅色的軍靴踏上伊比利亞的東岸。巴利阿里與阿拉貢已然陷落。整個伊比利亞半島將是下一個舞台——赤靴的進軍無人能擋。"
 ALC_missions_7_3_title: "伊比利亞幻想曲"
 ALC_missions_7_3_desc: "從比利牛斯山到直布羅陀巨岩，伊比利亞的幻想曲奏響終章。南方的馬格里布——那片古老而神秘的土地，將是下一幕的舞台。"
 ALC_missions_7_4_title: "沙塵操演"
 ALC_missions_7_4_desc: "撒哈拉的沙塵中，人偶的操演不曾停歇。馬格里布的沙漠部落已然臣服。跨越地中海——巴爾幹的群山正在呼喚。"
 ALC_missions_7_5_title: "薔薇軍團"
 ALC_missions_7_5_desc: "薔薇園中集結的人偶軍團穿越了巴爾幹的山巒與河流。從雅典衛城到貝爾格萊德要塞——人偶的旗幟在東南歐獵獵飄揚。"
 ALC_missions_7_6_title: "世界起舞者"
 ALC_missions_7_6_desc: "兩萬發展度的體量，霸權的稱號——愛麗絲不再與列強爭霸。她讓整個世界隨她起舞，如同指尖的人偶。"
 ALC_missions_8_1_title: "魔法人偶工房"
 ALC_missions_8_1_desc: "五座工場的煙囪刺破天際，五十金幣的月收入使人偶的量產成為現實。魔法與工業的聯姻誕生了前所未有的生產力。"
 ALC_missions_8_2_title: "禁書學院"
 ALC_missions_8_2_desc: "三所大學在帝國各地建立，收錄了來自世界各地的禁書與魔法典籍。知識不再是被封存的禁忌，而是推動帝國前進的燃料。"
 ALC_missions_8_3_title: "人偶交易網"
 ALC_missions_8_3_desc: "五座貿易倉庫如同蛛網的節點，將帝國的商路延伸至每一個角落。貨物、黃金與信息在人偶的網絡中自由流淌——前提是伊比利亞半島已被收入囊中。"
 ALC_missions_8_4_title: "魔法工業革命"
 ALC_missions_8_4_desc: "二十座工場晝夜轟鳴，兩百度卡特的月收入宣告了魔法工業時代的降臨。蒸汽與魔力的交織重塑了生產的方式。"
 ALC_missions_8_5_title: "無盡的人偶舞台"
 ALC_missions_8_5_desc: "五百金幣的月收入，兩萬發展度的經濟體量——愛麗絲的人偶舞台已延伸至無限。她是世界經濟的規則制定者，巴爾幹的群山亦在她的經濟版圖之中。"
 ALC_missions_9_1_title: "禁忌之頁"
 ALC_missions_9_1_desc: "當三種科技皆突破第五級壁壘，愛麗絲得以翻開禁忌魔法的扉頁。人偶的製造工藝迎來了質的飛躍。"
 ALC_missions_9_2_title: "量產型上海人偶"
 ALC_missions_9_2_desc: "量產型人偶的製造線正式啟動。上海人偶的設計成為標準模板——精密的殺戮機器以驚人的速度從工廠湧出。"
 ALC_missions_9_3_title: "巨像人偶啟動"
 ALC_missions_9_3_desc: "當半數以上的陸軍由僱傭人偶組成，愛麗絲啟動了巨像計劃——歌利亞人形。這些龐大的戰爭機器改變了戰場的規則，羅馬的聖城為其提供了最理想的試驗場。"
 ALC_missions_9_4_title: "人偶戰線布陣"
 ALC_missions_9_4_desc: "五支傭兵團在意大利的戰場上展開人偶陣線，十萬陸軍上限讓帝國擁有壓倒性的力量投射。人偶戰線——沒有弱點，只有毀滅。"
 ALC_missions_9_5_title: "冥府交響曲"
 ALC_missions_9_5_desc: "十支傭兵團在愛麗絲的指揮棒下演奏著冥府的交響曲。一千五百發展度的帝國奏出了戰爭的終章——馬格里布的沙場見證了七色人形使的至高傑作。"
 ALC_missions_10_1_title: "古城守護者"
 ALC_missions_10_1_desc: "十座星形要塞如珍珠般鑲嵌在帝國邊境，古老的城牆被人偶魔法強化為現代化的堡壘。入侵者將面對永不疲倦的石與鐵。"
 ALC_missions_10_2_title: "魔導艦隊出擊"
 ALC_missions_10_2_desc: "十座船塢不間斷地鑄造著魔法戰艦，五十艘輕型帆船護衛著帝國的貿易生命線。魔導艦隊出擊——海洋不再屬於任何其他勢力。"
 ALC_missions_10_3_title: "聖愛麗絲大聖堂"
 ALC_missions_10_3_desc: "五座大聖堂與三座巔峰奇觀見證了聖愛麗絲時代的降臨。信仰與魔法的交響在每一塊石磚中迴盪，帝國的靈魂得到了昇華。"
 ALC_missions_10_4_title: "奇跡收集之旅"
 ALC_missions_10_4_desc: "五座世界奇觀在愛麗絲的魔法下恢復至巔峰狀態。奇蹟的光芒匯聚於首都，人偶女王的城塞得到了來自古代文明的祝福，三種君主力量的源泉也隨之湧現。"
 ALC_missions_10_5_title: "掌中奇跡"
 ALC_missions_10_5_desc: "十座三級奇觀——兩千五百發展度的帝國——愛麗絲收集了人類文明的全部奇蹟。她不僅是統治者，更是文明本身的守護者與主宰。"
 Master_Spark_of_Alice_title: "武操·人形戰争"
 Master_Spark_of_Alice_desc: "愛麗絲解放了禁忌的終極魔法——武操「人形戰爭」。千具人偶同時啟動，如同死亡的潮水般淹沒一切防線。首都化為永不陷落的魔偶要塞，全國人偶部隊在主人的共鳴下爆發出毀滅性的火力與圍城能力。"
 ALC_missions.1.t: "任務完成"
 ALC_missions.1.d: "愛麗絲的人偶軍團如約完成了使命。帝國的版圖又向更遠的地平線推進了一步。"
 ALC_missions.1.a: "繼續前進。"
