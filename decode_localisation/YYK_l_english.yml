l_english:
 YYK_ideas: "白玉楼理念"
 YYK_ideas_start: "幽冥之魂"
 YYK_ideas_bonus: "亡者的安宁"
 YYK_ideas_start_desc: "白玉楼的亡灵公主统御着生与死的边界。幽灵军团士气高昂，人力源源不绝——死者亦能为幽幽子而战。"
 YYK_ideas_bonus_desc: "当所有理念臻于圆满，白玉楼的统治稳如磐石——稳定花费大幅降低，亡者的低语不再带来叛乱，而是带来安宁。"
 White_Jade_Mansion: "白玉楼的管理"
 White_Jade_Mansion_desc: "白玉楼的庭院秩序井然，幽灵仆从们打理着一切。国家的运转如樱花飘落般自然流畅。"
 Ghost_Feast: "幽灵之宴"
 Ghost_Feast_desc: "幽幽子举办盛大的幽灵之宴，款待亡者与生者。饱餐一顿的亡灵们对这位公主心服口服，叛乱与异端的杂音渐渐消散。"
 Dead_Butterfly_Dance: "死蝶之舞"
 Dead_Butterfly_Dance_desc: "死蝶在樱花间起舞，幽幽子的军队士气如虹。即使遭受重创，幽灵士兵们也不会轻易崩溃。"
 Far_Shore_Guide: "彼岸的引路人"
 Far_Shore_Guide_desc: "幽幽子亲自为开拓者引路，指引他们前往彼岸的新世界。殖民者的脚步遍布天涯。"
 Saigyou_Ayakashi: "西行妖的绽放"
 Saigyou_Ayakashi_desc: "西行妖的樱花在国度各处绽放，富饶与繁荣随之而来。发展的成本随花瓣一同飘落。"
 Kakuri_Undead: "华胥的亡灵"
 Kakuri_Undead_desc: "华胥的亡灵军团刀枪不入，步兵与炮兵皆为白玉楼的精锐。死者比生者更加忠诚。"
 Sakura_Gale_Protection: "樱吹雪的加护"
 Sakura_Gale_Protection_desc: "樱吹雪的加护笼罩着幽幽子的军队，战争的代价在花瓣中消融——侵略扩张与战争的负担都随之减轻。"

 YYK_netherworld_reform: "幽冥白玉楼"
 YYK_netherworld_reform_desc: "白玉楼升华为幽冥之国。幽幽子的国度接纳四方文化如探囊取物——接纳文化的花费减半，可接纳的文化数量大幅增加，幽冥之力随文化的交融而壮大。"

 YYK_netherworld_power: "幽冥之力"

 ACG_MEC_yyk_culture_calibrate: "校准幽冥之力"
 ACG_MEC_yyk_culture_calibrate_desc: "以接纳的文化数量校准幽冥之力：每一个已接纳的文化都化为幽冥之力的源泉，推动白玉楼的力量条至对应的高度。每当文化版图变化，点击以重新校准。"

 YYK_awakening: "白玉楼的觉醒"
 YYK_awakening_desc: "沉睡的白玉楼在幽幽子的呢喃中苏醒，稳定与秩序随之降临。"
 YYK_culture_blend: "文化交融"
 YYK_culture_blend_desc: "白玉楼开始接纳四方文化，幽冥的包容让国家的根基更加稳固。"
 YYK_ghost_feast: "幽灵之宴"
 YYK_ghost_feast_desc: "幽灵之宴的余韵未散，亡者的低语化为对公主的效忠，叛乱与异端随之平息。"
 YYK_management: "白玉楼的管理"
 YYK_management_desc: "白玉楼的幽灵仆从将政务打理得井井有条，稳定花费大幅降低。"
 YYK_garden: "樱花庭院"
 YYK_garden_desc: "樱花庭院的繁荣带动了全国的开发，发展的成本随之降低。"
 YYK_rest: "亡者安息"
 YYK_rest_desc: "亡者安息于白玉楼的樱花树下，异教的灵魂也归于平静，叛乱与不安随之消散。"
 YYK_guide: "彼岸的引路人"
 YYK_guide_desc: "幽幽子引导更多的文化归于白玉楼，幽冥的秩序愈发稳固。"
 YYK_eternal: "白玉楼的永恒"
 YYK_eternal_desc: "白玉楼屹立于永恒，稳定与安宁是它的代名词——幽冥的国度牢不可破。"
 YYK_italy_vanguard: "意大利的先驱"
 YYK_italy_vanguard_desc: "意大利的疆土向幽幽子敞开，核心化的负担随之减轻。"
 YYK_italy_south: "南阿尔卑斯的征服"
 YYK_italy_south_desc: "南阿尔卑斯的征服已成定局，意大利的土地加速融入白玉楼。"
 YYK_italy_center: "波河的统治"
 YYK_italy_center_desc: "波河之谷的统治稳固，侵略扩张的阴影在樱花下消散。"
 YYK_italy_rome: "托斯卡纳之光"
 YYK_italy_rome_desc: "托斯卡纳的光辉归于幽幽子，战争的代价在花瓣中消融。"
 YYK_italy_naples: "永恒之城的掌握"
 YYK_italy_naples_desc: "永恒之城臣服于亡者公主，征服的负担愈发轻盈。"
 YYK_italy_sicily: "亚平宁之心"
 YYK_italy_sicily_desc: "亚平宁的心脏已属白玉楼，西西里的海浪亦为幽冥而歌。"
 YYK_italy_unification: "意大利的邀请"
 YYK_italy_unification_desc: "意大利诸邦收到幽冥的邀请——归顺白玉楼，或消散于樱花之中。核心化、侵略扩张与战争的代价全面减轻。"
 YYK_italy_crown: "意大利王冠"
 YYK_italy_crown_desc: "意大利王冠加冕于幽幽子的发间，威严与秩序笼罩半岛。"
 YYK_iberia_gate: "比利牛斯的门扉"
 YYK_iberia_gate_desc: "比利牛斯的门扉向幽冥敞开，伊比利亚的核心化进程加快。"
 YYK_iberia_aragon: "阿拉贡的遗产"
 YYK_iberia_aragon_desc: "阿拉贡的遗产归于白玉楼，伊比利亚的征服有条不紊。"
 YYK_iberia_castile: "卡斯蒂利亚高原"
 YYK_iberia_castile_desc: "卡斯蒂利亚的高原升起幽灵旗帜，侵略扩张的代价在樱花下减轻。"
 YYK_iberia_andalucia: "安达卢西亚的绿洲"
 YYK_iberia_andalucia_desc: "安达卢西亚的绿洲在幽冥的注视下归附，战争的分量愈发轻盈。"
 YYK_iberia_north: "托莱多的王座"
 YYK_iberia_north_desc: "托莱多的王座为幽幽子而设，伊比利亚的征服更进一步。"
 YYK_iberia_atlantic: "大西洋的门户"
 YYK_iberia_atlantic_desc: "大西洋的门户落入白玉楼之手，殖民的彼岸触手可及。"
 YYK_iberia_union: "伊比利亚的联合"
 YYK_iberia_union_desc: "伊比利亚的诸邦在幽冥面前联合——或者灭亡。核心化与侵略扩张的代价全面减轻。"
 YYK_iberia_crown: "伊比利亚的亡者统治"
 YYK_iberia_crown_desc: "伊比利亚半岛尽归白玉楼，商品与贸易在幽灵的注视下繁荣昌盛。"
 YYK_ghost_soldier: "幽灵士兵"
 YYK_ghost_soldier_desc: "幽灵士兵不知疲倦、不畏死亡，陆军士气高昂。"
 YYK_dead_butterfly: "死蝶之舞"
 YYK_dead_butterfly_desc: "死蝶之舞鼓舞着全军，士气如樱花般绚烂。"
 YYK_undead_legion: "亡灵军团"
 YYK_undead_legion_desc: "亡灵军团在战场上所受的士气打击微乎其微——死者不会畏惧死亡。"
 YYK_gardener: "白玉楼的庭师"
 YYK_gardener_desc: "庭师训练着幽灵士兵，士气与补员速度同步提升。"
 YYK_kakuri: "华胥的亡灵"
 YYK_kakuri_desc: "华胥的亡灵在炮火中毫不动摇，士气打击的减免再度加深。"
 YYK_grand_army: "幽幽子的大军"
 YYK_grand_army_desc: "幽幽子的大军席卷四方，士气高涨，人力源源不断。"
 YYK_shore_army: "彼岸的军队"
 YYK_shore_army_desc: "来自彼岸的军队免疫恐惧——所受士气打击被完全抹消。"
 YYK_dead_army: "亡者之师"
 YYK_dead_army_desc: "亡者之师是战场上的传说，士气如虹，传统永续。"
 YYK_explorer: "彼岸的航路"
 YYK_explorer_desc: "幽幽子的舰队驶向彼岸，殖民的范围大幅延伸。"
 YYK_route: "幽灵移民"
 YYK_route_desc: "幽灵移民踏上前往新世界的航程，殖民者队伍壮大。"
 YYK_colony_1: "亡者的殖民地"
 YYK_colony_1_desc: "第一块亡者的殖民地在新世界扎根，殖民增长加速。"
 YYK_colony_2: "幽冥前哨"
 YYK_colony_2_desc: "幽冥前哨遍布海岸，殖民的脚步加快。"
 YYK_sakura: "樱吹雪的祝福"
 YYK_sakura_desc: "樱吹雪祝福着殖民者，新世界的疆土在花瓣中生长。"
 YYK_shore_land: "彼岸的国土"
 YYK_shore_land_desc: "彼岸的国土日益辽阔，殖民增长再攀高峰。"
 YYK_new_world: "新世界的幽灵"
 YYK_new_world_desc: "新世界的幽灵守护着殖民地，又一支殖民队伍整装待发。"
 YYK_ghost_empire: "幽冥大帝国"
 YYK_ghost_empire_desc: "幽冥大帝国横跨大洋，殖民与开发的步伐无可阻挡。"

 YYK_missions_1_1_title: "白玉楼的觉醒"
 YYK_missions_1_1_desc: "幽幽子自沉睡中苏醒，白玉楼的幽冥之力觉醒。接纳四方文化，让亡者的国度繁荣昌盛——这是幽幽子对新世界的第一声问候。"
 YYK_missions_1_2_title: "文化交融"
 YYK_missions_1_2_desc: "白玉楼开始接纳不同的文化。幽灵们穿梭于各族之间，幽冥的包容让国家的根基更加稳固。"
 YYK_missions_1_3_title: "幽灵之宴"
 YYK_missions_1_3_desc: "幽幽子举办幽灵之宴，款待十种文化的亡者与生者。饱餐的亡灵们心甘情愿为白玉楼效力。"
 YYK_missions_1_4_title: "白玉楼的管理"
 YYK_missions_1_4_desc: "让白玉楼在稳定的秩序中运转。幽灵仆从们虽已逝去，管理政务却一丝不苟。"
 YYK_missions_1_5_title: "樱花庭院"
 YYK_missions_1_5_desc: "将白玉楼的庭院建设为梦幻的樱花之地，让繁荣从首都向四方蔓延。"
 YYK_missions_1_6_title: "亡者安息"
 YYK_missions_1_6_desc: "让所有的灵魂都安息于樱花树下——无论是正信还是异教，皆在幽幽子的庇护下归于平静。"
 YYK_missions_1_7_title: "彼岸的引路人"
 YYK_missions_1_7_desc: "幽幽子亲自引导更多的文化归于白玉楼。二十五种文化的交融，铸就幽冥的秩序。"
 YYK_missions_1_8_title: "白玉楼的永恒"
 YYK_missions_1_8_desc: "当白玉楼在稳定的秩序与广袤的疆域中屹立，它便不再是庭园，而是永恒——幽冥国度的心脏。"
 YYK_missions_2_1_title: "阿尔卑斯之南"
 YYK_missions_2_1_desc: "越过阿尔卑斯，威尼斯的波光与伦巴第的平原尽收眼底。幽幽子向意大利伸出了手——生者无法拒绝亡者的邀请。"
 YYK_missions_2_2_title: "伦巴第平原"
 YYK_missions_2_2_desc: "伦巴第的富饶归于白玉楼。波河之谷在召唤，意大利的门户已然敞开。"
 YYK_missions_2_3_title: "波河之谷"
 YYK_missions_2_3_desc: "波河之谷的田野在幽灵的注视下丰收。托斯卡纳的山丘与葡萄园正向幽幽子招手。"
 YYK_missions_2_4_title: "托斯卡纳之光"
 YYK_missions_2_4_desc: "托斯卡纳的艺术与荣光归于白玉楼。再向南——永恒之城罗马，正等待着幽冥的访客。"
 YYK_missions_2_5_title: "永恒之城"
 YYK_missions_2_5_desc: "罗马的七丘在樱花下安眠。幽幽子踏足永恒之城，意大利的心脏开始为幽冥而跳动。"
 YYK_missions_2_6_title: "亚平宁之心"
 YYK_missions_2_6_desc: "亚平宁的山脉见证白玉楼的征服。向南，那不勒斯与阿普利亚的海岸在等待。"
 YYK_missions_2_7_title: "意大利的邀请"
 YYK_missions_2_7_desc: "那不勒斯、阿普利亚与卡拉布里亚尽归白玉楼。幽幽子向整个意大利发出邀请——归顺者生，抵抗者亡。幽冥的宣战理由已然就绪。"
 YYK_missions_2_8_title: "意大利王冠"
 YYK_missions_2_8_desc: "整个意大利半岛尽归白玉楼。幽幽子加冕意大利王冠，亡者公主成为半岛的至高统治者。"
 YYK_missions_3_1_title: "比利牛斯的门扉"
 YYK_missions_3_1_desc: "翻越比利牛斯，加泰罗尼亚的海岸线在望。伊比利亚——这片阳光之地，也将笼罩在幽冥的阴影之下。"
 YYK_missions_3_2_title: "阿拉贡的遗产"
 YYK_missions_3_2_desc: "阿拉贡的王冠落入幽幽子之手。巴伦西亚的海岸正在等待幽灵舰队的到来。"
 YYK_missions_3_3_title: "巴伦西亚海岸"
 YYK_missions_3_3_desc: "巴伦西亚的柑橘园在幽灵的注视下飘香。卡斯蒂利亚的高原就在前方。"
 YYK_missions_3_4_title: "卡斯蒂利亚高原"
 YYK_missions_3_4_desc: "卡斯蒂利亚的高原升起幽灵的旗帜。托莱多——西班牙的心脏——正待幽冥的降临。"
 YYK_missions_3_5_title: "托莱多的王座"
 YYK_missions_3_5_desc: "托莱多的王座为幽幽子而设。安达卢西亚的绿洲与瓜达尔基维尔的波光在南方闪耀。"
 YYK_missions_3_6_title: "安达卢西亚的绿洲"
 YYK_missions_3_6_desc: "上安达卢西亚的橄榄林归于白玉楼。再向南，塞维利亚与直布罗陀的海风扑面而来。"
 YYK_missions_3_7_title: "大西洋的门户"
 YYK_missions_3_7_desc: "下安达卢西亚落入幽冥之手，大西洋的门户洞开。伊比利亚的联合已在眼前。"
 YYK_missions_3_8_title: "伊比利亚的亡者统治"
 YYK_missions_3_8_desc: "从加泰罗尼亚到加利西亚，从安达卢西亚到埃斯特雷马杜拉——整个伊比利亚尽归白玉楼。亡者公主统御阳光之地。"
 YYK_missions_4_1_title: "幽灵士兵"
 YYK_missions_4_1_desc: "召集一支像样的军队——但幽幽子的军队由幽灵组成，不知疲倦，不畏死亡。陆军士气的高涨势不可挡。"
 YYK_missions_4_2_title: "死蝶之舞"
 YYK_missions_4_2_desc: "死蝶在战场上翩然起舞，军队的传统与士气同步升华。三十点的陆军传统是幽灵军团的荣耀。"
 YYK_missions_4_3_title: "亡灵军团"
 YYK_missions_4_3_desc: "亡灵军团组建完成，四十的陆军上限是幽冥武力的基石。死者在战场上的士气打击微乎其微。"
 YYK_missions_4_4_title: "白玉楼的庭师"
 YYK_missions_4_4_desc: "白玉楼的庭师训练幽灵士兵，军队的职业化达到两成。操练与士气齐头并进。"
 YYK_missions_4_5_title: "华胥的亡灵"
 YYK_missions_4_5_desc: "华胥的亡灵在炮火中岿然不动——五万大军集结，所受士气打击再度减免。"
 YYK_missions_4_6_title: "幽幽子的大军"
 YYK_missions_4_6_desc: "幽幽子的大军扩至八万，士气如樱花般绚烂，人力如幽灵般源源不断。"
 YYK_missions_4_7_title: "彼岸的军队"
 YYK_missions_4_7_desc: "来自彼岸的军队彻底免疫恐惧——职业度四成的幽灵军团，所受士气打击被完全抹消。"
 YYK_missions_4_8_title: "亡者之师"
 YYK_missions_4_8_desc: "十二万的亡者之师是战场上无可阻挡的传说。幽幽子的大军所至，生者唯有臣服。"
 YYK_missions_5_1_title: "彼岸的航路"
 YYK_missions_5_1_desc: "幽灵舰队驶向大海，十艘战舰拉开探索彼岸的序幕。殖民的航路在幽冥的指引下延伸。"
 YYK_missions_5_2_title: "幽灵移民"
 YYK_missions_5_2_desc: "二十艘战舰护卫着幽灵移民的船队。新世界的海岸线正等待白玉楼的旗帜。"
 YYK_missions_5_3_title: "亡者的殖民地"
 YYK_missions_5_3_desc: "第一块亡者的殖民地在新世界扎根。幽灵们不惧远航，殖民地的生长日新月异。"
 YYK_missions_5_4_title: "幽冥前哨"
 YYK_missions_5_4_desc: "三块幽冥前哨分布在海岸线上，殖民的脚步在新世界稳步向前。"
 YYK_missions_5_5_title: "樱吹雪的祝福"
 YYK_missions_5_5_desc: "樱吹雪祝福着五块殖民地，新世界的疆土在花瓣中生长，第二支殖民队伍整装待发。"
 YYK_missions_5_6_title: "彼岸的国土"
 YYK_missions_5_6_desc: "八块彼岸的国土连成一片，幽冥的势力在新世界扎下深根。"
 YYK_missions_5_7_title: "新世界的幽灵"
 YYK_missions_5_7_desc: "十二块殖民地遍布新世界，又一支幽灵殖民队伍踏上征途。"
