l_english:

 MND: "蒙德"
 MND_ADJ: "蒙德的"
 MND_ADJ2: "蒙德的"
 PROV97: "蒙德城"
 MND_knights_of_favonius_reform: "西风骑士团"
 MND_knights_of_favonius_reform_desc: "西风骑士团既是蒙德的军队，也是蒙德的政府。大团长率主力远征在外，留守的骑士便共议城中事务：琴掌剑与政务，丽莎守藏书，凯亚理情报，安柏领斥候。骑士团不设王座，也不按期改选——职位由功勋决定，谁能守住城墙，谁就有资格说话。"
 MND_barbatos_creed: "巴巴托斯的信条"
 MND_tt_barbatos_creed: "巴巴托斯的信条：奉巴巴托斯为主神时，所受士气打击减10%"
 MND_barbatos_creed_desc: "风神从不管政事，却在骑士团出征时把风借给他们。只要蒙德人还愿意在风花节把花献给他，这把风吹拂的地方，军队崩得就比别人慢一拍。"
 MND_resident_commissions: "处理居民委托"
 MND_resident_commissions_desc: "骑士团不只守城墙，也替城里人处理那些零碎却要紧的事：商会的货被水匪劫了、磨坊的水渠堵了、猎户的委托没人接。一件件办下来，地就一寸寸肥起来。"
 MND_resident_commissions_gt: "低地地区所有本国省份获得：发展成本减10%"
 MND_resident_commissions_rt: "该修正将从所有低地省份移除。"
 MND_resident_commissions_mod: "西风骑士团的委托"
 desc_MND_resident_commissions_mod: "骑士团接下了这一带居民的委托，道路、水渠与田界都在被认真打理，开发这块地比别处省力。"
 MND_estate_maratha_name: "西风骑士团"
 MND_estate_brahmins_name: "西风教会"
 MND_estate_burghers_name: "冒险家协会"
 MND_estate_nobles_name: "旧贵族"
 MND_ideas: "蒙德理念"
 MND_ideas_start: "蒙德传统"
 MND_ideas_start_desc: "蒙德被称为风与牧歌的城邦。风从果酒湖上吹来，推着蒙德人的长枪与歌声一起往前走。巴巴托斯没有替这里加冕过任何一位国王，可每个蒙德人都相信，这座城本身就落在风神的注视之下。"
 MND_ideas_bonus: "蒙德野心"
 MND_ideas_bonus_desc: "「愿风神护佑你。」这句话蒙德人说了上千年，从守城说到出征。骑士团不设王座，风也不属于任何一个人——只要城里还有人愿意守，这共和国就一直在这里。"
 MND_idea_1: "自由之邦"
 MND_idea_1_desc: "蒙德人很少问「谁准的」，只问「该不该」。三百年前推翻贵族之后，这里再没有国王，只有自己订下的规矩。异乡的信仰也能在城里安稳扎根：自由从来不挑人，也不挑神。"
 MND_idea_2: "风之翼"
 MND_idea_2_desc: "从城墙上一跃而下，张开风之翼，就能借着上升气流横渡果酒湖。蒙德的斥候和骑兵都熟悉这条路：他们总比敌人早半天出现在该出现的地方。"
 MND_idea_3: "西风骑士团"
 MND_idea_3_desc: "骑士团的马厩在城西，每天清晨都能听见蹄声。西风骑士以骑战闻名，一支小队就敢冲散数倍于己的步兵。大团长远征在外，留守的骑士仍让城门无人敢犯。"
 MND_idea_4: "风花节"
 MND_idea_4_desc: "每年春天，蒙德人把风之花献给风神，也把自家的酒和织品摆上街。节庆同时也是集市，商队从石门、从清泉镇涌进来，一整年的订单常常就在这几天谈定。"
 MND_idea_5: "四风守护"
 MND_idea_5_desc: "东风之龙、西风之鹰、南风之狮、北风之狼，四座庙宇废弃已久，名字却还留在蒙德四周。守城的人记得这四个名字，冲阵时便知道自己身后还有谁。"
 MND_idea_6: "西风教会"
 MND_idea_6_desc: "教会在蒙德不只是祈祷的场所。芭芭拉和修女们替伤兵包扎、替死者诵念，也替活着的人守住一点心安。伤者能回营，城就乱不了。"
 MND_idea_7: "为了巴巴托斯"
 MND_idea_7_desc: "蒙德人上阵时喊的不是国王的名字，是风神的名字。倒下一个，后面的人接着喊。他们相信风会听见，也相信风不会让他们白白倒下。"
 MND_missions_1: "风与牧歌"
 MND_missions_1_1_title: "风起之地"
 MND_missions_1_1_desc: "风从果酒湖上来，带着水汽与麦香。蒙德要做的第一件事，是让这三块地先站住脚——把城经营得比周围任何一片土地都更肥沃。"
 MND_missions_1_2_title: "千风一缕"
 MND_missions_1_2_desc: "巴巴托斯把风散到大陆各处，蒙德只承其中一缕。当骑士团的旗帜覆盖足够多的土地，这一缕风就能吹动整个提瓦特。"
 MND_missions_1_3_title: "晨曦酒庄"
 MND_missions_1_3_desc: "酒庄的葡萄架沿着山坡铺开，从蒙德城一直铺到晨曦的雾气里。酒卖得越远，骑士团的银库就越满——顺带，城墙之外的房子也该盖起来了。"
 MND_missions_1_4_title: "蒙德城迪卢克"
 MND_missions_1_4_desc: "晨曦酒庄的少东家不常待在酒窖里。迪卢克把酒业的利润换成工坊与铁砧，让蒙德的手艺比酒更硬——他说过，酒能暖人，铁才能护人。"
 MND_diluc: "迪卢克"
 MND_diluc_desc: "迪卢克亲自带兵，出手又快又狠。他不懂什么叫谈判，只懂在冲击的那一瞬间把对方的阵列劈开。"
 MND_dawn_winery: "晨曦酒庄产业"
 MND_dawn_winery_desc: "晨曦酒庄的酒桶堆到屋檐，果酒湖上的船一年比一年满。这一行的利润已经渗进了蒙德的每一寸土地。"
 MND_missions_2: "西风骑士团"
 MND_missions_2_1_title: "代理团长琴"
 MND_missions_2_1_desc: "大团长远征未归，代理团长只能自己扛起这座城。她一边批阅公文，一边亲自带队出征——一个国家要运转，总得有人在纸上和剑上同时用力。"
 MND_missions_2_2_title: "整饬骑士团"
 MND_missions_2_2_desc: "骑士团里有人开始各行其是。琴把所有人召集到西风大教堂前的广场上，宣读团规、重整编制，然后自罚一日不眠——秩序由此立起来。"
 MND_missions_2_3_title: "侦察小队"
 MND_missions_2_3_desc: "安柏带着侦察小队沿着果酒湖岸跑了一遍又一遍，把每一条小路、每一处浅滩都画进图里。骑兵要在风里跑得比敌人快，先得知道风往哪里吹。"
 MND_missions_2_4_title: "骑兵队长凯亚"
 MND_missions_2_4_desc: "凯亚的骑兵队在低地的平原上跑了一整个冬天。马掌磨平了三副，队列却越跑越整——等到春天，连风都追不上他们。"
 MND_kaeya_freeze: "冻结吧！"
 MND_kaeya_freeze_desc: "凯亚的骑兵冲进敌阵时，喊的是这一句。冰从马蹄下蔓延开来，把对方的阵列冻在原地，然后才是刀锋落下。"
 MND_missions_3: "旧贵族的答复"
 MND_missions_3_1_title: "稳定旧贵族"
 MND_missions_3_1_desc: "旧贵族在古恩希尔德家族的会客厅里坐了整整一夜。琴没有派兵，只送去一份新的税收章程——第二天，他们签了字。"
 MND_missions_3_2_title: "浪花骑士优菈"
 MND_missions_3_2_desc: "优菈带着她的浪花骑士们从雪山方向归来，队列整齐得像一把刚出鞘的剑。旧贵族看着这支队伍，把原本要说的话咽了回去。"
 MND_missions_3_3_title: "清扫风啸山坡"
 MND_missions_3_3_desc: "风啸山坡上盘踞着魔物与旧时代的残兵。骑士团倾巢而出，把这条路彻底扫干净——从此蒙德城到石门之间，商队不必再绕行。"
 MND_qianfeng_yilv: "千风一缕"
 MND_qianfeng_yilv_desc: "风神把千风散向大陆，蒙德承下其中一缕。这一缕风跟着骑士团的马蹄走，让队伍比敌人更快抵达战场。"
 MND_wine_industry: "酒庄产业"
 MND_wine_industry_desc: "晨曦酒庄的葡萄架铺到山脚，酒桶顺着果酒湖运往各处。葡萄一年比一年甜，酿出的酒也一年比一年值钱。"
 MND_together_as_one: "上下一心"
 MND_together_as_one_desc: "贵族、教会、商会与骑士团坐进了同一间议事厅。争执还在，但没人再想着另起炉灶——这座城的各路人马终于朝一个方向用力。"
 MND_terrain_survey: "地形勘测"
 MND_terrain_survey_desc: "侦察小队把低地的每一条小路、每一处浅滩都画进了地图。行军不再靠问路，损耗与迷途一并减少。"
 MND_wave_knight: "浪花骑士"
 MND_wave_knight_desc: "优菈的浪花骑士以雪山为训练场，队列与刀锋一样冷。她们冲锋时从不减速。"
 MND_mondstadt_stability: "蒙德的稳定"
 MND_mondstadt_stability_desc: "风啸山坡清扫干净，商路通了，城里的酒馆重新坐满了人。人心安定下来，军队也愿意多走一程。"
 MND_mondstadt_city: "蒙德城"
 MND_mondstadt_city_desc: "代理团长亲自过问城中的营造与市集，蒙德城的每一块砖、每一车货都被安排得妥妥当当。"
 MND_missions_3_4_title: "图书馆管理员丽莎"
 MND_missions_3_4_desc: "丽莎把最后一批禁书归架，顺手在借阅簿上画了个圈——那意味着这一个理念组已经被她读透了。图书馆的门从此对所有人敞开。"
 MND_sumuru_genius: "须弥天才"
 MND_sumuru_genius_desc: "须弥的学者把知识当成可以搬运的货物，丽莎把它变成可以挥霍的东西。蒙德的将领读她的书，读得比做算术还快。"
 MND_missions_4: "风的指引"
 MND_missions_4_1_title: "听凭风的指引"
 MND_missions_4_1_desc: "骑士团的队伍沿着果酒湖铺开，篝火从蒙德城一直亮到石门。低地的人开始明白，风是从哪个方向吹来的。"
 MND_missions_4_2_title: "保障蒙德城安全"
 MND_missions_4_2_desc: "城墙加高了一层，城下的集市也重新排了街。代理团长要的不是一座孤城，是一座夜里能安心睡觉的城。"
 MND_missions_4_3_title: "蒙德图书馆"
 MND_missions_4_3_desc: "魔法基本准则在提瓦特流传开来，蒙德的书架第一次比酒窖还满。丽莎把藏书按派系重排，向所有愿意读书的人敞开。"
 MND_library: "蒙德图书馆"
 MND_library_desc: "骑士团把旧仓库改成图书馆，藏书从炼金术到风史一应俱全。学者不必远行，知识自己会走进蒙德。"
 MND_missions_4_4_title: "蒙德的恢复"
 MND_missions_4_4_desc: "战后的田地重新翻过，屋顶补上新瓦。蒙德人把这段日子称为恢复期——不是回到从前，是把从前该有的都补回来。"
 MND_missions_5: "四风之外"
 MND_missions_5_2_title: "清扫敌对势力"
 MND_missions_5_2_desc: "低地的丘陵与河口还藏着不肯低头的势力。骑士团沿着四风的方向逐个清剿，把地图上那些空白一点点填满。"
 MND_missions_5_3_title: "种满蒲公英花"
 MND_missions_5_3_desc: "蒲公英是蒙德的花，也是风的花。骑士团占下的每一寸低地都在春天被种子铺满——花开了，这片土地才算真的姓蒙德。"
 MND_mondstadt_security: "蒙德安全"
 MND_mondstadt_security_desc: "城墙与巡逻队重新排布，蒙德城周围再没有可以藏人的角落。邻国看着这座城市，不得不重新掂量动手的代价。"
 MND_wind_guidance: "风神的指引"
 MND_wind_guidance_desc: "骑士团的旗子插在低地的每一处高地上，风从旗面掠过，替他们指明天该往哪边走。"
 MND_dandelion: "蒲公英花"
 MND_dandelion_desc: "低地的春天被蒲公英铺成白色。花不占地方，却让每一块土都更值钱。"
 MND_rebuilding: "蒙德建设问题"
 MND_rebuilding_desc: "房子要盖、路要修、酒窖要扩建——骑士团把能派的工匠全都派出去了，砖石与木料的价格一时都压了下来。"
 MND_missions_5_4_title: "蒙德的势力范围"
 MND_missions_5_4_desc: "蒙德的商队顺着莱茵河往北走，走到哪儿，哪儿的酒价就跟着变。骑士团要的不是一场战争，是让整条河都习惯蒙德的名字。"
 MND_missions_5_5_title: "莱茵兰的归绥"
 MND_missions_5_5_desc: "莱茵兰的城堡一座座换了旗。归绥不是征服的结束，是开始——往南，德意志的腹地正等着下一个名字。"
 MND_missions_6_1_title: "阿贝多的炼金工坊"
 MND_missions_6_1_desc: "阿贝多在城郊支起炉子，白垩与魔素在坩埚里翻滚。他不关心政治，只关心下一次实验能不能让蒙德的骑兵跑得更快。"
 MND_albedo: "白垩之子"
 MND_albedo_desc: "阿贝多把炼金的成果直接送进了骑士团的军械库。魔法按周期稳定产出，骑兵的冲击里也掺进了火。"
 MND_missions_4_5_title: "北德意志的固有领土"
 MND_missions_4_5_desc: "莱茵兰既已归绥，北面的德意志诸邦就是下一块。骑士团在每一座城头都插过旗，也就有资格说这些地方本来就是蒙德的。"
 MND_missions_1_5_title: "西风教会的祈祷"
 MND_missions_1_5_desc: "修女们在西风大教堂里念完最后一段祷词，教会的特权已经落到了实处。蒙德的人力不再只来自酒馆与田野，也来自这些愿意为城邦出力的人。"
 MND_missions_1_6_title: "天空之琴"
 MND_missions_1_6_desc: "天空之琴被供在教堂深处，琴弦一响，风就绕过城墙。骑士团把寺庙修满首都所在的整个地区，才让这把琴重新发出声音。"
 MND_missions_1_6_bonus_yes: "§G✓§! 额外奖励：首都所在地区所有省份都建有寺庙——获得「风神护佑」"
 MND_missions_1_6_bonus_no: "§R✗§! 额外奖励：首都所在地区所有省份都建有寺庙"
 MND_church_of_favonius: "西风教会"
 MND_church_of_favonius_desc: "教会把祈祷与救济一并铺开，蒙德的年轻人都愿意为骑士团出一次力。"
 MND_sky_lyre: "天空之琴"
 MND_sky_lyre_desc: "琴声一起，行军的人不再迷路，伤兵也回得来。"
 MND_wind_blessing: "风神护佑"
 MND_wind_blessing_desc: "风神没有现身，但风一直在。旗帜往哪边飘，军队就往哪边走得更快、更稳。"
 MND_missions_2_5_title: "蒙德的秘密武器"
 MND_missions_2_5_desc: "可莉把炸弹堆满了仓库，又拉着骑士们看她演示。火花四溅之后，城外的山坡少了一角，她说这叫火力压制。"
 MND_missions_3_5_title: "蒲公英骑士"
 MND_missions_3_5_desc: "蒲公英骑士不是头衔，是称号。骑士团把最沉的那面旗交给最稳的那支队伍，然后看着它一路向前，插到别人家城下。"
 MND_spark_knight: "火花骑士"
 MND_spark_knight_desc: "可莉的炸弹不讲道理，一片火光过去，对方的阵列就散了。"
 MND_dandelion_knight: "蒲公英骑士"
 MND_dandelion_knight_desc: "骑士团的队列稳得像一堵墙，蒲公英的种子落在哪，哪就是蒙德的地。"
 MND_missions_6_2_title: "创生之法"
 MND_missions_6_2_desc: "阿贝多的笔记里写着：物质可以被重新排布，石头能变成鸟，白垩能变成人。骑士团用储备的魔力验证了这句话，然后把它用在马蹄上。"
 MND_creation_law: "创生之法"
 MND_creation_law_desc: "骑士团的骑兵在冲锋时，马蹄下的地面会短暂地变得像斜坡一样。这不是错觉。"
 MND_missions_2_6_title: "龙脊雪山"
 MND_missions_2_6_desc: "龙脊雪山的雪线一年比一年低。骑士团在山口筑起要塞群，把那条旧商道重新踩了出来。"
 MND_missions_2_7_title: "魔龙杜林的童话故事"
 MND_missions_2_7_desc: "孩子们还在唱杜林的歌谣，可杜林已经不在了。阿贝多用创生之法重铸了它的骨头，让它在骑士团的骑兵里活过来。"
 MND_missions_3_6_title: "远征军的讯息"
 MND_missions_3_6_desc: "大团长的信从远方送到，信上只有一句话：远征还在继续，蒙德自己撑住。随信附来的金币足够修上几段城墙。"
 MND_missions_3_7_title: "米卡的归来"
 MND_missions_3_7_desc: "米卡带着测绘箱和一身雪回来了。他把远征沿途的地形全画进了图里，骑士团第一次知道山那边长什么样。"
 MND_missions_5_1_title: "女仆诺艾尔"
 MND_missions_5_1_desc: "诺艾尔先是女仆，然后才是骑士。她把营房、粮道、马厩一并打理得妥妥帖帖，部队只管往前打。"
 MND_missions_5_6_title: "德意志的皇帝"
 MND_missions_5_6_desc: "南北德意志的旗帜都换过了，剩下的只是名分。骑士团在亚琛加冕——从今天起，蒙德不再只是低地的城邦。"
 MND_missions_6_3_title: "魔女会援助"
 MND_missions_6_3_desc: "魔女会派人来谈条件：她们出人出术式，蒙德出钱出地。谈完之后，骑士团的账房少了一笔，宫廷多了几位不老的顾问。"
 MND_missions_6_4_title: "魔女茶会"
 MND_missions_6_4_desc: "茶会在城郊的别馆里开了一整天。端上来的不只是茶，还有成箱的魔导器与一份新的术式清单。"
 MND_wind_where_it_blows: "风吹到之处"
 MND_wind_where_it_blows_desc: "风从雪山口灌进要塞的箭孔，守军比攻方更熟悉每一处风口。"
 MND_durin: "杜林"
 MND_durin_desc: "巨龙的骨架被重新拼起，装上了骑士团的鞍具。它冲锋的时候，地面会记得那种重量。"
 MND_mondstadt_unification: "蒙德的统一"
 MND_mondstadt_unification_desc: "从低地到德意志，旗帜终于只剩一种颜色。骑士团的威名本身就是一种货币。"
 MND_maid_noelle: "女仆诺艾尔"
 MND_maid_noelle_desc: "她总在别人休息的时候干活。营房干净、粮草充足、马蹄钉得牢，部队出征前就赢了一半。"
 MND_scout_mika: "侦察骑士米卡"
 MND_scout_mika_desc: "米卡的地图精确到每一处浅滩。伤兵能被抬回营地，多半是因为他提前标好了路。"
 MND_witch_coven: "魔女会援助"
 MND_witch_coven_desc: "魔女会提供的术式让骑士团的骑兵跑得更快，也让魔法储备涨得更稳。"
 MND_missions_6_5_title: "闪击枫丹计划"
 MND_missions_6_5_desc: "枫丹就在诺曼底以南，隔着一片丘陵。骑士团需要的只是一个跑得够快的将领——五天之内穿过北法，枫丹就来不及集结。"
 MND_missions_6_6_title: "枫丹的归顺"
 MND_missions_6_6_desc: "诺曼底既下，枫丹的门就开了。骑士团没有急着北上，而是先把法兰西的庄园一座座收进名册——等枫丹的名字从地图上消失，这片土地就只剩一个主人。"
 MND_missions_6_7_title: "征服法兰西"
 MND_missions_6_7_desc: "法兰西的旧王旗一片片落下。水神没有阻拦，只在河岸上留下祝福：这片土地从此由蒙德来丈量。"
 MND_missions_7_1_title: "东风之龙"
 MND_missions_7_1_desc: "东风起时，龙从山脊上掠过。骑士团在东境点起烽火，等那头龙听见。"
 MND_missions_7_2_title: "南风之狮"
 MND_missions_7_2_desc: "南边的草原上，狮群按风向列队。骑士团把军旗插在风口，让南风先替他们吼一声。"
 MND_missions_7_3_title: "西风之鹰"
 MND_missions_7_3_desc: "西风把鹰送上云端。斥候在城墙上看着它盘旋，知道今天的风向对蒙德有利。"
 MND_missions_7_4_title: "北风之狼"
 MND_missions_7_4_desc: "北境的雪线之外，狼群在等。骑士团在雪原上留下一串马蹄印，告诉它们该往哪边走。"
 MND_hydro_archon_blessing: "水神的帮助"
 MND_hydro_archon_blessing_desc: "枫丹的水利与蒙德的营造合流，田地灌溉得比从前更好，城也盖得更快。"
 MND_missions_1_7_title: "天空下的芭芭拉"
 MND_missions_1_7_desc: "芭芭拉在广场上唱歌的时候，连风都会停一下。她不谈政治，只把祷词念给每一个愿意听的人——而风神确实在听。"
 MND_missions_1_7_bonus_yes: "§G✓§! 额外奖励：主神为巴巴托斯——获得「芭芭拉的祷告」"
 MND_missions_1_7_bonus_no: "§R✗§! 额外奖励：主神为巴巴托斯"
 MND_missions_2_8_title: "杜林的化形"
 MND_missions_2_8_desc: "杜林的骨头被重新排布过一次，第二次排布时它学会了换形。阿贝多说，这是创生之法的正确用法。"
 MND_sister_barbara: "修女芭芭拉"
 MND_sister_barbara_desc: "芭芭拉的歌声让城里的人安下心来，连最挑剔的旧贵族也不再闹事。"
 MND_barbara_prayer: "芭芭拉的祷告"
 MND_barbara_prayer_desc: "她每天为出征的人祈祷，伤兵回来得比从前更快。"
 MND_dragoon: "龙骑兵"
 MND_dragoon_desc: "披着龙鳞的骑兵不惧火与冲击，冲进敌阵时像一块会动的城墙。"
