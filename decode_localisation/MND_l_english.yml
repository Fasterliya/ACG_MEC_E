l_english:

 MND: "蒙德"
 MND_ADJ: "蒙德的"
 MND_ADJ2: "蒙德的"
 PROV97: "蒙德城"
 MND_knights_of_favonius_reform: "西风骑士团"
 MND_knights_of_favonius_reform_desc: "西风骑士团既是蒙德的军队，也是蒙德的政府。大团长率主力远征在外，留守的骑士便共议城中事务：琴掌剑与政务，丽莎守藏书，凯亚理情报，安柏领斥候。骑士团不设王座，也不按期改选——职位由功勋决定，谁能守住城墙，谁就有资格说话。"
 MND_barbatos_creed: "巴巴托斯的信条"
 MND_tt_barbatos_creed: "巴巴托斯的信条：奉巴巴托斯为主神时，所受士气打击减10%"
 MND_barbatos_creed_desc: "风神从不管政事，却在骑士团出征时把风借给他们。只要蒙德人还愿意在风花节把花献给他，这把风吹拂的地方，军队崩得就比别人慢一拍。"
 MND_resident_commissions: "处理居民委托"
 MND_resident_commissions_desc: "骑士团不只守城墙，也替城里人处理那些零碎却要紧的事：商会的货被水匪劫了、磨坊的水渠堵了、猎户的委托没人接。一件件办下来，地就一寸寸肥起来。"
 MND_resident_commissions_gt: "低地地区所有本国省份获得：发展成本减10%"
 MND_resident_commissions_rt: "该修正将从所有低地省份移除。"
 MND_resident_commissions_mod: "西风骑士团的委托"
 desc_MND_resident_commissions_mod: "骑士团接下了这一带居民的委托，道路、水渠与田界都在被认真打理，开发这块地比别处省力。"
 MND_estate_maratha_name: "西风骑士团"
 MND_estate_brahmins_name: "西风教会"
 MND_estate_burghers_name: "冒险家协会"
 MND_estate_nobles_name: "旧贵族"
 MND_ideas: "蒙德理念"
 MND_ideas_start: "蒙德传统"
 MND_ideas_start_desc: "蒙德被称为风与牧歌的城邦。风从果酒湖上吹来，推着蒙德人的长枪与歌声一起往前走。巴巴托斯没有替这里加冕过任何一位国王，可每个蒙德人都相信，这座城本身就落在风神的注视之下。"
 MND_ideas_bonus: "蒙德野心"
 MND_ideas_bonus_desc: "「愿风神护佑你。」这句话蒙德人说了上千年，从守城说到出征。骑士团不设王座，风也不属于任何一个人——只要城里还有人愿意守，这共和国就一直在这里。"
 MND_idea_1: "自由之邦"
 MND_idea_1_desc: "蒙德人很少问「谁准的」，只问「该不该」。三百年前推翻贵族之后，这里再没有国王，只有自己订下的规矩。异乡的信仰也能在城里安稳扎根：自由从来不挑人，也不挑神。"
 MND_idea_2: "风之翼"
 MND_idea_2_desc: "从城墙上一跃而下，张开风之翼，就能借着上升气流横渡果酒湖。蒙德的斥候和骑兵都熟悉这条路：他们总比敌人早半天出现在该出现的地方。"
 MND_idea_3: "西风骑士团"
 MND_idea_3_desc: "骑士团的马厩在城西，每天清晨都能听见蹄声。西风骑士以骑战闻名，一支小队就敢冲散数倍于己的步兵。大团长远征在外，留守的骑士仍让城门无人敢犯。"
 MND_idea_4: "风花节"
 MND_idea_4_desc: "每年春天，蒙德人把风之花献给风神，也把自家的酒和织品摆上街。节庆同时也是集市，商队从石门、从清泉镇涌进来，一整年的订单常常就在这几天谈定。"
 MND_idea_5: "四风守护"
 MND_idea_5_desc: "东风之龙、西风之鹰、南风之狮、北风之狼，四座庙宇废弃已久，名字却还留在蒙德四周。守城的人记得这四个名字，冲阵时便知道自己身后还有谁。"
 MND_idea_6: "西风教会"
 MND_idea_6_desc: "教会在蒙德不只是祈祷的场所。芭芭拉和修女们替伤兵包扎、替死者诵念，也替活着的人守住一点心安。伤者能回营，城就乱不了。"
 MND_idea_7: "为了巴巴托斯"
 MND_idea_7_desc: "蒙德人上阵时喊的不是国王的名字，是风神的名字。倒下一个，后面的人接着喊。他们相信风会听见，也相信风不会让他们白白倒下。"
