l_english:

 MND_four_winds_reform: "四风守护"
 MND_four_winds_reform_desc: "东风之龙、北风之狼、南风之狮、西风之鹰——四座庙宇早就塌了，四个名字还刻在蒙德人的骨头里。骑士团把这四道风重新请回议事厅：出征之前，城里只点一盏灯，选一头守兽随军。灯点下去，另外三盏就得熄着等——要等五年，风重新吹过城墙，才能再选一次。"
 MND_four_winds_cooldown: "四风守护的抉择"
 MND_wind_dragon_east: "东风之龙"
 MND_wind_dragon_east_desc: "特瓦林的风从不走直线。把它请上战场，队伍会在敌人还没列好阵的时候，就已经撞进去了。\n效果（持续 5 年）：补员速度 +10%，所受士气打击 -10%。"
 MND_wind_wolf_north: "北风之狼"
 MND_wind_wolf_north_desc: "安德留斯的狼群守着雪原。北风起的时候，蒙德人学会了在冻土上熬过别人熬不过的冬天。\n效果（持续 5 年）：冲击伤害 +15%，训练度 +2.5%。"
 MND_wind_lion_south: "南风之狮"
 MND_wind_lion_south_desc: "温妮莎举旗那年，南风头一回为奴隶而吹。狮子随军，城里每个人都知道自己为什么而战。\n效果（持续 5 年）：骑兵作战 +15%，骑兵比例 +10%。"
 MND_wind_falcon_west: "西风之鹰"
 MND_wind_falcon_west_desc: "教会的鹰一直盘旋在西风大教堂上方。它看见的东西，骑士团第二天就会知道。\n效果（持续 5 年）：移动速度 +10%，士气打击 +10%。"
 MND_wind_dragon_boon: "东风的庇佑"
 MND_wind_dragon_boon_desc: "特瓦林的风托着骑士团的后备队：伤兵回营更快，挨了士气打击也散得慢。"
 desc_MND_wind_dragon_boon: "特瓦林的风托着骑士团的后备队：伤兵回营更快，挨了士气打击也散得慢。"
 MND_wind_wolf_boon: "北风的庇佑"
 MND_wind_wolf_boon_desc: "狼群压上来的那一刻最狠：冲击阶段撕开缺口，队伍的纪律也跟着硬了一截。"
 desc_MND_wind_wolf_boon: "狼群压上来的那一刻最狠：冲击阶段撕开缺口，队伍的纪律也跟着硬了一截。"
 MND_wind_lion_boon: "南风的庇佑"
 MND_wind_lion_boon_desc: "狮子不等人：骑兵冲得更狠，队伍里敢把马放到前排的也更多了。"
 desc_MND_wind_lion_boon: "狮子不等人：骑兵冲得更狠，队伍里敢把马放到前排的也更多了。"
 MND_wind_eagle_boon: "西风的庇佑"
 MND_wind_eagle_boon_desc: "鹰先看见，也就先动手：整军推进得更快，开打时先一步压了对方的士气。"
 desc_MND_wind_eagle_boon: "鹰先看见，也就先动手：整军推进得更快，开打时先一步压了对方的士气。"
