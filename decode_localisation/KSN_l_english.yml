l_english:
 KSN_missions_6_1_title: "河童工业启动"
 KSN_missions_6_1_desc: "荷取集结了河童工程队——当常备军达到九成上限，便是对的黎波里塔尼亚、突尼斯与杰尔巴发动工业征服的时刻。水之力的掌握将为人偶与齿轮的结合拉开序幕。"
 KSN_missions_6_2_title: "水力革命"
 KSN_missions_6_2_desc: "的黎波里塔尼亚全境落入河童之手。水车与水坝昼夜运转，驱动着传动轴与锻造台。工业化的浪潮正朝着卡比利亚、阿尔及尔与巴巴里海岸奔涌。"
 KSN_missions_6_3_title: "光学瞄准仪"
 KSN_missions_6_3_desc: "三座工厂的烟囱刺破天际，月入三十金币的国库催生了精密光学工坊。如同狙击般精准的瞄准镜让人偶的炮火百发百中。"
 KSN_missions_6_4_title: "战争工业"
 KSN_missions_6_4_desc: "军事科技第八级突破、六万陆军上限与八成五的常备率——河童的军工体系全面启动。炮兵方阵与钢铁人形成为帝国最锋利的长矛。"
 KSN_missions_6_5_title: "工程霸权"
 KSN_missions_6_5_desc: "马格里布与意大利的双线战线初见成效，六百发展度与列强之名宣告了工程霸权的降临。河童的科技让血肉之躯的军队望尘莫及。"
 KSN_missions_6_6_title: "终极兵器库"
 KSN_missions_6_6_desc: "十座工厂昼夜轰鸣，百金月收入与八百发展度支撑着帝国史上最庞大的研发项目。围城加农炮、突击人形与完全纪律化的军团——终极兵器库的每一件作品都令敌人颤抖。"
 KSN_missions_6_7_title: "至高霸权"
 KSN_missions_6_7_desc: "马格里布与意大利的征服大业几近完成，霸权之名已无人质疑。两千金的月收入或十五万陆军上限——荷取的工程学达到了神域，全军共享着火炮与纪律的终极祝福。"
 KSN_missions_6_8_title: "究极工程师"
 KSN_missions_6_8_desc: "马格里布与意大利全境臣服，千五百发展度的霸权帝国傲视群伦。荷取·河城——这位河童工程师以齿轮与火药改写了世界的历史。首都化为永不陷落的工业要塞。"
 KSN_missions_7_1_title: "突尼斯之矛"
 KSN_missions_7_1_desc: "帝国海军集结至八成战力。突尼斯与杰尔巴的海岸将是河童舰队的第一个目标——跨越地中海的第一步。"
 KSN_missions_7_2_title: "突尼斯制霸"
 KSN_missions_7_2_desc: "突尼斯与杰尔巴的港口挂上了河童的旗帜。地中海的贸易之钥已然在手，卡比利亚与阿尔及尔的山脉正在前方等待。"
 KSN_missions_7_3_title: "马格里布整合"
 KSN_missions_7_3_desc: "卡比利亚与阿尔及尔的山城被齿轮军团碾平。巴巴里海岸、北摩洛哥与南摩洛哥——整个马格里布西半部分即将统一在河童的机械旗帜下。"
 KSN_missions_7_4_title: "马格里布之主"
 KSN_missions_7_4_desc: "十五省在帝国的版图中连成一片，永久宣称覆盖了整个马格里布。北非的矿产与人力被源源不断地输入河童的战争机器。"
 KSN_missions_7_5_title: "萨赫勒远征"
 KSN_missions_7_5_desc: "二十五省、四百发展度的马格里布已不足以满足帝国的胃口。撒哈拉以南——萨赫勒与尼日尔的无尽资源正在召唤荷取的勘探队与蒸汽钻机。"
 KSN_missions_7_6_title: "沙漠之主"
 KSN_missions_7_6_desc: "马格里布三十省与萨赫勒五省被征服。六百度发展度的帝国跨越了撒哈拉——沙漠不再是屏障，而是河童军工的原料仓库。"
 KSN_missions_7_7_title: "马格里布霸主"
 KSN_missions_7_7_desc: "马格里布三十五省，八百度发展度，突尼斯贸易节点六成份额——荷取已是无可争议的北非霸主。蒸汽机与火炮的轰鸣声响彻地中海南岸。"
 KSN_missions_7_8_title: "非洲霸权"
 KSN_missions_7_8_desc: "四十省的马格里布加上千度发展度与列强之位——荷取的非洲帝国已不可撼动。的黎波里的首都得到了三次发展度的全面升级。"
 KSN_missions_8_1_title: "西西里渡海"
 KSN_missions_8_1_desc: "五座港口与八成海军战力——河童舰队已准备好横渡第勒尼安海。西西里、西西西里与那不勒斯的沃土将是征服意大利的起锚之地。"
 KSN_missions_8_2_title: "西西里登陆"
 KSN_missions_8_2_desc: "西西里全岛落入河童之手。卡拉布里亚与阿普利亚——意大利的靴尖已触手可及。人偶部队在巴勒莫的王宫前列阵待命。"
 KSN_missions_8_3_title: "南意大利制霸"
 KSN_missions_8_3_desc: "那不勒斯、卡拉布里亚与阿普利亚——南意大利全境被齿轮军团扫平。下一站，拉齐奥圣城、托斯卡纳的荣光与中部意大利的心脏地带。"
 KSN_missions_8_4_title: "罗马征服"
 KSN_missions_8_4_desc: "拉齐奥与托斯卡纳的人偶军旗宣告了教宗之城的陷落。伦巴第的铁冠、威尼斯的运河与波河平原的粮仓——北意大利等待着征服者的马靴。"
 KSN_missions_8_5_title: "意大利加冕"
 KSN_missions_8_5_desc: "二十省在意大利的版图上连成一片，永久宣称覆盖了整个亚平宁半岛。荷取的铁王冠在米兰大教堂的钟声中加冕。"
 KSN_missions_8_6_title: "阿尔卑斯要塞"
 KSN_missions_8_6_desc: "意大利二十五省与六百发展度的体量让帝国的边疆推至阿尔卑斯山脊。皮埃蒙特的要塞防线构筑完成——北方再无威胁可以跨越这道钢铁之墙。"
 KSN_missions_8_7_title: "意大利之主"
 KSN_missions_8_7_desc: "意大利三十省、八百发展度、列强之名——荷取已是亚平宁半岛无可争议的主人。从西西里的碧波到阿尔卑斯之巅，齿轮旗帜在每一座钟楼上飘扬。"
 KSN_missions_8_8_title: "意大利霸权"
 KSN_missions_8_8_desc: "三十五省的意大利核心与千度发展度将荷取的帝国推至极盛。首都的黎波里化身为地中海的新罗马——三次发展全面提升的工业之都。"
 KSN_missions_9_1_title: "海军创新"
 KSN_missions_9_1_desc: "八座船坞与九成海军战力催生了河童的海军研发部门。新型船壳装甲与帆装设计让帝国的舰队傲视地中海。"
 KSN_missions_9_2_title: "地中海舰队"
 KSN_missions_9_2_desc: "十艘重型战舰与二十艘桨帆船拱卫着帝国的海岸线。地中海的制海权正在向荷取倾斜——重型舰炮与桨帆冲锋的完美结合。"
 KSN_missions_9_3_title: "科技优势"
 KSN_missions_9_3_desc: "行政、外交与军事科技同步突破第八级。河童的学堂诞生了一批超越时代的发明——科技先发优势让人形与火炮领先列强一整代。"
 KSN_missions_9_4_title: "海洋制霸"
 KSN_missions_9_4_desc: "二十艘重舰、十五座港口与满编舰队将帝国的海权延伸至大洋彼岸。首都新建了巨舰乾船坞——河童海军已准备好征服未知的海域。"
 KSN_missions_9_5_title: "贸易舰队"
 KSN_missions_9_5_desc: "三十艘轻型贸易帆船载着帝国的商货巡弋在地中海与西非海岸。走私与合法贸易为河童的国库带来滚滚财源。"
 KSN_missions_9_6_title: "贸易垄断"
 KSN_missions_9_6_desc: "突尼斯贸易节点五成份额与五座贸易仓库构成了帝国的商业霸权基石。商队与舰队将财富从沙漠与海洋两端源源输入。"
 KSN_missions_9_7_title: "海军霸权"
 KSN_missions_9_7_desc: "突尼斯节点七成五的份额与五十艘轻船让荷取的海军霸权无可匹敌。地中海已是河童的内湖——没有货物不经帝国许可而流通。"
 KSN_missions_9_8_title: "全球海军"
 KSN_missions_9_8_desc: "三十艘重舰、六十艘轻船、满编舰队与八百度发展度——河童的全球海军已可同时投放力量于四海。海神波塞冬也要为荷取的三叉戟让路。"
 KSN_missions_10_1_title: "经济引擎"
 KSN_missions_10_1_desc: "月收入突破二十五金币——河童的经济机器正式启动。工厂、矿山与贸易站如同齿轮般精密咬合，为帝国提供源源不断的财政血液。"
 KSN_missions_10_2_title: "首都工业"
 KSN_missions_10_2_desc: "五座工厂与五十金月收入将的黎波里打造为地中海最璀璨的工业明珠。首都的税收、生产与人力各提升两点——齿轮之都的崛起不可阻挡。"
 KSN_missions_10_3_title: "教育体系"
 KSN_missions_10_3_desc: "三所大学汇聚了帝国最聪明的头脑。行政科技十级或十二个理念组的完成为荷取的教育革命提供了知识基石。创新从每一间教室涌向兵工厂。"
 KSN_missions_10_4_title: "制造业帝国"
 KSN_missions_10_4_desc: "十座工厂的烟囱遮蔽了天空，百金月收入宣告了制造业帝国的诞生。从火炮到蒸汽机，从人形关节到精密齿轮——一切皆可量产。"
 KSN_missions_10_5_title: "大基建"
 KSN_missions_10_5_desc: "六百度发展度与一百五十金月收入支撑起帝国史上最雄心勃勃的基建计划。道路、桥梁、水道——河童的工程学让帝国的军队与商品以前所未有的速度流动。"
 KSN_missions_10_6_title: "稳定王国"
 KSN_missions_10_6_desc: "阶层忠诚均衡超过三成，八百度发展度的庞大帝国在荷取的铁腕统治下稳如磐石。全国叛乱度为零——没有齿轮能在完美的机器中松动。"
 KSN_missions_10_7_title: "经济霸权"
 KSN_missions_10_7_desc: "千度发展度、二百金月收入与十五座工厂——荷取的经济霸权让世界银行家俯首称臣。首都再次经历全方位的工业飞跃。"
 KSN_missions_10_8_title: "工业帝国"
 KSN_missions_10_8_desc: "千五百发展度与三百金月收入定义了一个崭新的时代——河童工业帝国。首都化为地球上最先进的大都市，五次发展全面提升为这座齿轮圣城加冕。"

 KSN_engineering_start: "河童工程启动"
 KSN_engineering_start_desc: "河童工程队在全境展开了水力勘测与工厂建设。第一批蒸汽动力的传动轴开始运转，帝国的工业时代由此开启。"
 KSN_water_power: "水力革命"
 KSN_water_power_desc: "水车与水坝的广泛应用让帝国的工厂昼夜不停地轰鸣——水之力驱动了整个工业体系的齿轮。"
 KSN_optical_sights: "光学瞄准仪"
 KSN_optical_sights_desc: "精密光学工坊将水晶透镜与黄铜镜筒结合，人偶炮兵的命中率超越了同时代所有人类军队。"
 KSN_war_industry: "战争工业"
 KSN_war_industry_desc: "河童的军工复合体全面启动——从炼钢炉到装配线，整个帝国变成了一台精密的战争机器。"
 KSN_engineer_hegemony: "工程霸权"
 KSN_engineer_hegemony_desc: "荷取的工程学达到了超越时代的水平。工程师在战场上直接修正火炮弹道，敌军在人偶军团的火力面前溃不成军。"
 KSN_final_arsenal: "终极兵器库"
 KSN_final_arsenal_desc: "围城加农炮、突击人形与完全纪律化的军团——终极兵器库中的每一件作品都足以改变一场战争的走向。"
 KSN_supreme_hegemony: "至高霸权"
 KSN_supreme_hegemony_desc: "河童至高霸权——全军共享火炮、步兵与防御技术的终极祝福。荷取的名字已成为军事工程学的代名词。"
 KSN_ultimate_engineer: "究极工程师"
 KSN_ultimate_engineer_desc: "荷取·河城以齿轮与火药改写了世界的历史。她的军团汇聚了人类与机械的全部军事智慧。"
 KSN_tunis_dominance: "突尼斯制霸"
 KSN_tunis_dominance_desc: "地中海的贸易之钥已然在手。突尼斯的港口昼夜吞吐着帝国的商船与战舰。"
 KSN_maghreb_consolidation: "马格里布整合"
 KSN_maghreb_consolidation_desc: "北非的矿产与人力被整合入帝国的战争机器。撒哈拉边缘的部落为河童军团提供了源源不断的兵源。"
 KSN_maghreb_master: "马格里布之主"
 KSN_maghreb_master_desc: "荷取是无可争议的北非霸主。邻国的恐惧与臣服让帝国的扩张代价降至最低。"
 KSN_sahel_expedition: "萨赫勒远征"
 KSN_sahel_expedition_desc: "蒸汽钻机与勘探队深入撒哈拉以南。沙漠不再是屏障，而是帝国通往无尽资源的走廊。"
 KSN_desert_master: "沙漠之主"
 KSN_desert_master_desc: "撒哈拉不再是屏障，而是河童军工的原料仓库。沙漠的要塞防线让任何入侵者望而却步。"
 KSN_maghreb_overlord: "马格里布霸主"
 KSN_maghreb_overlord_desc: "蒸汽机与火炮的轰鸣声响彻地中海南岸。帝国的商人与税吏遍及马格里布的每一座城市。"
 KSN_africa_dominance: "非洲霸权"
 KSN_africa_dominance_desc: "荷取的非洲帝国已不可撼动。专制度的火焰在北非的大地上熊熊燃烧。"
 KSN_sicily_invasion: "西西里渡海"
 KSN_sicily_invasion_desc: "河童舰队横渡第勒尼安海。桨帆船与重型战舰的联合编队让地中海的制海权毫无悬念。"
 KSN_south_italy_secured: "南意大利制霸"
 KSN_south_italy_secured_desc: "南意大利全境被齿轮军团扫平。这片富庶的土地为帝国提供了几乎无尽的人力储备。"
 KSN_rome_taken: "罗马征服"
 KSN_rome_taken_desc: "教宗之城在人偶军旗下陷落。永恒之城的沦陷向整个基督教世界宣告了河童的时代已经来临。"
 KSN_italy_crowned: "意大利加冕"
 KSN_italy_crowned_desc: "荷取的铁王冠在米兰的钟声中加冕。意大利的贵族与市民阶层在钢铁的威慑下选择了忠诚。"
 KSN_alpine_fortress: "阿尔卑斯要塞"
 KSN_alpine_fortress_desc: "北方再无威胁可以跨越这道钢铁之墙。阿尔卑斯的每一座隘口都被改造为永固堡垒。"
 KSN_italy_master: "意大利之主"
 KSN_italy_master_desc: "亚平宁半岛无可争议的主人。帝国的威望与军力如同阿尔卑斯山脉般稳固。"
 KSN_italian_hegemony: "意大利霸权"
 KSN_italian_hegemony_desc: "齿轮旗帜在每一座钟楼上飘扬。专制度的极限被推向了新的高度，意大利的土地上再无叛乱。"
 KSN_naval_innovation: "海军创新"
 KSN_naval_innovation_desc: "新型船壳装甲与帆装设计让河童战舰能以更少的损伤承载更多的火力。"
 KSN_mediterranean_fleet: "地中海舰队"
 KSN_mediterranean_fleet_desc: "重型舰炮与桨帆冲锋的完美结合。地中海的每一场海战都以河童的压倒性胜利告终。"
 KSN_tech_superiority: "科技优势"
 KSN_tech_superiority_desc: "超越时代的发明从帝国的每一所学院涌出。思潮的传播速度让邻国望尘莫及。"
 KSN_maritime_dominance: "海洋制霸"
 KSN_maritime_dominance_desc: "河童海军已准备好征服未知的海域。殖民舰队扬帆远航，帝国的边界延伸至大海的彼岸。"
 KSN_trade_fleet: "贸易舰队"
 KSN_trade_fleet_desc: "商船与私掠船共同编织了帝国的海上贸易网——合法与非法的一切财富都流向河童的金库。"
 KSN_trade_monopoly: "贸易垄断"
 KSN_trade_monopoly_desc: "没有货物不经帝国许可而流通。河童的贸易网络如同蛛网般精密——每一笔交易都在掌控之中。"
 KSN_naval_hegemony: "海军霸权"
 KSN_naval_hegemony_desc: "地中海已是河童的内湖。桨帆与重舰的联合舰队在每一片海域巡航，帝国旗帜永不降下。"
 KSN_global_navy: "全球海军"
 KSN_global_navy_desc: "海神波塞冬也要为荷取的三叉戟让路。帝国海军可以同时在四片大洋中投射力量。"
 KSN_economic_power: "经济引擎"
 KSN_economic_power_desc: "河童的经济机器正式启动。工厂、矿山与贸易站如同齿轮般精密咬合，驱动着帝国的财政心脏。"
 KSN_capital_industry: "首都工业"
 KSN_capital_industry_desc: "齿轮之都的崛起不可阻挡。首都的工坊与贸易站昼夜不息，成为整个帝国经济的发动机。"
 KSN_education_system: "教育体系"
 KSN_education_system_desc: "帝国最聪明的头脑汇聚于大学之中。从数学到弹道学——知识直接转化为战场上的优势。"
 KSN_manufacturing_empire: "制造业帝国"
 KSN_manufacturing_empire_desc: "从火炮到人形关节，从蒸汽机到精密齿轮——一切皆可在帝国的流水线上量产。"
 KSN_grand_infrastructure: "大基建"
 KSN_grand_infrastructure_desc: "道路、桥梁、水道——帝国的基建网络让军队与商品以前所未有的速度横跨大陆。"
 KSN_stable_realm: "稳定王国"
 KSN_stable_realm_desc: "没有齿轮能在完美的机器中松动。帝国的统治如同精密钟表般稳定——叛乱与动荡已成为历史记忆。"
 KSN_economic_hegemony: "经济霸权"
 KSN_economic_hegemony_desc: "世界银行家俯首称臣。河童的帝国掌控了全球贸易的命脉——财富、商品与人力的三重洪流。"
 KSN_industrial_empire: "工业帝国"
 KSN_industrial_empire_desc: "齿轮圣城的时代降临。河童的工业帝国以无可匹敌的生产力与创造力改写了人类文明的进程。"

 KSN_ideas: "河城荷取理念"
 KSN_ideas_start: "河城荷取传统"
 KSN_ideas_bonus: "荷取的钢铁防线"
 KSN_ideas_start_desc: "河城荷取的国家理念——工业与军事的完美结合。步兵部队经过标准化装备改良，河童的建筑团队以惊人的效率完成每一个工程。"
 KSN_ideas_bonus_desc: "当所有河童工程理念解锁，帝国的军队已能在炮火与骑兵冲锋中屹立不倒——工业的力量转化为最坚固的盾。"
 Kappa_Waterworks: "河童水车工坊"
 Kappa_Waterworks_desc: "水车、齿轮与传动轴——河童利用水力驱动了帝国最早的一批自动化工厂，商品如潮水般涌向全世界的市场。"
 Precision_Engineering: "精密工程学"
 Precision_Engineering_desc: "每一枚齿轮都精确到千分之一寸，每一根炮管都经过十二道工序打磨。河童的炮兵将领享有超越时代的火力指挥水准。"
 Optical_Industries: "光学工业"
 Optical_Industries_desc: "河童的精密透镜与瞄准镜让火炮的命中率达到了令人恐惧的高度，攻城部队在光学仪器的辅助下攻无不克。"
 Artillery_Legions: "炮兵军团"
 Artillery_Legions_desc: "河童组建了史上规模最大的专业化炮兵部队——从轻便的步兵炮到攻城的巨炮，帝国的每一场战役都以炮火拉开帷幕。"
 Mechanical_Infrastructure: "机械基建网"
 Mechanical_Infrastructure_desc: "铁路、桥梁与管道网络覆盖了帝国的每一寸土地——军队在数日之内横跨大陆，新兴城市的成本因工程技术而大幅下降。"
 Water_Power_Grid: "水力电网"
 Water_Power_Grid_desc: "巨型水坝与涡轮机将帝国的工业产能推向了前所未有的高度。工厂的烟囱无需停歇，建筑工期缩短至原先的一半以下。"
 Ultimate_Engineer_Corps: "究极工程兵团"
 Ultimate_Engineer_Corps_desc: "河童最顶尖的工程师被编入军团，在战场上直接部署攻城机械与防御工事。帝国军队的士气与纪律达到了钢铁般的境界。"
