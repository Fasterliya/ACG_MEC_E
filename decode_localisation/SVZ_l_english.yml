l_english:

 SVZ: "至冬"
 SVZ_ADJ: "至冬的"
 SVZ_ADJ2: "至冬的"
 SVZ_ideas: "至冬理念"
 SVZ_ideas_start: "至冬传统"
 SVZ_ideas_start_desc: "永冻的北境教会了至冬人两件事：服从，以及在雪里活下去。女皇的意志自冰宫传出，穿过风雪，抵达每一座兵营与每一间账房。"
 SVZ_ideas_bonus: "至冬野心"
 SVZ_ideas_bonus_desc: "女皇要的不是一个冬天，而是所有的冬天。当整个北境都听命于同一座冰宫，至冬的军队将踏过封冻的河流，走进任何一处春天。"
 SVZ_idea_1: "愚人众"
 SVZ_idea_1_desc: "他们不穿使节的礼服，也不带刀剑入城。愚人众以商队、学堂与剧院的名义散布各地，等他国察觉时，枢机与将军的案头早已摆满他们递来的纸。"
 SVZ_idea_2: "十一执行官"
 SVZ_idea_2_desc: "每一位执行官都足以独当一面：有人以武力破城，有人以言辞乱国。女皇只给一道命令，他们自会带回来一个结果。"
 SVZ_idea_3: "北国银行"
 SVZ_idea_3_desc: "战争烧钱，冬天也烧钱。北国银行替女皇把金币借给邻国的贵族，再把利息换成本国的军费——债务比条约更牢靠。"
 SVZ_idea_4: "永冻之地"
 SVZ_idea_4_desc: "入侵者要面对的不只是至冬的军队，还有长达半年的黑夜、冻硬的面包与随时会裂开的道路。在这里，撤退比进攻更致命。"
 SVZ_idea_5: "兵工厂联合体"
 SVZ_idea_5_desc: "冰宫以北，烟囱终年不熄。火炮、军靴、御寒的毛皮与弹药在同一座城里被造出来，再由铁路送往边境。"
 SVZ_idea_6: "女皇的绝对意志"
 SVZ_idea_6_desc: "在至冬，只有一个声音可以决定战争与和平。臣民或许畏惧她，但从不质疑她——这份确定性本身就是秩序。"
 SVZ_idea_7: "严寒淬炼"
 SVZ_idea_7_desc: "在至冬长大的孩子，先学会在雪里走路，再学会握枪。寒冷筛选了弱者，也把剩下的人锻成了兵。"
