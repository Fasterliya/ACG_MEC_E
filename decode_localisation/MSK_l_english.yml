### MISSION ###
# 布局 = 方案 B（漏斗收束）：key 已按新 slot_position 重编

 # ---------- slot 1 · 征服脊（10 城→北欧） ----------
 MSK_missions_1:0 "超电磁炮的征途"
 MSK_missions_1_1_title:0 "御坂美琴的日常"
 MSK_missions_1_1_desc:0 "常盘台的早晨从巡逻开始，风纪委员在校门口点名。要在这片土地上站住，先得把兵力补满。"
 MSK_missions_1_2_title:0 "无能力者集团"
 MSK_missions_1_2_desc:0 "没有超能力的人凑在一起，也能排出像样的阵线。下萨克森归于一统那天，学园都市的步兵和炮列第一次排到了城墙下。"
 MSK_missions_1_3_title:0 "风纪委员的巡逻艇"
 MSK_missions_1_3_desc:0 "吕贝克是这片海的心脏。给巡逻艇挂上新旗，波罗的海也该有一条属于学园都市的航道。"
 MSK_missions_1_4_title:0 "渡过海峡"
 MSK_missions_1_4_desc:0 "日德兰像一根伸向北海的手指。走过它，丹麦的门就开了，整片斯堪的纳维亚都会记住这个名字。"
 MSK_missions_1_5_title:0 "西兰岛的海港"
 MSK_missions_1_5_desc:0 "海峡对岸的西兰岛还坐着旧日的王。把港口拿下来，让商船和战舰共用一个泊位。"
 MSK_missions_1_6_title:0 "北上的商队"
 MSK_missions_1_6_desc:0 "越过海峡是瑞典的约塔兰。铁矿、木材、森林，都等着被编进学园都市的账本。"
 MSK_missions_1_7_title:0 "斯韦阿兰的王都"
 MSK_missions_1_7_desc:0 "斯韦阿兰的深处藏着北方最后的王都。风纪委员的徽章挂上城门那天，北方的旧秩序就算结束了。"
 MSK_missions_1_8_title:0 "斯堪的纳维亚的旗帜"
 MSK_missions_1_8_desc:0 "从日德兰到拉普兰，整片半岛都挂起了学园都市的旗。超电磁炮的名号，第一次跨过了海。"

 # ---------- slot 2 · 低地 + 点数采购支线 ----------
 MSK_missions_2:0 "学园都市的外交"
 MSK_missions_2_2_title:0 "低地远征"
 MSK_missions_2_2_desc:0 "荷兰与佛兰德斯的港口连成一片，学园都市的船可以一路开到海口。"
 MSK_missions_2_3_title:0 "低地统一"
 MSK_missions_2_3_desc:0 "从莱茵河口到海边，低地只剩一个主人。"
 MSK_missions_2_4_title:0 "研究院的拨款"
 MSK_missions_2_4_desc:0 "花掉 300 点行政点数，把研究经费一次给足。学园都市的工厂会记得这份账单。"
 MSK_missions_2_5_title:0 "炮厂的扩建"
 MSK_missions_2_5_desc:0 "花掉 300 点军事点数，扩建常盘台后山的炮厂。铸出来的炮更便宜，也更沉。"
 MSK_missions_2_7_title:0 "选票的价钱"
 MSK_missions_2_7_desc:0 "花掉 300 点外交点数，让德意志的宫廷记住学园都市的名字。吞并一个附庸，从此不用再等十年。"

 # ---------- slot 3 · 经济主脊（商路 → 产业 → 终局） ----------
 MSK_missions_3:0 "常盘台与黑子"
 MSK_missions_3_1_title:0 "常盘台的预算"
 MSK_missions_3_1_desc:0 "研究所的预算簿总是见底。要让学园都市转起来，先得把每一块砖的钱算清楚。"
 MSK_missions_3_2_title:0 "汉萨的账簿"
 MSK_missions_3_2_desc:0 "汉萨的账簿写满了上百年的生意。学园都市学会的是它记账的方式：船进港，钱记账，账再生钱。"
 MSK_missions_3_3_title:0 "低地的门户"
 MSK_missions_3_3_desc:0 "荷兰的港口停满了商船。学园都市要往西，先得推开这扇门。"
 MSK_missions_3_4_title:0 "莱茵兰"
 MSK_missions_3_4_desc:0 "莱茵河两岸的城堡与葡萄园，从来都是德意志最富的地方。"
 MSK_missions_3_5_title:0 "萨克森贸易区"
 MSK_missions_3_5_desc:0 "萨克森的银矿与集市，是北方商路的另一端。"
 MSK_missions_3_6_title:0 "军械商路"
 MSK_missions_3_6_desc:0 "两条商路在学园都市手里合成一条。运的是布匹、盐和铁，也运炮——便宜得多的炮。"
 MSK_missions_3_7_title:0 "超电磁炮"
 MSK_missions_3_7_desc:0 "十座城市，十张选票，理事会终于在最末的席位上留了一个位置。而御坂美琴带来的，是一门能从后排打穿城墙的炮。"
 MSK_missions_3_8_title:0 "学园都市的产业"
 MSK_missions_3_8_desc:0 "学园都市不再只是一座城邦。研究、工厂、商路连成一片，它开始自己养活自己的战争。"
 MSK_missions_3_9_title:0 "学园都市的霸业"
 MSK_missions_3_9_desc:0 "北欧的旗帜、低地的银库、帝国的选票，终于挂上了同一面墙。学园都市不再是一座城邦，而是一个帝国。"

 # ---------- slot 4 · 产业与采购（挂经济脊右侧） ----------
 MSK_missions_4:0 "学园都市的财阀"
 MSK_missions_4_2_title:0 "研究所群"
 MSK_missions_4_2_desc:0 "常盘台的研究所从一间变成一排，越往东越密。学园都市的脑袋就长在这里。"
 MSK_missions_4_3_title:0 "学园都市的黄金时代"
 MSK_missions_4_3_desc:0 "当每一座工厂都开足马力，城市才算真正富起来，连学生的制服都换成了新的。"
 MSK_missions_4_4_title:0 "学园都市的银行"
 MSK_missions_4_4_desc:0 "金币堆在地下室里不会生崽。理事会终于同意把它交给一群会算账的人。"
 MSK_missions_4_5_title:0 "通商许可"
 MSK_missions_4_5_desc:0 "莱茵与萨克森的商路握在手里之后，学园都市的商人出现在每一张德意志的合同上。"
 MSK_missions_4_6_title:0 "常盘台的预算案"
 MSK_missions_4_6_desc:0 "花掉 150 点行政点数，把常盘台的建筑预算一次性批下来。砖头、水泥、图纸，从此都便宜一些。"
 MSK_missions_4_7_title:0 "战术演习"
 MSK_missions_4_7_desc:0 "花掉 150 点军事点数，把风纪委员和教师拉到演习场。练过的人和没练过的人，在战场上不是一回事。"
 MSK_missions_4_8_title:0 "通商交涉"
 MSK_missions_4_8_desc:0 "花掉 150 点外交点数，让汉萨的商馆在学园都市里挂上招牌。"

 # ---------- slot 5 · 帝国脊 ----------
 MSK_missions_5:0 "皇帝的席位"
 MSK_missions_5_1_title:0 "常盘台的同桌"
 MSK_missions_5_1_desc:0 "白井黑子就住在隔壁。风纪委员的袖章比任何条约都可靠，一纸同盟签下去，吕贝克也就跟着过来了。"
 MSK_missions_5_2_title:0 "黑子的抉择"
 MSK_missions_5_2_desc:0 "当学园都市的军队压过白井黑子时，她没有开火，只把吕贝克的印章推了过来，连同整个风纪委员的辖区。"
 MSK_missions_5_3_title:0 "暗部的清扫"
 MSK_missions_5_3_desc:0 "黑子把风纪委员的旗交到学园都市手里。从那以后，这座城市只有一个名字需要服从，暗部也一样。"
 MSK_missions_5_4_title:0 "选帝侯的席位"
 MSK_missions_5_4_desc:0 "御坂美琴的名字已经在选帝侯的名单上。这张票投给谁，整个德意志都会盯着。"
 MSK_missions_5_5_title:0 "与木之本樱的盟约"
 MSK_missions_5_5_desc:0 "库洛牌的继承人愿意站在学园都市这一边。盟约签下去，学园都市的兵和库洛的牌一起上阵，汉堡的修女也收到了第一笔军费。"
 MSK_missions_5_6_title:0 "选帝侯的串联"
 MSK_missions_5_6_desc:0 "一张选票换不来皇冠。御坂美琴的使者在德意志的宫廷之间来回奔走，把三个名字写到了同一张纸上，顺带给木之本樱送去了一批教官。"
 MSK_missions_5_7_title:0 "库洛的援军"
 MSK_missions_5_7_desc:0 "库洛的牌和库洛的兵一起开进学园都市。木之本樱要的不只是一纸盟约，她要的是一支能替她打仗、也值得她出兵的军队。"
 MSK_missions_5_8_title:0 "帝国的学园都市"
 MSK_missions_5_8_desc:0 "神圣罗马的选票、诸侯的印信、学园的炮厂，全都归到一处。库洛的家族拿到世袭爵位，这座城市终于不只是德意志的一角，而是它的中心。"

