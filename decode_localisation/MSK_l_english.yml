### REFORM ###

 MSK_railgun_reform:0 "超电磁炮"
 MSK_railgun_reform_desc:0 "学园都市把御坂美琴的能力写进了军制：炮兵造价更低，冲击更狠，全国的人力也更充足。"
 MSK_electromaster_mechanic:0 "电击使"
 ability_MSK_electromaster_mechanic:0 "电击使"
 MSK_electromaster_power:0 "电击使"
 MSK_electromaster_power_desc:0 "投入军事点数蓄积电力。蓄得越满，炮兵作战与冲击伤害越强。"
 monthly_MSK_electromaster_power:0 "每月电击使变化"
 MSK_electromaster_power_gain_modifier:0 "电击使增益"
 MSK_electromaster_charge:0 "蓄电（50 军事点）"

### DECISION ###

 ACG_MEC_MSK_decalre_INX_war_decision_title:0 "对茵蒂克丝宣战"
 ACG_MEC_MSK_decalre_INX_war_decision_desc:0 "风纪委员已经锁定了茵蒂克丝的位置。这一次不再发传票——学园都市的军队将直接开进她的领地。此决议仅能执行一次，宣战瞬间双方的盟友都不会被召唤。"

### TOOLTIP ###

 ACG_MEC_MSK_missions_1_1_INX_war_tooltip:0 "解锁「§Y对茵蒂克丝宣战§!」，双方均无法召唤盟友"
 ACG_MEC_MSK_INX_CB_NO_ALLY_CALL_TT:0 "正在被御坂美琴的「§Y茵蒂克丝讨伐§!」宣战，无法召唤盟友。"
 ACG_MEC_void: ""

### CB ###

 cb_msk_index_war:0 "茵蒂克丝讨伐"
 cb_msk_index_war_desc:0 "茵蒂克丝的存在本身，就是对学园都市秩序的挑战。风纪委员的传票已经作废，接下来由超电磁炮说话。"

### WARGOAL ###

 war_goal_msk_index_war:0 "讨伐茵蒂克丝"
 war_goal_msk_index_war_desc:0 "以绝对优势压倒茵蒂克丝，迫使对方在谈判桌上低头。"

### WAR NAME ###

 MSK_INDEX_WAR_NAME:0 "御坂美琴对$DEFENDER$的茵蒂克丝讨伐战"
 MSK_new_era:0 "崭新的时代"
 MSK_missions_4_6_title:0 "崭新的时代"
 MSK_missions_4_6_desc:0 "北德意志已经归于一统，学园都市的军队也终于成了一支真正的大军。从这一天起，城市不再只是一个城邦。"
 MSK_secret_unrest:0 "暗中动荡"
 MSK_missions_6:0 "能力的等级"
 MSK_missions_6_1_title:0 "Lv.2"
 MSK_missions_6_1_desc:0 "陆军顶满编制、改革进度攒够二十五点——御坂美琴把自己的能力推高了一级：蓄电只要 25 军事点，进度掉落也慢一半。"
 MSK_missions_6_1_lv2_tooltip:0 "此后「蓄电」只消耗 25 军事点，电量衰减从每月 0.1 降到 0.05。"
 MSK_missions_6_2_title:0 "Lv.3"
 MSK_missions_6_2_desc:0 "十二万陆军、二十五点改革、一百七十五军事点——御坂美琴的电击使再升一级。"
 MSK_missions_6_2_lv3_tooltip:0 "立刻获得 50 点电力；此后每月自行增长 0.2 点；蓄满后额外获得 10% 士气打击与 5% 冲击伤害。"
 MSK_missions_6_3_title:0 "Lv.4"
 MSK_missions_6_3_desc:0 "三系点数各满一百、国库千金、二十万陆军、月入一百二——电击使升到第四级。"
 MSK_missions_6_3_lv4_tooltip:0 "电击使从 Lv.2 起每月自行增长（Lv.2 0.1、Lv.3 0.2、Lv.4 0.4），同时仍按进度衰减（满格 -0.05/月）；蓄满额外获得 10% 炮兵作战；每次招募将军额外获得 5 点电力。"
 MSK_missions_6_4_title:0 "Lv.5"
 MSK_missions_6_4_desc:0 "五千金、三十万陆军、月入四百、军事科技十级，且已握有超电磁炮战术——电击使踏进第五级。"
 MSK_missions_6_4_lv5_tooltip:0 "蓄满时额外获得 0.5 点炮兵冲击与 10% 所受士气打击减免，同时保留 10% 士气打击；每月自增 0.08、衰减 0.1。"
 MSK_missions_6_5_title:0 "Lv.6"
 MSK_missions_6_5_desc:0 "成为霸主、手握百日军事点——御坂美琴的电击使走到了这一代的尽头。"
 MSK_missions_6_5_lv6_tooltip:0 "蓄满时再获 +0.25 点炮兵冲击与 +10% 火力伤害；蓄电仅需 15 军事点。"
 MSK_electromaster_charge_25:0 "蓄电（25 军事点）"
 MSK_electromaster_charge_15:0 "蓄电（15 军事点）"
 estate_nobles_sister:0 "Sister"
 estate_nobles_sister_desc:0 "贵族中的「姐姐们」享有特权：自家土地不受没收，每月为御坂美琴提供 1 点军事点数；按其土地份额，提供人力、陆军上限与人力恢复，并压低稳定花费。"
 MSK_missions_2_11_title:0 "学园都市学区"
 MSK_missions_2_11_desc:0 "学园都市的学区划好了：手里有一格稳定，学区就算正式开张。"
 MSK_missions_1_12_title:0 "学区扩张"
 MSK_missions_1_12_desc:0 "把学区的地界往外推三块。"
 MSK_missions_2_12_title:0 "学区同盟"
 MSK_missions_2_12_desc:0 "与三个国家结盟，让学区在德意志有说话的份量。"
 MSK_missions_3_12_title:0 "学区军备"
 MSK_missions_3_12_desc:0 "常盘台的驻军凑够一万。"
 MSK_academy_country_name:0 "学园都市"
 MSK_academy_country_name_ADJ: "学园都市"
 MSK_missions_2_13_title:0 "初春饰利"
 MSK_missions_2_13_desc:0 "给她一笔经费，让她把学园都市的情报网铺开。"
 MSK_missions_3_13_title:0 "佐天泪子"
 MSK_missions_3_13_desc:0 "研究所群已经落成，行政科技也到了六级——把佐天泪子也算进这份名单。"
 MSK_missions_2_14_title:0 "常盘台委员会"
 MSK_missions_2_14_desc:0 "初春与佐天都在了，常盘台委员会正式成立：往后每一点君主点数都更值钱。"
 MSK_uiharu:0 "初春饰利"
 MSK_saten:0 "佐天泪子"
 MSK_committee:0 "常盘台委员会"
 MSK_missions_3_2_title:0 "说服食蜂操祈"
 MSK_missions_3_2_desc:0 "食蜂操祈与御坂美琴从来不对付。要么把她的地盘全数吃下，要么把她拉上同一张桌子——两条路都能拿到「心理掌控」。"
