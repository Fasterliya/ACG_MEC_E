l_english:
 gen2_build_army_title: "筹建大军"
 gen2_build_army_desc: "将军队扩充至上限，帝国的力量将从边疆向外辐射。邻近区域将收到我们的永久宣称。"
 gen2_expand_country_title: "开疆拓土"
 gen2_expand_country_desc: "我们的领土在过去数十年间大幅扩张。新获得的省份为进军下一个时代提供了跳板——邻近区域再次被纳入我们的宣称范围。"
 gen2_assemble_grand_army_title: "组建大兵团"
 gen2_assemble_grand_army_desc: "当陆军规模突破六万人或上限达到八万，我们便有能力组建一支令敌人胆寒的大兵团。一位随军传统而生的将军将统帅这支劲旅。"
 gen2_military_hegemony_title: "军事霸权"
 gen2_military_hegemony_desc: "五百度发展度与接近满编的常备军宣告了军事霸权的降临。帝国的陆军士气与火力伤害将获得永久提升。"
 gen2_form_navy_title: "筹建海军"
 gen2_form_navy_desc: "五座港口的海军舰队已扩充至九成上限。我们的战舰将沿着海岸线宣告帝国的存在——沿海区域均被纳入永久宣称。"
 gen2_establish_fleet_title: "成立舰队"
 gen2_establish_fleet_desc: "十艘重型战舰或三十艘桨帆船构成了帝国海军的中坚力量。一位经验丰富的提督将从航海学校的毕业生中脱颖而出。"
 gen2_dominate_trade_title: "贸易制霸"
 gen2_dominate_trade_desc: "我们在本埠贸易节点中占据了六成份额。帝国的商船队控制着财富的命脉，贸易效率得到了显著提升。"
 gen2_global_navy_title: "全球海军"
 gen2_global_navy_desc: "二十五艘重型战舰或四十艘轻型帆船将帝国的海权延伸至深蓝之海。一位探险家将率领远洋船队探索未知的地平线。"
 gen2_maritime_empire_title: "海洋帝国"
 gen2_maritime_empire_desc: "二十五座港口与六百度发展度铸造了我们的海洋帝国。殖民范围与殖民增长将永久提升——新大陆等待着帝国的舰队。"
 gen2_build_alliances_title: "建立同盟"
 gen2_build_alliances_desc: "两个以上的盟国让帝国的外交地位得到了巩固。改善关系的能力将在此期间大幅提升。"
 gen2_raise_subjects_title: "威服四方"
 gen2_raise_subjects_desc: "两个附庸国或两点的外交声誉标志着帝国已建立起周边附庸体系。附属国的忠诚将得到进一步的巩固。"
 gen2_diplomatic_ambition_title: "外交抱负"
 gen2_diplomatic_ambition_desc: "影响力与声誉达到新的高度，整个世界都视我们为值得信赖的伙伴。首都所处的整个区域已尽收我们的永久宣称之下。一位半价的外交顾问将加入朝廷。"
 gen2_global_presence_title: "全球存在"
 gen2_global_presence_desc: "列强之名与三个盟友构成了我们在世界舞台上的坚实立足点。一位额外的外交官与外交声誉将永久属于帝国。"
 gen2_build_treasury_title: "充盈国库"
 gen2_build_treasury_desc: "千枚金币的积蓄或二十元月收入让帝国的财政从容应对一切挑战。首都及其所在区域将获得一次发展度的全面提升。"
 gen2_high_income_title: "高收入经济"
 gen2_high_income_desc: "月收入突破四十金币，帝国的经济引擎开始全速运转。一位半价的财政顾问将协助管理日益庞大的帝国财政。"
 gen2_build_manufactories_title: "建设工厂"
 gen2_build_manufactories_desc: "七座工厂的烟囱改变了大地的轮廓。生产效率的提升为帝国的工业化浪潮奠定了基础。"
 gen2_economic_empire_title: "经济帝国"
 gen2_economic_empire_desc: "五百度发展度与八十金币月收入将帝国的经济推向了时代的巅峰。发展成本的降低与商品产出的提升将永续留存。"
 gen2_build_temples_title: "修建圣殿"
 gen2_build_temples_desc: "三座大圣堂或五座圣殿见证了帝国信仰的统一。首都的基础发展与周边区域的繁荣将共同获得提升。"
 gen2_root_out_corruption_title: "铲除腐败"
 gen2_root_out_corruption_desc: "稳固的统治与十五金币以上的月收入让腐败无处遁形。所有现存的腐败将被连根拔除，年腐败度的下降将长期持续。"
 gen2_cultural_development_title: "文化兴盛"
 gen2_cultural_development_desc: "两种以上的被接纳文化或八级行政科技标志着帝国文化的繁荣。文化转化成本在此期间将大幅削减，首都也将获得一次发展提升。"
 gen2_imperial_splendor_title: "帝国辉煌"
 gen2_imperial_splendor_desc: "四百度发展度与五十点威望宣告了帝国进入了辉煌时代。威望衰减与月辉煌度的永久提升将让帝国的荣光长存不灭。"
 gen2_urban_development_title: "城市建设"
 gen2_urban_development_desc: "六百度发展度，三所大学或八间工坊——帝国的大都市在建设热潮中焕然一新。首都的基础发展将全面提升，建筑成本与工期大幅下降。"

 gen2_military_readiness: "军事准备"
 gen2_military_readiness_desc: "备战状态：步兵作战能力得到加强。"
 gen2_claim_fabrication: "伪造宣称加速"
 gen2_claim_fabrication_desc: "间谍网络效率提升，伪造宣称的花费大幅削减——帝国为了扩张可以不择手段。"
 gen2_grand_army: "大兵团"
 gen2_grand_army_desc: "集结的大军团带来了训练度与围城能力的提升。"
 gen2_military_hegemony: "军事霸权"
 gen2_military_hegemony_desc: "帝国陆军的士气与火力已在他国之上。"
 gen2_naval_readiness: "海军准备"
 gen2_naval_readiness_desc: "舰队整装待发：海军士气得到强化。"
 gen2_established_fleet: "成军舰队"
 gen2_established_fleet_desc: "重型战舰与桨帆船的作战能力同步增强。"
 gen2_trade_dominance: "贸易制霸"
 gen2_trade_dominance_desc: "贸易效率的大幅提升让财富源源不断流入国库。"
 gen2_global_navy: "全球海军"
 gen2_global_navy_desc: "舰队规模与舰船耐久同步提升——海军已是全球力量。"
 gen2_maritime_empire: "海洋帝国"
 gen2_maritime_empire_desc: "殖民范围与殖民增长的永久提升让新大陆近在咫尺。"
 gen2_diplomatic_network: "外交网络"
 gen2_diplomatic_network_desc: "改善关系的效率大幅提升——我们的友谊更易获取。"
 gen2_subject_loyalty: "附庸忠诚"
 gen2_subject_loyalty_desc: "附属国的独立倾向在此期间得到显著抑制。"
 gen2_global_presence: "全球存在"
 gen2_global_presence_desc: "额外的外交官与外交声誉让我们在世界舞台上更加从容。"
 gen2_fiscal_discipline: "财政纪律"
 gen2_fiscal_discipline_desc: "全国税收得到适度的强化。"
 gen2_economic_growth: "经济增长"
 gen2_economic_growth_desc: "顾问花费的降低让更多的预算投入到帝国运营之中。"
 gen2_manufacturing: "工业制造"
 gen2_manufacturing_desc: "生产效率的提升推动了帝国的工业化进程。"
 gen2_economic_empire: "经济帝国"
 gen2_economic_empire_desc: "发展成本的降低与商品产出的增强将永久持续。"
 gen2_religious_unity: "信仰统一"
 gen2_religious_unity_desc: "全国叛乱度的下降让帝国的统治更加稳固。"
 gen2_clean_government: "清廉政府"
 gen2_clean_government_desc: "年腐败度下降——帝国的心脏更加健康地跳动。"
 gen2_cultural_flourishing: "文化繁荣"
 gen2_cultural_flourishing_desc: "文化转化成本的削减让帝国得以更好地融合多民族。"
 gen2_imperial_splendor: "帝国辉煌"
 gen2_imperial_splendor_desc: "威望衰减减缓并且每月获取额外辉煌点数。"
 gen2_urban_development: "城市建设"
 gen2_urban_development_desc: "建筑成本与工期的双重削减让帝国的基础建设飞速推进。"
 growth_of_capital_area: "首都繁荣"
 growth_of_capital_area_desc: "首都及其周边区域的发展成本在此期间下降。"
 perma_claim_neighbor_area: "获得对相邻区域的永久宣称"
 perma_claim_coastal_area: "获得对沿海相邻区域的永久宣称"
 perma_claim_capital_region: "获得对首都所在区域的永久宣称"
