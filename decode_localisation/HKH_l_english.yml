l_english:
 HKH_missions_6_1_title: "天狗新闻社"
 HKH_missions_6_1_desc: "当常备军达到八成五战力，海棠果启动了情报网络。费赞、的黎波里塔尼亚与突尼斯的间谍密布——天狗的双眼已遍布北非，未来尽在掌握。"
 HKH_missions_6_2_title: "舆情操纵局"
 HKH_missions_6_2_desc: "费赞全境的天狗谍报站投入运转。杰尔巴、卡比利亚与阿尔及尔的秘密档案已被海棠果翻阅——新闻即是权力。"
 HKH_missions_6_3_title: "舆论之翼"
 HKH_missions_6_3_desc: "两所大学的信息学系与六级外交科技让天狗的舆论操控达到登峰造极的境界。外交声望的飓风正在改变列强对帝国的态度。"
 HKH_missions_6_4_title: "天狗之眼"
 HKH_missions_6_4_desc: "三成骑兵率、四万陆军上限、八级军事科技——天狗骑探已是世界上最精锐的情报骑兵。视野即是胜利。"
 HKH_missions_6_5_title: "情报霸权"
 HKH_missions_6_5_desc: "马格里布与伊比利亚的双线情报网初见成效，五度发展度与列强之名宣告了情报时代的降临。围城专家的称号与冲击减免的战术让海棠果立于不败之地。"
 HKH_missions_6_6_title: "完全情报"
 HKH_missions_6_6_desc: "八座贸易仓库、八十金月收入与七百发展度构筑起全球最大的情报机器。火力减免与谍报防御的双重光环让帝国的秘密永不外泄。"
 HKH_missions_6_7_title: "至高情报局"
 HKH_missions_6_7_desc: "马格里布与伊比利亚的征服大业即将完成，霸权之名无可置疑。两百金月收入或十二万陆军上限——海棠果的情报网络覆盖了已知世界的每一寸土地。"
 HKH_missions_6_8_title: "全知帝国"
 HKH_missions_6_8_desc: "马格里布与伊比利亚全境臣服，千五百发展度的霸权帝国无所不知。海棠果·姬海堂——这位天狗记者用信息与骑兵改写了世界的历史。首都化为世界谍报的中心。"
 HKH_missions_7_1_title: "费赞之盾"
 HKH_missions_7_1_desc: "三座要塞拱卫着帝国的边疆。天狗从费赞出发——的黎波里塔尼亚与突尼斯的海岸线已在报章的头条之上。"
 HKH_missions_7_2_title: "天狗南征"
 HKH_missions_7_2_desc: "的黎波里塔尼亚与突尼斯全境被天狗骑探征服。卡比利亚与阿尔及尔的山脉——天狗的相机已对准下一组目标。"
 HKH_missions_7_3_title: "号外·阿尔及尔"
 HKH_missions_7_3_desc: "卡比利亚与阿尔及尔的陷落上了天狗新闻的头条。巴巴里海岸、北摩洛哥与南摩洛哥——连载的征服报道仍在继续。"
 HKH_missions_7_4_title: "北非特辑"
 HKH_missions_7_4_desc: "十五省在马格里布连成一片，永久宣称覆盖了整个北非。天狗出版社发行了《北非特辑》——成为帝国最畅销的出版物。"
 HKH_missions_7_5_title: "撒哈拉头条"
 HKH_missions_7_5_desc: "二十五省与四百度发展度的帝国将新闻触角伸向撒哈拉以南。萨赫勒与尼日尔——天狗的骑探比任何探险家都走得更远。骑兵的战力在沙漠中达到了新的高度。"
 HKH_missions_7_6_title: "沙漠巡报"
 HKH_missions_7_6_desc: "马格里布三十省与萨赫勒五省的天狗情报站昼夜运转。六百度发展度的帝国跨越了撒哈拉——信息就是跨越一切的桥梁。"
 HKH_missions_7_7_title: "北非号外·终章"
 HKH_missions_7_7_desc: "马格里布三十五省，八百度发展度。天狗出版社发行了精装全彩的《北非号外·终章》——海棠果已是北非无可争议的女王。"
 HKH_missions_7_8_title: "非洲情报局"
 HKH_missions_7_8_desc: "四十省的马格里布加上千度发展度与列强之位——海棠果的非洲情报帝国覆盖了大陆的每一个角落。费赞的首都在三次发展飞跃中化身为撒哈拉之珠。"
 HKH_missions_8_1_title: "天狗渡海"
 HKH_missions_8_1_desc: "五座港口与八成海军战力——帝国舰队驶向伊比利亚。巴利阿里群岛、上下安达卢西亚的富庶港口等待着天狗骑探的马蹄。"
 HKH_missions_8_2_title: "号外·安达卢西亚"
 HKH_missions_8_2_desc: "上下安达卢西亚的港口挂上了天狗的旗帜。托莱多、瓦伦西亚与阿拉贡——伊比利亚的心脏地带已暴露在骑兵的侦察之中。"
 HKH_missions_8_3_title: "卡斯蒂利亚的陷落"
 HKH_missions_8_3_desc: "托莱多与瓦伦西亚被天狗骑探踏平。卡斯蒂利亚、莱昂与阿斯图里亚斯——卡斯提尔的核心省份已被永久宣称覆盖。骑兵的冲击在西班牙平原上展现出完美的威力。"
 HKH_missions_8_4_title: "莱昂王座"
 HKH_missions_8_4_desc: "卡斯蒂利亚与莱昂的王座被海棠果的骑兵踏碎。加泰罗尼亚、加利西亚与阿连特茹——葡萄牙的大门已被打开。骑兵侧翼的战术臻于化境。"
 HKH_missions_8_5_title: "天狗西征"
 HKH_missions_8_5_desc: "二十省在伊比利亚连成一片，永久宣称覆盖了整个半岛。海棠果的骑兵在直布罗陀之岩举行了盛大的阅兵式——葡萄牙的贸易财富尽入帝国囊中。"
 HKH_missions_8_6_title: "伊比利亚加冕"
 HKH_missions_8_6_desc: "二十五省与六百度发展度的天狗帝国在托莱多举行了盛大的加冕礼。阶层忠诚与税收效率的双重祝福降临在伊比利亚的土地上。"
 HKH_missions_8_7_title: "西班牙女主人"
 HKH_missions_8_7_desc: "伊比利亚三十省、八百发展度、列强之名——海棠果已是半岛无可争议的女主人。专制度的火焰在天狗的国度里熊熊燃烧。"
 HKH_missions_8_8_title: "伊比利亚霸权"
 HKH_missions_8_8_desc: "三十五省与千度发展度的伊比利亚帝国已可与任何列强分庭抗礼。费赞的首都化身为沙漠中的阿尔罕布拉——骑兵与贸易的终极堡垒。"
 HKH_missions_9_1_title: "天狗商会"
 HKH_missions_9_1_desc: "月收入突破三十金币——天狗商会正式启动。从费赞绿洲到突尼斯港口的贸易线路被骑探牢牢控制。"
 HKH_missions_9_2_title: "殖民野望"
 HKH_missions_9_2_desc: "五座贸易仓库让帝国具备了海外扩张的实力。殖民者与探索舰队的时代来临——天狗的相机将要记录新大陆的风景。"
 HKH_missions_9_3_title: "天狗贸易网"
 HKH_missions_9_3_desc: "六十金月收入构筑起庞大的商业帝国。天狗的贸易网络覆盖了大西洋与地中海的交汇点。"
 HKH_missions_9_4_title: "新世界特辑"
 HKH_missions_9_4_desc: "二十艘轻型贸易帆船与十座港口让帝国具备了跨洋殖民的能力。天狗出版社正在策划《新世界特辑》——殖民地的风景将成为帝国最畅销的画报。"
 HKH_missions_9_5_title: "全球贸易网"
 HKH_missions_9_5_desc: "三十艘轻船护卫着帝国的商路。贸易引导的效率倍增——天狗的商人比任何情报员都更了解全球市场的脉搏。"
 HKH_missions_9_6_title: "殖民地特刊"
 HKH_missions_9_6_desc: "二百度发展度的殖民地已成为帝国经济的重要支柱。关税收入与殖民增长的同步提升让天狗帝国的财政稳如泰山。"
 HKH_missions_9_7_title: "贸易霸权"
 HKH_missions_9_7_desc: "五十艘轻船与十五座贸易仓库宣告了贸易霸权的降临。天狗商会已是全球最强大的商业组织。"
 HKH_missions_9_8_title: "海洋帝国"
 HKH_missions_9_8_desc: "七十艘轻船、三十座港口与八百度发展度的海洋帝国傲视群伦。商人、舰队与情报——海棠果的三叉戟同时刺入三片大洋。"
 HKH_missions_10_1_title: "天狗骑探队"
 HKH_missions_10_1_desc: "三成骑兵率与八成常备率——天狗骑探队正式组建。骑兵改革的号角在费赞的绿洲中吹响——冲击减免的战术开始融入天狗的兵书。"
 HKH_missions_10_2_title: "机动战术"
 HKH_missions_10_2_desc: "四万陆军上限与十支骑兵团让帝国具备了快速机动作战的能力。荒漠中练就的移动速度与低损耗战术成为天狗骑兵的招牌。"
 HKH_missions_10_3_title: "冲击战术"
 HKH_missions_10_3_desc: "六万陆军上限、三成五骑兵率与八级军事科技催生了全新的冲击战术体系。冲击伤害的增幅与承受冲击的大幅减免让天狗骑兵成为战场上的噩梦。"
 HKH_missions_10_4_title: "精英骑兵"
 HKH_missions_10_4_desc: "八万陆军上限、九成满编率与二十支骑兵团——天狗的精英骑兵军团已足以碾压任何对手。骑兵花费大减，侧翼突破力达到了可怕的五成增幅。"
 HKH_missions_10_5_title: "风之骑手"
 HKH_missions_10_5_desc: "四成骑兵率、三十支骑兵团与十万陆军上限。天狗的骑兵将领在冲击指挥上达到了传奇境界——骑兵战力与骑步比的完美配比无人能及。"
 HKH_missions_10_6_title: "天狗骑士团"
 HKH_missions_10_6_desc: "六百度发展度、满编陆军与十二万上限——天狗骑士团已可与任何骑士团分庭抗礼。将领冲击与骑兵战力的双重攀升令敌人闻风丧胆。"
 HKH_missions_10_7_title: "骑兵至上"
 HKH_missions_10_7_desc: "八百度发展度、十五万上限与四十支骑兵团——海棠果将骑兵战术推向了前所未有的高度。冲击伤害、承受冲击减免与骑兵战力的三合一恐怖组合。"
 HKH_missions_10_8_title: "究极骑兵"
 HKH_missions_10_8_desc: "千二百发展度、二十万上限与五成骑兵率——天狗的骑兵写下了战争的终极篇章。无法被阻挡的冲击、无法穿透的护甲、无法匹敌的侧翼——海棠果的骑兵就是战争之神。"
 HKH_intelligence_network: "天狗情报网"
 HKH_intelligence_network_desc: "天狗的双眼遍布北非。从费赞绿洲到突尼斯海岸，帝国最精干的情报员在每一个角落搜集秘密。"
 HKH_news_circulation: "新闻发行局"
 HKH_news_circulation_desc: "新闻即是权力。天狗的报纸在帝国每一个城镇发行——邻国对帝国的态度在舆论的飓风中悄然改变。"
 HKH_public_opinion: "舆论操控"
 HKH_public_opinion_desc: "塑造公众认知的终极技巧。天狗的笔杆让帝国的每一次扩张都被邻国视为正义之举。"
 HKH_tengu_vision: "天狗之眼"
 HKH_tengu_vision_desc: "视野即是胜利。天狗的斥候骑兵在敌阵中穿梭如风，将每一支敌军的动向实时传回指挥部。"
 HKH_intel_hegemony: "情报霸权"
 HKH_intel_hegemony_desc: "信息的全面优势转化为战场上的致命效率。攻城计划精确到每一扇城门——因为城防图早已在天狗的档案之中。"
 HKH_complete_info: "完全情报"
 HKH_complete_info_desc: "帝国的秘密永不外泄，而敌人的每一个弱点都已暴露在海棠果的案头。情报的不对称优势达到了极致。"
 HKH_supreme_intelligence: "至高情报"
 HKH_supreme_intelligence_desc: "情报网络覆盖了已知世界的每一寸土地。骑兵将领在完全情报的支援下攻城略地，敌人的每一次反击都已被提前预判。"
 HKH_omniscient_empire: "全知帝国"
 HKH_omniscient_empire_desc: "海棠果用信息与骑兵改写了世界的历史。围城如破竹，骑兵如疾风——全知即全能。"
 HKH_maghreb_base: "马格里布基地"
 HKH_maghreb_base_desc: "天狗在北非建立了坚实的帝国基地。撒哈拉的边缘部落为帝国的军团提供了几乎无限的兵源。"
 HKH_tunis_control: "突尼斯控制"
 HKH_tunis_control_desc: "地中海的贸易之钥掌握在天狗之手。商人与战船共享每一个港口——贸易与战争在此合流。"
 HKH_algeria_secured: "阿尔及尔平定"
 HKH_algeria_secured_desc: "卡比利亚与阿尔及尔的山脉已成为天狗的屏障。敌军任何穿越山区的企图都将付出惨重代价。"
 HKH_morocco_claim: "摩洛哥宣称"
 HKH_morocco_claim_desc: "天狗骑探征服了摩洛哥的沙漠与海岸。骑兵在开阔地形上的冲击力达到了前所未有的高峰。"
 HKH_maghreb_dominance: "马格里布称霸"
 HKH_maghreb_dominance_desc: "天狗骑探的马蹄踏遍了马格里布的每一片沙漠。帝国的版图扩张获得了邻国无奈的默认。"
 HKH_sahel_scout: "萨赫勒侦察"
 HKH_sahel_scout_desc: "天狗的骑探比任何探险家都走得更远。沙漠对马匹的损耗降到了最低——骑兵在沙海中如履平地。"
 HKH_africa_intel: "非洲情报帝国"
 HKH_africa_intel_desc: "大陆的每一个角落都在天狗的监视之下。专制度的强化让帝国的统治更加高效而不可撼动。"
 HKH_andalusian_expedition: "安达卢西亚远征"
 HKH_andalusian_expedition_desc: "帝国舰队驶向伊比利亚。重型战舰的炮口与天狗的海军旗帜一同出现在安达卢西亚的海平线上。"
 HKH_iberia_beachhead: "伊比利亚登陆"
 HKH_iberia_beachhead_desc: "天狗骑探踏上了欧洲大陆。伊比利亚的沼澤与平原成为骑兵最好的练兵场。"
 HKH_castille_heartland: "卡斯蒂利亚征伐"
 HKH_castille_heartland_desc: "卡斯提尔的核心省份已被骑兵踏平。西班牙广阔的平原为侧翼包抄提供了完美的战场。"
 HKH_portugal_trade: "葡萄牙贸易"
 HKH_portugal_trade_desc: "大西洋的贸易财富尽入帝国囊中。葡萄牙的商船队与海军港口成为了天狗全球贸易网的关键节点。"
 HKH_iberia_crowned: "伊比利亚加冕"
 HKH_iberia_crowned_desc: "海棠果的骑兵在直布罗陀之岩举行了盛大的阅兵。伊比利亚的贵族与平民在天狗的统治下选择了合作。"
 HKH_spanish_mastery: "西班牙之主"
 HKH_spanish_mastery_desc: "半岛无可争议的女主人。专制度的火焰在天狗帝国中燃起了永恒的光芒。"
 HKH_iberian_hegemony: "伊比利亚霸权"
 HKH_iberian_hegemony_desc: "天狗帝国在伊比利亚不可撼动。骑兵的冲击在烈日的炙烤下变得更加致命——敌军在冲锋前的恐惧已决定了胜负。"
 HKH_trade_empire: "天狗商会"
 HKH_trade_empire_desc: "从费赞绿洲到突尼斯港口——帝国的贸易线路被骑探牢牢控制。财富如同沙漠之泉般永不枯竭。"
 HKH_colonial_ambition: "殖民野望"
 HKH_colonial_ambition_desc: "探索队与殖民舰队扬帆远航。天狗出版社已经为殖民地预留了头版——新大陆的篇章即将开篇。"
 HKH_tengu_trade_network: "天狗贸易网"
 HKH_tengu_trade_network_desc: "大西洋与地中海的交汇点已被天狗掌控。商队与舰队在世界贸易的十字路口编织着帝国的金融网络。"
 HKH_new_world: "新世界特辑"
 HKH_new_world_desc: "殖民地的风景将成为帝国最畅销的画报。天狗的殖民者以惊人的速度在处女地上建立起繁华的定居点。"
 HKH_global_trade: "全球贸易网"
 HKH_global_trade_desc: "天狗的商人比任何情报员都更了解全球市场的脉搏。帝国的商路从大西洋延伸到印度洋——财源滚滚而来。"
 HKH_colonial_master: "殖民地总管"
 HKH_colonial_master_desc: "殖民地已成为帝国经济的重要支柱。关税与殖民增长的同步提升让天狗的财政稳如磐石。"
 HKH_trade_hegemony: "贸易霸权"
 HKH_trade_hegemony_desc: "天狗商会已是全球最强大的商业组织。帝国的商人数量与贸易自由度达到了前所未有的高度。"
 HKH_maritime_empire: "海洋帝国"
 HKH_maritime_empire_desc: "商人、舰队与情报——海棠果的三叉戟同时刺入三片大洋。帝国的海军与商船队覆盖了每一片可以航行的水域。"
 HKH_cavalry_reform: "骑兵改革"
 HKH_cavalry_reform_desc: "冲击减免的战术融入天狗的兵书。骑兵的比例与战术编组得到了全面的现代化改造。"
 HKH_mobile_warfare: "机动战术"
 HKH_mobile_warfare_desc: "荒漠中练就的招牌战术。天狗的骑兵以前所未有的速度在战场上穿梭——来去如风，不可捉摸。"
 HKH_shock_tactics: "冲击战术"
 HKH_shock_tactics_desc: "天狗骑兵成为战场上的噩梦。第一波冲锋的威力足以击溃任何敢于正面迎击的敌军阵列。"
 HKH_elite_cavalry: "精英骑兵"
 HKH_elite_cavalry_desc: "天狗的精英骑兵军团已足以碾压任何对手。侧翼包抄的威力让敌军的每一场战役都从溃败开始。"
 HKH_wind_rider: "风之骑手"
 HKH_wind_rider_desc: "骑兵将领在冲击指挥上达到了传奇境界。他们如同沙漠之风——所过之处，敌军阵列尽数崩溃。"
 HKH_tengu_riders: "天狗骑士团"
 HKH_tengu_riders_desc: "任何骑士团都不可与之分庭抗礼。天狗骑探的冲击指挥与作战能力已达到了神话般的境界。"
 HKH_cavalry_supremacy: "骑兵至上"
 HKH_cavalry_supremacy_desc: "骑兵战术被推向了前所未有的高度。冲击伤害、承受冲击防护与侧翼突破力的三重结合无懈可击。"
 HKH_ultimate_cavalry: "究极骑兵"
 HKH_ultimate_cavalry_desc: "海棠果的骑兵就是战争之神。冲锋无法被阻挡，阵列无法被击穿，侧翼无法被防守——在沙漠之风的见证下，每一位敌将都将在骑兵的蹄声中颤抖。"

 HKH_ideas: "姬海棠果理念"
 HKH_ideas_start: "姬海棠果传统"
 HKH_ideas_bonus: "果报新闻终刊"
 HKH_ideas_start_desc: "姬海棠果的国家理念——情报与骑兵的完美结合。骑兵作战能力与谍报进攻的双重加成让帝国在起跑线上就领先于所有对手。"
 HKH_ideas_bonus_desc: "当所有天狗情报理念解锁，帝国的军团与情报网已无可匹敌。士气与训练度的双重祝福降临于每一位天狗骑探。"
 Tengu_News_Network: "天狗新闻社"
 Tengu_News_Network_desc: "天狗的报纸以不可思议的速度在帝国的每一个角落发行——信息是最锋利的武器。外交官与改善关系的双重力量让邻国无法拒绝帝国的友谊。"
 Information_Warfare: "信息战"
 Information_Warfare_desc: "情报即是力量。天狗的情报网让邻国在每一次宣战时都犹豫不决——因为他们知道自己的秘密已经曝光。AE冲击与谍报防御让帝国的扩张如入无人之境。"
 Wind_Scout_Cavalry: "风之斥候骑兵"
 Wind_Scout_Cavalry_desc: "天狗骑探以风一般的速度侦察敌军动向，战场上的每一寸土地都在海棠果的掌握之中。将领机动与移动速度让敌军永远追不上帝国的马蹄。"
 Mobile_Tactics: "机动作战"
 Mobile_Tactics_desc: "荒漠中练就的骑兵战术让天狗的军团如同沙漠之风——来去无踪，不可阻挡。损耗减免与冲击防护让天狗骑兵在长期远征中依然保持巅峰战力。"
 Shock_Doctrine: "冲击学说"
 Shock_Doctrine_desc: "海棠果的骑兵将领开创了全新的冲击战术体系——第一波冲锋直接撕碎敌军阵列，不给予任何喘息之机。单一的冲击伤害加成已足以改变一场战争的胜负。"
 Tengu_Rider_Elite: "天狗精锐骑兵"
 Tengu_Rider_Elite_desc: "最精锐的天狗骑探被编入鸦兵团——装备最精良的战马与弯刀，以压倒性的侧翼包抄碾碎一切防线。骑兵花费大幅削减，骑步比的极限让帝国的骑兵比例远超任何列强。"
 Bullet_Journal_Express: "号外速报骑兵"
 Bullet_Journal_Express_desc: "战地记者骑兵——海棠果最疯狂也最致命的天才。她们在炮火中传递情报的同时用弯刀收割敌军，侧翼突击的威力无人能及。将领冲击与骑兵侧翼的双重加持让每一场冲锋都如同天罚。"

 HKH_spell_winds_of_tengu: "风神「天狗疾风队」"
 HKH_spell_winds_of_tengu_desc: "海棠果唤来了天狗一族的风神之力。骑兵部队在狂风之中获得了前所未有的冲击力与机动速度——如同沙漠之风，敌军还未反应过来便已被骑兵的弯刀淹没。"
 Winds_of_Tengu_Riders_title: "风神「天狗疾风队」"
 Winds_of_Tengu_Riders_desc: "需要消耗200军事点数。海棠果召唤了天狗的古老风神庇护——骑兵部队在风暴的加持下将获得毁灭性的冲击力与无法匹敌的战场机动性。"
