 ### GOVERNMENT REFORMS ###

 SKR_clow_card_reform: "库洛魔法使"
 SKR_clow_card_reform_desc: "小樱继承了库洛里德的封印之书，开始了收集库洛牌的旅程。"
 SKR_sakura_card_reform: "樱之卡大师"
 SKR_sakura_card_reform_desc: "通过了最后的审判。小樱将库洛牌转化为樱之卡，以自己的魔力驱动它们。"
 SKR_clear_card_reform: "透明卡觉醒"
 SKR_clear_card_reform_desc: "1550年，小樱的魔力达到顶峰，全新的力量创造了透明牌。透明牌赋予樱卓越的行政效率、军事纪律、造核速度，同时大幅减轻侵略扩张带来的外交压力。"

 ### IDEAS ###

 # SKR Idea names (localisation is handled by the tag system, these are for reference)
 Card_collector: "库洛牌收集"
 Card_collector_desc: "所有库洛牌都是从小樱手中散落的，必须一张不落地收回。"
 Cerberus: "可鲁贝洛斯"
 Cerberus_desc: "封印之兽小可——有着强大魔力却喜欢吃甜点的守护者。"
 Tomoyo_Daidouji: "大道寺知世"
 Tomoyo_Daidouji_desc: "小樱的好友兼战斗服设计师。知世的支援总是恰到好处。"
 Sakura_card: "樱之卡"
 Sakura_card_desc: "小樱用自己的魔力将库洛牌重新转化为樱之卡。每张卡牌的契约都被更新。"
 Clear_card: "透明牌"
 Clear_card_desc: "小樱无意识中创造的全新卡牌，蕴含着比库洛牌更强大的潜力。"
 King_of_cute: "萌王之力"
 King_of_cute_desc: "木之本樱凭借可爱的性格征服了所有人的心。"
 Release_SKR: "解放之力"
 Release_SKR_desc: "经历过无数战斗后，小樱学会了在扩张中保持克制和温和。"

 # TMY Idea names
 Costume_designer: "战斗服设计"
 Costume_designer_desc: "知世为小樱设计的战斗服不仅美观，还兼备战场的实用性。"
 Video_documentation: "影像记录"
 Video_documentation_desc: "知世用摄像机记录了小樱的每一次战斗，这些影像本身就是宝贵的资料。"
 Daidouji_fortune: "大道寺财团"
 Daidouji_fortune_desc: "知世身后的家族财富为国家提供了坚实的经济基础。"
 Sakuras_guardian: "樱的守护者"
 Sakuras_guardian_desc: "知世始终站在小樱身后，守护着她的一切。"
 Melody_of_hearts: "心之旋律"
 Melody_of_hearts_desc: "知世的歌声能让最敌对的邻居放下戒备。"
 Sakura_and_tomoyo: "樱与知世"
 Sakura_and_tomoyo_desc: "两人的羁绊超越了国界——知世愿意为小樱献出一切。"
 Eternal_friendship: "永恒的友谊"
 Eternal_friendship_desc: "永远的友谊让国家政策更加灵活。"

 ### MISSION TITLES ###

 # Slot 6 - Card Collection
 SKR_missions_6_title: "封印之书"
 SKR_mission_6_1_title: "打开封印"
 SKR_mission_6_1_desc: "在地下室找到了那本古老的书。打开它的瞬间，卡片如风一般四散而去——这是小樱与库洛牌的初次相遇。"
 SKR_mission_6_2_title: "追风"
 SKR_mission_6_2_desc: "风、翔、水。前三张牌在城市各处引起了骚动。小樱穿上知世做的战斗服，开始了第一次的收服之旅。"
 SKR_mission_6_3_title: "元素试炼"
 SKR_mission_6_3_desc: "火、地、雷。元素之牌正在肆虐。小樱用封印之杖将它们一一收服。"
 SKR_mission_6_4_title: "剑与盾"
 SKR_mission_6_4_desc: "剑牌与盾牌——库洛牌中攻防的极致。收服它们需要超乎寻常的专注。"
 SKR_mission_6_5_title: "光与暗"
 SKR_mission_6_5_desc: "光牌与暗牌。最强的两张库洛牌，彼此对立又互相依存。小樱必须在两者之间找到平衡。"
 SKR_mission_6_6_title: "创与消"
 SKR_mission_6_6_desc: "创造与消除。最后两张库洛牌。从无到有，从有到无——这是库洛牌中最为本源的力量。"
 SKR_mission_6_7_title: "最后的审判"
 SKR_mission_6_7_desc: "十二张库洛牌全部归位。审判者「月」已经苏醒。小樱必须证明自己是牌真正的主人。"
 SKR_mission_6_8_title: "全新的力量"
 SKR_mission_6_8_desc: "库洛牌已转化为樱之牌。但小樱的魔力仍在成长——无意识中，全新的「透明牌」开始诞生。"
 SKR_mission_6_9_title: "全新的牌"
 SKR_mission_6_9_desc: "疾风、包围、水源。透明牌的力量与库洛牌截然不同——更直接，也更强大。"
 SKR_mission_6_10_title: "意志的形状"
 SKR_mission_6_10_desc: "行动牌与记录牌。让万物随之而动、让时光重新倒流——小樱的意志开始塑造世界。"
 SKR_mission_6_11_title: "最后的碎片"
 SKR_mission_6_11_desc: "飞翔、烈火与修复。这是最后三张透明牌。小樱的魔力已经无人能及。"
 SKR_mission_6_12_title: "牌之主"
 SKR_mission_6_12_desc: "二十张牌悉数归位。小樱不是继承者——她才是真正的牌之主人。"

 # Slot 7 - Bohemia
 SKR_missions_7_title: "友枝町"
 SKR_mission_7_1_title: "踏出第一步"
 SKR_mission_7_1_desc: "追逐库洛牌需要力量。小樱必须整顿军队，才能安心踏上收集之旅。"
 SKR_mission_7_2_title: "最好的朋友"
 SKR_mission_7_2_desc: "知世就在摩拉维亚。她是小樱最好的朋友、最强的后盾——没有什么比她的支持更重要。"
 SKR_mission_7_3_title: "收复故土"
 SKR_mission_7_3_desc: "摩拉维亚是友枝町的延伸。库洛牌曾在那里留下痕迹，绝不能让它落入外人之手。"
 SKR_mission_7_4_title: "安宁的家"
 SKR_mission_7_4_desc: "波西米亚与摩拉维亚统一之日，才是友枝町真正安宁之时。"
 SKR_mission_7_5_title: "盛开的樱花"
 SKR_mission_7_5_desc: "布拉格将如春天的樱花般盛开。让这座城市成为大陆上最温暖的地方。"
 SKR_mission_7_6_title: "知世家的商路"
 SKR_mission_7_6_desc: "知世家的商业网络遍布四方。为小樱的旅途提供源源不断的支援。"
 SKR_mission_7_7_title: "樱之学堂"
 SKR_mission_7_7_desc: "五所大学在波西米亚落成。小樱希望每个孩子都能像她一样自由地学习。"
 SKR_mission_7_8_title: "帝国舞台"
 SKR_mission_7_8_desc: "成为选帝侯——这不仅是荣耀，更是责任。小樱将用这份力量守护更多人。"
 SKR_mission_7_9_title: "大道的工厂"
 SKR_mission_7_9_desc: "工厂日夜运转，如同知世家的大道财团。让波西米亚成为工业的心脏。"
 SKR_mission_7_10_title: "第一座城"
 SKR_mission_7_10_desc: "布拉格成为帝国最大的城市。这是小樱送给所有市民的礼物。"
 SKR_mission_7_11_title: "智慧之光"
 SKR_mission_7_11_desc: "十所大学在波西米亚落成。知识与魔法在这里交汇，照亮了每一个角落。"
 SKR_mission_7_12_title: "黄金时代"
 SKR_mission_7_12_desc: "波西米亚迈入前所未有的繁荣。小樱与知世相视而笑——这就是她们守护的家。"

 # Slot 8 - HRE
 SKR_missions_8_title: "守护的誓言"
 SKR_mission_8_1_title: "选帝侯的职责"
 SKR_mission_8_1_desc: "改革已经启动。小樱用她的声音推动了帝国的第一次变革。"
 SKR_mission_8_2_title: "不再有战争"
 SKR_mission_8_2_desc: "帝国永远的和平令颁布。小樱不愿再看到这片土地上有无谓的纷争。"
 SKR_mission_8_3_title: "世代之约"
 SKR_mission_8_3_desc: "波西米亚对帝国的守护将世代相传。这是小樱向所有人许下的约定。"
 SKR_mission_8_4_title: "帝国的铁锤"
 SKR_mission_8_4_desc: "帝国战争令已下。小樱将带领帝国用统一的声音面对外部威胁。"
 SKR_mission_8_5_title: "诸侯之终"
 SKR_mission_8_5_desc: "撤销诸侯特权。帝国终于可以在一面旗帜下并肩前行。"
 SKR_mission_8_6_title: "合而为一"
 SKR_mission_8_6_desc: "帝国在小樱手中完成了统一。牌的力量与帝国的权威融为一体。"
 SKR_mission_8_7_title: "帝国的守护者"
 SKR_mission_8_7_desc: "一千五百发展度，威望如日中天。小樱是帝国当之无愧的守护者。"
 SKR_mission_8_8_title: "羽翼之下"
 SKR_mission_8_8_desc: "两千发展度。帝国的版图延伸至天边，但小樱的守护之心从未改变。"
 SKR_mission_8_9_title: "帝国之剑"
 SKR_mission_8_9_desc: "三十万将士枕戈待旦。小樱的军队是帝国最坚固的盾。"
 SKR_mission_8_10_title: "帝国之帆"
 SKR_mission_8_10_desc: "百艘战舰巡弋海疆。即便是最汹涌的波涛，也臣服于牌的力量之下。"
 SKR_mission_8_11_title: "黄金航线"
 SKR_mission_8_11_desc: "月入五百金币。帝国的商路通达天下，财富惠及每一位子民。"
 SKR_mission_8_12_title: "苍穹之下"
 SKR_mission_8_12_desc: "成为世界霸主。小樱守护的已经不仅是帝国，而是整片苍穹之下的生灵。"

 # Slot 9 - Germany
 SKR_missions_9_title: "绝不放弃"
 SKR_mission_9_1_title: "第一道门"
 SKR_mission_9_1_desc: "巴伐利亚与法兰克尼亚是德意志的第一道门。军统达到四十，小樱将亲手推开它。"
 SKR_mission_9_2_title: "南北并进"
 SKR_mission_9_2_desc: "南北德意志各取十五省。如同牌的两面，必须齐头并进。"
 SKR_mission_9_3_title: "向西深入"
 SKR_mission_9_3_desc: "黑森与威斯特法伦在等待。二十五省在手，德意志的中枢已经动摇。"
 SKR_mission_9_4_title: "莱茵之盾"
 SKR_mission_9_4_desc: "莱茵兰、普法尔茨与施瓦本。三十五省——德意志的西部边界已是小樱的防线。"
 SKR_mission_9_5_title: "北方之门"
 SKR_mission_9_5_desc: "波美拉尼亚、梅克伦堡与布伦瑞克。四十五省——北海的微风也传来了樱的气息。"
 SKR_mission_9_6_title: "德意志军魂"
 SKR_mission_9_6_desc: "八百发展度与十二万大军。牌的力量与军队的意志在此刻合而为一。"
 SKR_mission_9_7_title: "天命所归"
 SKR_mission_9_7_desc: "五十五省在手。德意志的大部分已经在小樱的守护之下。"
 SKR_mission_9_8_title: "一统天下"
 SKR_mission_9_8_desc: "整个德意志归于统一。从阿尔卑斯到波罗的海，每座城都飘扬着樱的旗帜。"
 SKR_mission_9_9_title: "不破之壁"
 SKR_mission_9_9_desc: "五座星堡拱卫边境。正如盾牌守护着樱，这些堡垒守护着德意志。"
 SKR_mission_9_10_title: "丰饶大地"
 SKR_mission_9_10_desc: "德意志的每一寸土地都达到十五发展。这是最好的时代。"
 SKR_mission_9_11_title: "钢铁脉动"
 SKR_mission_9_11_desc: "十座兵工厂同时运转。德意志的工业力量令人敬畏。"
 SKR_mission_9_12_title: "德意志之巅"
 SKR_mission_9_12_desc: "称霸天下，雄踞德意志。小樱站在山巅回望来路——这一路，她从未放弃。"

 # Slot 10 - Italy
 SKR_missions_10_title: "飞翔的魔法"
 SKR_mission_10_1_title: "飞越阿尔卑斯"
 SKR_mission_10_1_desc: "威尼斯与伦巴第就在山的那边。就像「翔」牌带着小樱飞越城市，她将飞越阿尔卑斯。"
 SKR_mission_10_2_title: "半岛的呼唤"
 SKR_mission_10_2_desc: "在意大利占下十个省份。波河平原的富庶让人心驰神往。"
 SKR_mission_10_3_title: "永恒之城"
 SKR_mission_10_3_desc: "拉齐奥与罗马。连教皇也无法阻挡小樱的脚步。"
 SKR_mission_10_4_title: "海岛落日"
 SKR_mission_10_4_desc: "那不勒斯、阿普利亚与西西里。意大利的南端在夕阳下熠熠生辉。"
 SKR_mission_10_5_title: "最后的拼图"
 SKR_mission_10_5_desc: "撒丁与皮埃蒙特。这是意大利地图上最后的空缺。"
 SKR_mission_10_6_title: "热那亚之潮"
 SKR_mission_10_6_desc: "发展破千，热那亚节点的财富如潮水般涌来。小樱的国库从未如此充盈。"
 SKR_mission_10_7_title: "亚平宁之主"
 SKR_mission_10_7_desc: "四十五省在手。小樱的名字响彻每一座意大利城邦。"
 SKR_mission_10_8_title: "统一意大利"
 SKR_mission_10_8_desc: "整个意大利归于统一。从阿尔卑斯到西西里，樱的旗帜在南欧飘扬。"
 SKR_mission_10_9_title: "地中海舰队"
 SKR_mission_10_9_desc: "五十艘巨舰与轻舰——小樱的舰队足以让任何对手胆寒。"
 SKR_mission_10_10_title: "双星闪耀"
 SKR_mission_10_10_desc: "同时掌控热那亚与威尼斯。地中海的两颗明珠尽在手中。"
 SKR_mission_10_11_title: "黄金意大利"
 SKR_mission_10_11_desc: "意大利的每一个省份都达到十五发展。从米兰到巴勒莫，繁荣无处不在。"
 SKR_mission_10_12_title: "我们的海"
 SKR_mission_10_12_desc: "称霸地中海——让这片蔚蓝的海成为樱的内湖。这是罗马也未曾实现的梦。"

 ### CB ###

 cb_skr_german_unification: "德意志统一战争"
