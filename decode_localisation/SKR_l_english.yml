 ### CARD ALBUM EVENT ###

 skr_card_events.200.t: "库洛牌图鉴"
 skr_card_events.200.d: "可以在政府界面查看已收集的卡牌情况。"
 skr_card_events.200.a: "好的。"

 ### TOOLTIPS ###

 skr_card_captured_tt: "封印成功！这张库洛牌现在属于你了。"
 skr_card_failed_tt: "封印失败了。灾害仍在持续，等待下一次机会。"
 skr_judgment_success_tt: "通过了审判。樱之卡的力量觉醒了。"
 skr_judgment_fail_tt: "审判失败。需要重新准备。"

 ### DECISIONS ###

 skr_use_card_decision: "使用库洛牌"
 skr_use_card_decision_desc: "激活一张已收集的库洛牌的力量。每张卡牌使用后需要十年的冷却时间。"
