l_english:

 ### EVENT TITLES ###

 skr_card_events.1.t: "封印之书"
 skr_card_events.1.d: "一本古老的封印之书被发现。打开它的瞬间，库洛牌四散到了全国各地。必须尽快将它们全部收回来。"
 skr_card_events.1.a: "开始收集库洛牌。"

 # Windy
 skr_card_events.10.t: "异常强风"
 skr_card_events.10.d: "该省报告了持续数日的异常强风，房屋受损，农田被毁。似乎是库洛牌在附近作祟。"
 skr_card_events.10.a: "派小樱去调查。"
 skr_card_events.10.b: "暂时搁置，加强防范。"
 skr_card_events.10.c: "知世提供了防风措施——立刻出发。"

 # Fly
 skr_card_events.11.t: "巨大飞鸟"
 skr_card_events.11.d: "一只巨大的飞鸟在城镇上空盘旋，阴影笼罩了整个地区。商队不敢出行，物资运输瘫痪。"
 skr_card_events.11.a: "派小樱去调查。"
 skr_card_events.11.b: "暂时搁置。"

 # Watery
 skr_card_events.12.t: "不明水患"
 skr_card_events.12.d: "河水无故泛滥，地下水涌上街道。水中的鱼群也出现了异常行为。一张库洛牌正在这里作乱。"
 skr_card_events.12.a: "派小樱去调查。"
 skr_card_events.12.b: "暂时搁置。"

 # Firey
 skr_card_events.13.t: "连续火情"
 skr_card_events.13.d: "城市多处无故起火，消防队束手无策。烈焰仿佛有自己的意志，是库洛牌在作祟。"
 skr_card_events.13.a: "派小樱去调查。"
 skr_card_events.13.b: "暂时搁置。"

 # Earthy
 skr_card_events.14.t: "地底震动"
 skr_card_events.14.d: "持续的地震和地面塌陷困扰着当地。地底下似乎有什么东西在移动。"
 skr_card_events.14.a: "派小樱去调查。"
 skr_card_events.14.b: "暂时搁置。"

 # Thunder
 skr_card_events.15.t: "雷暴灾害"
 skr_card_events.15.d: "连绵的雷暴不停击打着大地，军队无法行军，建筑被闪电击中。"
 skr_card_events.15.a: "派小樱去调查。"
 skr_card_events.15.b: "暂时搁置。"

 # Sword
 skr_card_events.16.t: "狂乱的剑"
 skr_card_events.16.d: "当地驻军突然失去了控制，士兵们不断发生争执和斗殴。一把无形的剑似乎控制了所有人的意志。"
 skr_card_events.16.a: "派小樱去调查。"
 skr_card_events.16.b: "暂时搁置。"

 # Shield
 skr_card_events.17.t: "无形屏障"
 skr_card_events.17.d: "一座要塞被无形的屏障包围，无人能够靠近。屏障内部的人也无法出来。"
 skr_card_events.17.a: "派小樱去调查。"
 skr_card_events.17.b: "暂时搁置。"

 # Light
 skr_card_events.18.t: "刺眼的光芒"
 skr_card_events.18.d: "一道持续的白光笼罩了整座城市，居民无法正常生活。这是库洛牌中最强的两张之一。"
 skr_card_events.18.a: "派小樱去调查。"
 skr_card_events.18.b: "暂时搁置。"

 # Dark
 skr_card_events.19.t: "无尽的黑暗"
 skr_card_events.19.d: "黑暗吞噬了整个地区。白天如同黑夜，商路中断，恐慌蔓延。另一张最强的库洛牌出现了。"
 skr_card_events.19.a: "派小樱去调查。"
 skr_card_events.19.b: "暂时搁置。"

 # Create
 skr_card_events.20.t: "活过来的画"
 skr_card_events.20.d: "书籍和画作中的事物纷纷化为真实，城市中出现了不应存在的生物和建筑。"
 skr_card_events.20.a: "派小樱去调查。"
 skr_card_events.20.b: "暂时搁置。"

 # Erase
 skr_card_events.21.t: "消失的人们"
 skr_card_events.21.d: "居民陆续消失得无影无踪，仿佛从未存在过。这是最后一张库洛牌——\"消\"——的力量。"
 skr_card_events.21.a: "派小樱去调查。"
 skr_card_events.21.b: "暂时搁置。"

 ### CHALLENGE EVENT TITLES ###

 skr_card_events.30.t: "风之封印"
 skr_card_events.30.d: "小樱找到了强风的源头——是库洛牌「风」失控了。"
 skr_card_events.30.a: "尝试直接封印。"
 skr_card_events.30.b: "知世提供了防风设备。"

 skr_card_events.31.t: "翔之封印"
 skr_card_events.31.d: "是库洛牌「翔」。那只巨大的飞鸟需要尽快封印。"
 skr_card_events.31.a: "尝试直接封印。"
 skr_card_events.31.b: "用风之卡追踪它的行踪。"

 skr_card_events.32.t: "水之封印"
 skr_card_events.32.d: "水患的源头——库洛牌「水」显现了真身。"
 skr_card_events.32.a: "尝试直接封印。"
 skr_card_events.32.b: "用风之卡和翔之卡围困它。"

 skr_card_events.33.t: "火之封印"
 skr_card_events.33.d: "库洛牌「火」在城市中心肆虐。"
 skr_card_events.33.a: "尝试直接封印。"
 skr_card_events.33.b: "用水之卡压制火势。"
 skr_card_events.33.c: "知世准备了防火战斗服。"

 skr_card_events.34.t: "土之封印"
 skr_card_events.34.d: "地下的怪物——库洛牌「土」终于钻出了地面。"
 skr_card_events.34.a: "尝试直接封印。"
 skr_card_events.34.b: "用盾之卡构筑屏障限制它的行动。"

 skr_card_events.35.t: "雷之封印"
 skr_card_events.35.d: "雷云中盘旋着库洛牌「雷」。"
 skr_card_events.35.a: "尝试直接封印。"
 skr_card_events.35.b: "用火之卡和风之卡制造上升气流。"

 skr_card_events.36.t: "剑之封印"
 skr_card_events.36.d: "库洛牌「剑」附身在了将领身上。"
 skr_card_events.36.a: "尝试直接封印。"
 skr_card_events.36.b: "用盾之卡格挡剑的攻击。"

 skr_card_events.37.t: "盾之封印"
 skr_card_events.37.d: "库洛牌「盾」构筑了无法攻破的屏障。"
 skr_card_events.37.a: "尝试直接封印。"
 skr_card_events.37.b: "用剑之卡刺穿盾的防御。"

 skr_card_events.38.t: "光之封印"
 skr_card_events.38.d: "最强的库洛牌之一——「光」现身了。"
 skr_card_events.38.a: "尝试直接封印。"
 skr_card_events.38.b: "知世协助分散它的注意力。"

 skr_card_events.39.t: "暗之封印"
 skr_card_events.39.d: "「暗」潜伏在光芒之后。与光互为表里。"
 skr_card_events.39.a: "尝试直接封印。"
 skr_card_events.39.b: "用光之卡照亮暗之卡的所在。"

 skr_card_events.40.t: "创之封印"
 skr_card_events.40.d: "库洛牌「创」让虚幻之物变为现实。"
 skr_card_events.40.a: "尝试直接封印。"
 skr_card_events.40.b: "用光与暗的力量界定真实与虚幻的边界。"

 skr_card_events.41.t: "消之封印"
 skr_card_events.41.d: "最后一张——库洛牌「消」。它抹去一切存在。"
 skr_card_events.41.a: "尝试直接封印。"
 skr_card_events.41.b: "用创之卡对抗消的力量。"

 ### TMY EVENT ###

 skr_card_events.50.t: "知世的决心"
 skr_card_events.50.d: "知世表示愿意带领摩拉维亚加入小樱的旗帜下，一同守护这片土地。"
 skr_card_events.50.a: "欢迎知世。"

 ### FINAL JUDGMENT ###

 skr_card_events.51.t: "最后的审判"
 skr_card_events.51.d: "十二张库洛牌全部收集完毕。审判者月出现了。必须接受最终的考验。"
 skr_card_events.51.a: "迎战。"

 ### SAKURA CARD ###

 skr_card_events.52.t: "樱之卡觉醒"
 skr_card_events.52.d: "小樱自身的魔力苏醒，库洛牌被重新赋予了樱之魔力。此后可以转化为更强的樱之卡了。"
 skr_card_events.52.a: "完成转化。"

 ### CLEAR CARD AWAKENING ###

 skr_card_events.60.t: "透明之兆"
 skr_card_events.60.d: "小樱的魔力仍在不断增长。新的卡牌似乎在无意识中被创造了出来——透明牌出现了。"
 skr_card_events.60.a: "开始寻找透明牌。"

 # Clear Card Manifestations
 skr_card_events.61.t: "异常气流"
 skr_card_events.61.d: "出现了前所未有的强风现象。似乎是一张新的卡牌。"
 skr_card_events.61.a: "派小樱去调查。"
 skr_card_events.61.b: "暂时搁置。"

 skr_card_events.62.t: "堡垒困境"
 skr_card_events.62.d: "围攻一座城堡异常困难，仿佛有某种力量在庇护它。"
 skr_card_events.62.a: "派小樱去调查。"
 skr_card_events.62.b: "暂时搁置。"

 skr_card_events.63.t: "异常水源"
 skr_card_events.63.d: "港口出现了奇怪的水流，船只无法正常航行。"
 skr_card_events.63.a: "派小樱去调查。"
 skr_card_events.63.b: "暂时搁置。"

 skr_card_events.64.t: "瞬移现象"
 skr_card_events.64.d: "事物在无人触碰的情况下自行移动。"
 skr_card_events.64.a: "派小樱去调查。"
 skr_card_events.64.b: "暂时搁置。"

 skr_card_events.65.t: "记忆重现"
 skr_card_events.65.d: "城市中出现了来自过去的幻影，过去的事件在重演。"
 skr_card_events.65.a: "派小樱去调查。"
 skr_card_events.65.b: "暂时搁置。"

 skr_card_events.66.t: "飞行失控"
 skr_card_events.66.d: "天竺鼠和城中的动物开始在空中漂浮。"
 skr_card_events.66.a: "派小樱去调查。"
 skr_card_events.66.b: "暂时搁置。"

 skr_card_events.67.t: "烈焰再现"
 skr_card_events.67.d: "比之前更强的火焰席卷了城市。一种全新的火之力。"
 skr_card_events.67.a: "派小樱去调查。"
 skr_card_events.67.b: "暂时搁置。"

 skr_card_events.68.t: "破损修复"
 skr_card_events.68.d: "损坏的建筑在无人修缮的情况下自行恢复。"
 skr_card_events.68.a: "派小樱去调查。"
 skr_card_events.68.b: "暂时搁置。"

 # Clear Card Challenges
 skr_card_events.71.t: "疾风封印"
 skr_card_events.71.d: "透明牌「疾风」在暴风中显现。"
 skr_card_events.71.a: "尝试封印。"

 skr_card_events.72.t: "包围封印"
 skr_card_events.72.d: "透明牌「包围」让攻城变得寸步难行。"
 skr_card_events.72.a: "尝试封印。"

 skr_card_events.73.t: "水源封印"
 skr_card_events.73.d: "透明牌「水源」操控着港口的一切水流。"
 skr_card_events.73.a: "尝试封印。"

 skr_card_events.74.t: "行动封印"
 skr_card_events.74.d: "透明牌「行动」让物体有了自己的意志。"
 skr_card_events.74.a: "尝试封印。"

 skr_card_events.75.t: "记录封印"
 skr_card_events.75.d: "透明牌「记录」重现了过去的一切。"
 skr_card_events.75.a: "尝试封印。"

 skr_card_events.76.t: "飞翔封印"
 skr_card_events.76.d: "透明牌「飞翔」让重力失去了意义。"
 skr_card_events.76.a: "尝试封印。"

 skr_card_events.77.t: "火焰封印"
 skr_card_events.77.d: "透明牌「火焰」的温度比任何火焰都要高。"
 skr_card_events.77.a: "尝试封印。"

 skr_card_events.78.t: "修缮封印"
 skr_card_events.78.d: "透明牌「修缮」在自行修复万物。"
 skr_card_events.78.a: "尝试封印。"

