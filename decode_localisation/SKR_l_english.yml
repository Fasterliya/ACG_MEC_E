 Costume_designer_desc: "知世为小樱设计的战斗服不仅美观，还兼备战场的实用性。"
 Video_documentation: "影像记录"
 Video_documentation_desc: "知世用摄像机记录了小樱的每一次战斗，这些影像本身就是宝贵的资料。"
 Daidouji_fortune: "大道寺财团"
 Daidouji_fortune_desc: "知世身后的家族财富为国家提供了坚实的经济基础。"
 Sakuras_guardian: "樱的守护者"
 Sakuras_guardian_desc: "知世始终站在小樱身后，守护着她的一切。"
 Melody_of_hearts: "心之旋律"
 Melody_of_hearts_desc: "知世的歌声能让最敌对的邻居放下戒备。"
 Sakura_and_tomoyo: "樱与知世"
 Sakura_and_tomoyo_desc: "两人的羁绊超越了国界——知世愿意为小樱献出一切。"
 Eternal_friendship: "永恒的友谊"
 Eternal_friendship_desc: "永远的友谊让国家政策更加灵活。"

 ### MISSION TITLES ###

 # Slot 6 - Card Collection
 SKR_missions_6_title: "库洛继承者"
 SKR_mission_6_1_title: "封印之书"
 SKR_mission_6_1_desc: "库洛里德的封印之书被发现。打开它的那一刻，库洛牌四散到了全国各地。"
 SKR_mission_6_2_title: "最初的封印"
 SKR_mission_6_2_desc: "首先需要封印离我们最近的三张牌——风、翔、水。"
 SKR_mission_6_3_title: "力量的集结"
 SKR_mission_6_3_desc: "接下来是火、土、雷。这三张牌的攻击性很强，需要更多的准备。"
 SKR_mission_6_4_title: "攻防一体"
 SKR_mission_6_4_desc: "剑和盾——库洛牌中防御和攻击的极致。必须同时获得它们。"
 SKR_mission_6_5_title: "光与暗"
 SKR_mission_6_5_desc: "最强的两张库洛牌——光与暗。它们必须被找到并封印。"
 SKR_mission_6_6_title: "造与消"
 SKR_mission_6_6_desc: "最后两张库洛牌——创造和消除。集齐它们就完成了全部收集。"
 SKR_mission_6_7_title: "最后审判"
 SKR_mission_6_7_desc: "集齐了十二张库洛牌。但封印之书的审判者已经苏醒。"
 SKR_mission_6_8_title: "透明之兆"
 SKR_mission_6_8_desc: "新的时代来临了。小樱的魔力开始创造出全新的卡牌。"
 SKR_mission_6_9_title: "第一批透明牌"
 SKR_mission_6_9_desc: "疾风、包围、水源——前三张透明牌已经出现了。"
 SKR_mission_6_10_title: "行动与记录"
 SKR_mission_6_10_desc: "行动和记录——让万物移动和重现过去的力量。"
 SKR_mission_6_11_title: "最后三张"
 SKR_mission_6_11_desc: "飞翔、火焰和修缮。集齐所有透明牌。"
 SKR_mission_6_12_title: "终极卡牌大师"
 SKR_mission_6_12_desc: "集齐了全部二十张卡牌。小樱成为了真正意义上的卡牌大师。"

 # Slot 7 - Bohemia
 SKR_missions_7_title: "波西米亚之梦"
 SKR_mission_7_1_title: "军事准备"
 SKR_mission_7_1_desc: "在出击之前，必须确保军队已做好充分准备。"
 SKR_mission_7_2_title: "收复摩拉维亚"
 SKR_mission_7_2_desc: "摩拉维亚是我们领土的延伸。必须将其重新纳入版图。"
 SKR_mission_7_3_title: "知世的羁绊"
 SKR_mission_7_3_desc: "知世就在摩拉维亚。改善与她的关系，她将愿意加入我们。"
 SKR_mission_7_4_title: "统一本土"
 SKR_mission_7_4_desc: "波西米亚王冠领地的全部区域——摩拉维亚、西里西亚、卢萨蒂亚——必须统一。"
 SKR_mission_7_5_title: "布拉格之盛"
 SKR_mission_7_5_desc: "将首都布拉格发展为欧洲最繁荣的城市之一。"
 SKR_mission_7_6_title: "商人网络"
 SKR_mission_7_6_desc: "在波西米亚建立贯穿全国的贸易网络。"
 SKR_mission_7_7_title: "学术中心"
 SKR_mission_7_7_desc: "让波西米亚成为欧洲的学术中心之一。"
 SKR_mission_7_8_title: "选帝侯之力"
 SKR_mission_7_8_desc: "将帝国的选帝侯之位牢牢掌握在波西米亚手中。"
 SKR_mission_7_9_title: "工业心脏"
 SKR_mission_7_9_desc: "在波西米亚建立密集的制造业体系。"
 SKR_mission_7_10_title: "第一大城市"
 SKR_mission_7_10_desc: "让布拉格成为帝国最大的城市。"
 SKR_mission_7_11_title: "波西米亚启蒙"
 SKR_mission_7_11_desc: "大学和知识分子云集，波西米亚进入了启蒙时代。"
 SKR_mission_7_12_title: "黄金波西米亚"
 SKR_mission_7_12_desc: "波西米亚的每一个省份都繁荣昌盛。这就是黄金时代。"

 # Slot 8 - HRE
 SKR_missions_8_title: "神圣二次元帝国"
 SKR_mission_8_1_title: "帝国改革"
 SKR_mission_8_1_desc: "帝国需要改革才能走向强盛。通过第一项帝国改革。"
 SKR_mission_8_2_title: "内部和平"
 SKR_mission_8_2_desc: "禁止帝国内部的武装冲突——通过永恒和平改革。"
 SKR_mission_8_3_title: "皇权稳固"
 SKR_mission_8_3_desc: "确立波西米亚对帝国皇位的世袭权。"
 SKR_mission_8_4_title: "帝国之战"
 SKR_mission_8_4_desc: "帝国对外宣战需要统一行动——通过帝国战争改革。"
 SKR_mission_8_5_title: "撤销特权"
 SKR_mission_8_5_desc: "剥夺诸侯的特权，让帝国成为真正统一的国家。"
 SKR_mission_8_6_title: "帝国统一"
 SKR_mission_8_6_desc: "神圣帝国成为一个统一的巨国。"
 SKR_mission_8_7_title: "帝国霸权"
 SKR_mission_8_7_desc: "在统一的基础上，走向霸权之路。"
 SKR_mission_8_8_title: "诸侯统合"
 SKR_mission_8_8_desc: "庞大的帝国需要整合众多诸侯的力量。"
 SKR_mission_8_9_title: "大帝国的军队"
 SKR_mission_8_9_desc: "帝国的军队必须强大到足以守护所有疆域。"
 SKR_mission_8_10_title: "帝国的海军"
 SKR_mission_8_10_desc: "庞大的帝国也需要海上的力量。"
 SKR_mission_8_11_title: "帝国的财富"
 SKR_mission_8_11_desc: "控制贸易，掌控财富。"
 SKR_mission_8_12_title: "世界帝国"
 SKR_mission_8_12_desc: "帝国的力量拓展到了全球。真正的世界霸权。"

 # Slot 9 - Germany
 SKR_missions_9_title: "德意志霸主"
 SKR_mission_9_1_title: "巴伐利亚之门"
 SKR_mission_9_1_desc: "进军巴伐利亚和法兰克尼亚，打开进入德意志的大门。"
 SKR_mission_9_2_title: "深入德意志"
 SKR_mission_9_2_desc: "在南北德意志各控制十五个省份。"
 SKR_mission_9_3_title: "向西推进"
 SKR_mission_9_3_desc: "继续深入——控制南北德意志各二十五个省份。"
 SKR_mission_9_4_title: "莱茵河畔"
 SKR_mission_9_4_desc: "将势力推进到莱茵兰和施瓦本地区。"
 SKR_mission_9_5_title: "北境征途"
 SKR_mission_9_5_desc: "向北进入萨克森、勃兰登堡和波美拉尼亚。"
 SKR_mission_9_6_title: "德意志军事"
 SKR_mission_9_6_desc: "建立一支足以横扫德意志的强大军队。"
 SKR_mission_9_7_title: "半壁江山"
 SKR_mission_9_7_desc: "完全控制北德意志或南德意志之一。"
 SKR_mission_9_8_title: "一统德意志"
 SKR_mission_9_8_desc: "将南北德意志全部纳入统治。"
 SKR_mission_9_9_title: "十条防线"
 SKR_mission_9_9_desc: "在德意志边境建立十座坚固的要塞防线。"
 SKR_mission_9_10_title: "德意志繁荣"
 SKR_mission_9_10_desc: "每个德意志省份都达到一定的繁荣程度。"
 SKR_mission_9_11_title: "德意志工业"
 SKR_mission_9_11_desc: "在德意志境内建立密集的制造业网络。"
 SKR_mission_9_12_title: "德意志霸权"
 SKR_mission_9_12_desc: "成为德意志真正的霸权者。"

 # Slot 10 - Italy
 SKR_missions_10_title: "意大利之冠"
 SKR_mission_10_1_title: "翻越阿尔卑斯"
 SKR_mission_10_1_desc: "跨过阿尔卑斯山，进军威尼斯和伦巴第。"
 SKR_mission_10_2_title: "深入北意"
 SKR_mission_10_2_desc: "在意大利地区控制十个省份。"
 SKR_mission_10_3_title: "向罗马进军"
 SKR_mission_10_3_desc: "推进到罗马和中部意大利。"
 SKR_mission_10_4_title: "半岛南部"
 SKR_mission_10_4_desc: "那不勒斯和西西里等待征服。"
 SKR_mission_10_5_title: "岛屿与西境"
 SKR_mission_10_5_desc: "撒丁岛、科西嘉和皮埃蒙特——最后的意大利疆域。"
 SKR_mission_10_6_title: "热那亚贸易"
 SKR_mission_10_6_desc: "控制热那亚贸易节点。"
 SKR_mission_10_7_title: "半岛过半"
 SKR_mission_10_7_desc: "控制意大利一半以上的省份。"
 SKR_mission_10_8_title: "统一的意大利"
 SKR_mission_10_8_desc: "将整个意大利地区完全征服。"
 SKR_mission_10_9_title: "地中海舰队"
 SKR_mission_10_9_desc: "建立一支统治地中海的强大舰队。"
 SKR_mission_10_10_title: "贸易双璧"
 SKR_mission_10_10_desc: "同时控制热那亚和威尼斯两个贸易节点。"
 SKR_mission_10_11_title: "意大利黄金时代"
 SKR_mission_10_11_desc: "意大利的每个省份都繁荣昌盛。"
 SKR_mission_10_12_title: "我们的海"
 SKR_mission_10_12_desc: "成为海军霸权，将地中海变为我们的内湖。"

