 # Government Mechanic
 NNM_mikazuki_government_reform: "三日月庄君主制"
 NNM_mikazuki_government_reform_desc: "以三日月庄为核心的魔法少女联邦政体。八千代以羁绊而非恐惧维系着她的盟友们，每一位附庸都是自主作战的伙伴，而非被奴役的臣民。三日月羁绊之力随着同盟的壮大而增长。"
 NNM_mikazuki_bonds_mechanic: "三日月羁绊"
 NNM_mikazuki_bonds_power: "羁绊之力"
 NNM_bonds_resonance_interaction: "羁绊共鸣"
 NNM_bonds_resonance_interaction_desc: "消耗25点羁绊之力与100外交点数，所有三日月同盟附庸获得+15信任并-10%独立倾向。冷却10年。"
 NNM_bonds_resonance_effect_tt: "所有三日月同盟附庸获得信任+15，独立倾向-10%"

 # Government Mechanic - Meeting Decision
 NNM_hold_mikazuki_meeting_decision: "刷新三日月状态"
 NNM_hold_mikazuki_meeting_decision_desc: "召开三日月庄全体会议，检视当前同盟成员并重新凝聚羁绊之力。根据三日月同盟成员数量更新对应的羁绊阶段修正，同时重新判定任务解锁的升级增益。冷却5年。"
 NNM_meeting_cooldown: "会议冷却中"
 NNM_meeting_cooldown_desc: "三日月庄刚刚召开过会议，需要时间准备下一次集会。"
 NNM_meeting_refresh_tier_tt: "羁绊阶段与升级增益已重新判定完成。\n当前属国数、对应阶段等级、任务升级等级请见下方效果列表。"
 NNM_meeting_refresh_upgrade_tt: "§Y注意：§!任务升级增益需要§G完成对应任务§!后，手动重新召开一次会议才会生效。"
 NNM_meeting_tier_effect_tt: "【羁绊阶段效果】\n阶段等级 = 三日月同盟属国数（§G1§!-§G10§!级，累加制，每级含前级全部效果）\n\n§YLv1§!（§G1§!属国）：改善关系 §G+10%§! | 每月羁绊之力 §G+0.2§!\n§YLv2§!（§G2§!属国）：附庸收入 §G+10%§!\n§YLv3§!（§G3§!属国）：外交声望 §G+1§! | 外交合并花费 §G-5%§!\n§YLv4§!（§G4§!属国）：附庸陆军上限 §G+15%§! | 属国陆军上限 §G+10%§!\n§YLv5§!（§G5§!属国）：陆军士气 §G+5%§! | 属国训练度 §G+2.5%§!\n§YLv6§!（§G6§!属国）：训练度 §G+2.5%§! | 年度威望 §G+0.5§! | 全局叛乱 §G-1§! | 属国围城 §G+10%§!\n§YLv7§!（§G7§!属国）：外交声望 §G+2§! | 外交合并花费 §G-15%§! | 属国训练度 §G+5%§!\n§YLv8§!（§G8§!属国）：围城能力 §G+5%§! | 分离主义年数 §G-3§! | 全局叛乱 §G-2§! | 属国火伤承受 §G-5%§!\n§YLv9§!（§G9§!属国）：火力伤害 §G+5%§! | 附庸收入 §G+30%§! | 分离主义 §G-5§!\n§YLv10§!（§G10§!属国）：冲击伤害 §G+10%§! | 行政效率 §G+5%§! | 外交声望 §G+3§! | 外交合并花费 §G-25%§! | 属国冲击伤害 §G+10%§! | 属国火伤承受 §G-10%§!"
 NNM_meeting_upgrade_effect_tt: "【任务升级增益】（§G3§!级互斥，已含前级效果）\n\n§Y升级1§!（完成「三日月同盟成立」）\n  宗主国：外交关系 §G+1§! | 附庸陆军上限 §G+15%§!\n  属国：陆军上限 §G+25%§!\n\n§Y升级2§!（完成「魔法少女联邦」）\n  宗主国：侵略扩张 §G-15%§! | 外交合并花费 §G-10%§! | 陆军士气 §G+2.5%§!\n  属国：陆军士气 §G+10%§! | 围城能力 §G+5%§!\n\n§Y升级3§!（完成「永恒的羁绊」）\n  宗主国：训练度 §G+5%§! | 行政效率 §G+5%§! | 年度威望 §G+1§! | 每月羁绊之力 §G+1.0§! | 附庸陆军上限 §G+25%§!\n  属国：训练度 §G+5%§! | 火伤承受 §G-10%§! | 陆军上限 §G+50%§! | 围城能力 §G+10%§!"

 # Decisions
 NNM_admit_mikazuki_member_decision: "接纳新成员"
 NNM_admit_mikazuki_member_decision_desc: "将拥有魔法少女文化的附庸国正式纳入三日月同盟。每位新成员都将为联邦带来独特的战斗力与羁绊的增幅。消耗15点羁绊之力。"
 NNM_admit_member_effect_tt: "所有符合条件的普通附庸已转为三日月同盟类型。"

 # Subject Type
 mikazuki_ally: "三日月同盟"
 mikazuki_ally_title: "同盟成员"
 mikazuki_ally_long_desc: "三日月同盟是三日月庄的正式成员，享有高度自治权，不占用外交关系。盟约建立在信任与羁绊之上，而非单纯的臣服。"

 # CB & War
 cb_nnm_magical_girl_duel: "魔法少女对决"
 cb_nnm_magical_girl_duel_desc: "八千代向另一位魔法少女发起荣耀对决。战胜后可以将其纳入三日月同盟，以羁绊代替征服。"
 NNM_DUEL_WAR_NAME: "$ORDER$对$SECOND$的魔法少女对决"

 # Modifiers
 NNM_mikazuki_trust_modifier: "三日月庄的信任"
 NNM_mikazuki_trust_modifier_desc: "三日月庄的成员之间建立了牢不可破的信任关系。这份羁绊超越了一般附庸的忠诚。"
 NNM_kamihama_unity_modifier: "神滨统一"
 NNM_kamihama_unity_modifier_desc: "玛吉斯之翼已被瓦解，神滨市的魔法少女们在八千代的旗帜下实现了前所未有的团结。改善关系加成让外交交涉事半功倍。"
 NNM_carpathian_fortress_modifier: "喀尔巴阡防线"
 NNM_carpathian_fortress_modifier_desc: "喀尔巴阡山脉的要塞网络构成了帝国北方最坚固的盾牌。敌军在此寸步难行，守军却能迅速增援。"
 NNM_carpathian_master_modifier: "喀尔巴阡之主"
 NNM_carpathian_master_modifier_desc: "喀尔巴阡的广袤领土为联邦提供了充足的人力储备，陆军上限大幅提升。"
 NNM_carpathian_hegemony_modifier: "喀尔巴阡霸权"
 NNM_carpathian_hegemony_modifier_desc: "从多瑙河到波罗的海，北方大陆的霸权已然确立。征服新领土所需的行政成本显著降低。"
 NNM_vienna_taken_modifier: "维也纳陷落"
 NNM_vienna_taken_modifier_desc: "维也纳的陷落震撼了整个基督教世界。八千代的威名远扬，联邦的年度威望获得大幅提升。"
 NNM_alpine_defense_modifier: "阿尔卑斯防線"
 NNM_alpine_defense_modifier_desc: "阿尔卑斯山脉的自然天险加上联邦的要塞工事，任何试图入侵的敌人都要在崇山峻岭中消耗殆尽。"
 NNM_danube_league_modifier: "多瑙河之盟"
 NNM_danube_league_modifier_desc: "多瑙河沿岸的城邦与领地加入了联邦的贸易联盟。贸易效率获得可观的提升。"
 NNM_western_hegemony_modifier: "西方霸权"
 NNM_western_hegemony_modifier_desc: "奥地利与南德意志已入囊中。联邦掌握了西方世界的经济与技术命脉，发展成本显著下降。"
 NNM_byzantium_fallen_modifier: "君士坦丁堡的征服"
 NNM_byzantium_fallen_modifier_desc: "君士坦丁堡落入联邦之手，博斯普鲁斯海峡的贸易命脉被完全掌控。全球贸易力量大幅提升。"
 NNM_balkan_master_modifier: "巴尔干霸主"
 NNM_balkan_master_modifier_desc: "巴尔干全境已被联邦统一。这片饱经战火的土地终于迎来了和平，人力恢复速度惊人。"
 NNM_madoka_circle_modifier: "圆环之理"
 NNM_madoka_circle_modifier_desc: "鹿目圆、沙耶香与麻美齐聚三日月同盟。圆环之理的祝福降临联邦——对异端与异教的包容性达到前所未有的高度。"
 NNM_anatolia_iron_march_modifier: "安纳托利亚铁蹄"
 NNM_anatolia_iron_march_modifier_desc: "联邦军队在安纳托利亚高原上如履平地。常年的征战让军团获得了超乎常理的机动力。"
 NNM_anatolia_master_modifier: "安纳托利亚之主"
 NNM_anatolia_master_modifier_desc: "安纳托利亚的高原与海岸尽归联邦。被征服地区的分离主义倾向在联邦的强大治理下迅速消退。"
 NNM_magical_dawn_modifier: "魔法少女的黎明"
 NNM_magical_dawn_modifier_desc: "晓美焰、杏子与百江渚的加入标志着魔法少女新纪元的开启。八千年来的相互残杀终于结束——在新秩序下，联邦的传教力量显著增强。"
 NNM_mikazuki_deep_bonds_modifier: "深化的羁绊"
 NNM_mikazuki_deep_bonds_modifier_desc: "经历过无数战斗后，三日月同盟的羁绊已深入骨髓。附庸缴纳的税收和忠诚度都达到了新的高度。"

