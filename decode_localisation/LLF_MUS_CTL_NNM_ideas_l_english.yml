l_english:
 # ============ LLF 高坂穗乃果 ============
 LLF_ideas: "lovelive联邦理念"
 LLF_ideas_start: "Fight Dayo！"
 LLF_ideas_start_desc: "「ファイトだよ！」——这是穗乃果的口号，也是她的人生信条。当音乃木坂学院面临废校危机时，这个自称「普通到没有任何特色」的女孩，凭借一股蛮勇创立了μ's。从第一次Live台下只有六个人，到最终站上全国大会的舞台夺冠，她证明了平凡人也能创造奇迹。这份不屈的斗志深植于每一位国民心中。"
 LLF_ideas_bonus: "我们是合而为一的光芒"
 LLF_ideas_bonus_desc: "「僕たちはひとつの光」——μ's的告别演出上，九人唱出了最后的和声。穗乃果和她的伙伴们已经不再只是校园偶像，她们成为了一种信仰。当所有人的心意汇聚成一道光芒时，这个国家便拥有了无穷的行政力量。"
 honoka_charisma: "果皇的魅力"
 honoka_charisma_desc: "穗乃果有一种无法解释的吸引力——九位性格迥异的少女，A-RISE的对手，乃至整个学校的学生，都被她的人格魅力所折服。希曾坦言：『和穗乃果在一起的时候，自己会变得奇怪，想去对她撒娇。』这种领导气质在外交场上同样无往不利。"
 otonokizaka_academy: "音乃木坂的传承"
 otonokizaka_academy_desc: "音乃木坂学院是穗乃果的母校，也是她母亲和祖母曾经就读的地方。当废校的危机降临时，穗乃果没有放弃——她用偶像活动拯救了这所百年老校。如今，这座学院已成为培养国家栋梁的摇篮，每年涌现出无数优秀的顾问人才。"
 school_idol_spirit: "校园偶像的信仰"
 school_idol_spirit_desc: "对穗乃果而言，校园偶像不仅是唱歌跳舞。当第一次Live台下空无一人时她没有放弃，当大雨中昏倒时她没有放弃，当小鸟即将离开时她也没有放弃。这种信仰成为了国家团结的基石——只要偶像还在舞台上闪耀，人民就永远不会动摇。"
 muse_bonds_llf: "九色的羁绊"
 muse_bonds_llf_desc: "μ's的九人来自完全不同的背景——严肃的海未、温柔的小鸟、天才的真姬、神秘的希……穗乃果用她的真诚将她们凝聚成了不可分割的整体。当每位成员都愿意为了彼此而战时，这支军队便拥有了超越任何训练的纪律。"
 snow_halation_llf: "Snow Halation"
 snow_halation_llf_desc: "那场传奇的演出中，白色雪地上突然绽放的橙色光芒，让全场观众为之落泪。Snow Halation不只是一首歌——它是穗乃果带给这个世界的温暖证明。这个国家的威望，就如那雪地上的光晕一般纯洁而耀眼。"
 tale_we_make_together: "大家一起创造的故事"
 tale_we_make_together_desc: "「みんなで叶える物語」——μ's的故事不是穗乃果一个人的传奇。她从家族的点心店「穗村」出发，和每一位伙伴、每一位粉丝一起，共同书写了这段历史。当所有人都参与其中时，国家的经济便如故事一般自然而然地繁荣。"
 single_light_muse: "我们是同一道光"
 single_light_muse_desc: "在东京巨蛋的告别演唱会上，当《僕たちはひとつの光》响起时，所有人都明白了：即使μ's解散了，她们的光芒也不会消失。穗乃果将这份信念转化为国家意志——每一个人的努力汇聚在一起，就能推动整个文明向前发展。"

 # ============ MUS 缪斯 ============
 MUS_ideas: "缪斯理念"
 MUS_ideas_start: "Start:Dash!!"
 MUS_ideas_start_desc: "μ's的故事从一间空教室开始——穗乃果、海未和小鸟，三个青梅竹马决定成为学园偶像。没有任何经验、没有专业训练、没有舞台，只有「Start:Dash!!」的决心。这种从零到一的开拓精神，让缪斯帝国拥有了惊人的整合能力。"
 MUS_ideas_bonus: "那是我们的奇迹"
 MUS_ideas_bonus_desc: "「それは僕たちの奇跡」——当μ's在LoveLive决赛中击败卫冕冠军A-RISE时，全日本见证了偶像史上最伟大的逆袭。这个奇迹不仅带来了无尽的荣耀，更催生了空前繁荣的偶像经济。"
 muse_high_eq_idol: "高情商偶像"
 muse_high_eq_idol_desc: "缪斯的偶像从不是高高在上的存在。她们会记住每一位粉丝的名字，会在握手会上倾听每一个人的故事。这种亲和力让她们收获了跨越国界的友谊——在外交场上，缪斯的外交官比任何大使都更能融化冰冷的关系。"
 muse_protect_pure_land: "守护偶像净土"
 muse_protect_pure_land_desc: "偶像的世界容不得杂质。从舞台到训练室，从学院到全国，缪斯建立起一套严密的守护体系。任何试图玷污这方净土的力量，都将在坚固的防线前碰壁。"
 muse_popular_idol: "超人气偶像"
 muse_popular_idol_desc: "当穗乃果站在舞台中央唱出第一个音符时，整个会场为之沸腾。A-RISE曾是无人能敌的霸主，但在缪斯的人气面前也不得不甘拜下风。当全民都成为偶像的粉丝时，没有人会想去颠覆这个给他们带来快乐的国家。"
 muse_idol_training: "偶像特训"
 muse_idol_training_desc: "为了追上A-RISE的脚步，缪斯进行了近乎残酷的训练——穗乃果在雨中练跑直到昏倒，海未为每一个动作斤斤计较，小鸟为编舞彻夜不眠。这种特训体系被推广到全军，打造出一支纪律严明的偶像军团。"
 muse_idol_craze: "偶像热潮"
 muse_idol_craze_desc: "当缪斯在秋叶原与A-RISE联手共演《SUNNY DAY SONG》时，整个东京为之疯狂。偶像热潮席卷全国，无数年轻人受到感召，志愿加入偶像军团。这股热情转化为源源不断的兵力补充。"
 muse_elite_academy: "精英偶像学院"
 muse_elite_academy_desc: "音乃木坂学院——这所曾濒临废校的古老学府，在缪斯的努力下获得了新生。如今它已成为偶像帝国的最高学府，毕业生们遍布国家各个领域，从行政到军事，都能看到偶像学院培养的精英。"
 muse_performance_empire: "演艺帝国"
 muse_performance_empire_desc: "缪斯的舞台超越了语言与信仰的壁垒。当《僕らのLIVE 君とのLIFE》响起时，无论是异端还是异教徒，所有人都会放下分歧，一起挥舞荧光棒。偶像本身就是最强大的文化输出，也是最具生产力的经济引擎。"

 # ============ CTL 珂朵莉 ============
 CTL_ideas: "珂朵莉理念"
 CTL_ideas_start: "想守护的东西"
 CTL_ideas_start_desc: "珂朵莉是被制造出来的「兵器」——黄金妖精，她的存在意义就是战斗至死。但在68号岛的妖精仓库里，在与威廉相遇之后，她第一次找到了比使命更重要的东西：想要守护的人。这份心意让她的战力超越了任何圣剑的极限。"
 CTL_ideas_bonus: "珂朵莉·诺塔·瑟尼欧里斯"
 CTL_ideas_bonus_desc: "即使前世的人格逐渐侵蚀她的记忆，即使绯红的发色宣告着她正在消散，珂朵莉依然用最后的力量拯救了心爱之人。她的名字与圣剑瑟尼欧里斯一同铭刻于历史——「珂教兴国」，她的传说将永远激励这个国家前行。"
 fairy_warrior_corps: "妖精兵团"
 fairy_warrior_corps_desc: "黄金妖精——被制造出来对抗「兽」的终极兵器。每一位成体妖精兵都持有一柄圣剑，能以一人之力对抗成群的第六兽。珂朵莉是68号岛妖精仓库中最年长的战士，她的冲锋足以粉碎任何防线。"
 senioris_blade: "圣剑瑟尼欧里斯"
 senioris_blade_desc: "瑟尼欧里斯是最强的极位古圣剑之一，由四十一个护符组成。它拥有让任何存在——包括不死之躯——都回归「死亡」的力量。但代价是持剑者必须背负死与破灭的命运。珂朵莉是这把剑的适格者，她以自身的消逝换取了一击必杀的毁灭性火力。"
 carved_memories: "刻下的记忆"
 carved_memories_desc: "「假如……我再过五天就会死，你能不能对我温柔一点？」——珂朵莉在生命倒计时中向威廉提出的请求。每一次使用圣剑都会让她失去一部分记忆，但她将每一个珍贵的瞬间都刻入了灵魂深处。她的温柔让邻国也无法产生侵略的欲望。"
 floating_isles_naval: "浮空岛舰队"
 floating_isles_naval_desc: "故事发生在一系列悬浮于天空的大陆上——68号岛、28号岛、15号岛……在这片天空之海中，护翼军维持着对抗兽的舰队。珂朵莉所在的妖精仓库正是为这些浮空岛培养战士的地方。这份空中海军的传承带来了无可匹敌的士气与效率。"
 star_god_elq: "星神艾露可的祝福"
 star_god_elq_desc: "星神艾露可·霍克斯登——她创造了这个世界，也是黄金妖精系统的源头。当珂朵莉在濒死之际遇见前世的幻影时，她触碰到了星神领域的一角。这份来自创世之初的智慧让国家的科技与思想都超越了同时代的一切。"
 battle_against_end: "对抗终末的战斗"
 battle_against_end_desc: "第六兽——无法被彻底杀死的存在。十五号岛的战斗中，珂朵莉因力量过度使用而被前世侵蚀，部分头发化为绯红。但她没有退缩。每一场与终末抗衡的战斗都铸就了不朽的军事传统，让后世将士在面对绝境时从不低头。"
 happiest_girl_world: "世界上最幸福的女孩"
 happiest_girl_world_desc: "在最后的战斗中，珂朵莉抱着必死的决心坠向地面。当护翼军找到她的遗体时，所有人都被震撼了——她独自歼灭了对地表的兽群。弥留之际，她说出了那句让无数人落泪的话：「我是世界上最幸福的女孩。」这份超越生死的从容，让敌人的一切攻击都显得苍白无力。"

 # ============ NNM 七海八千代 ============
 NNM_ideas: "八千代理念"
 NNM_ideas_start: "历战的魔法少女"
 NNM_ideas_start_desc: "八千代从十二岁起便成为了魔法少女，在神滨市战斗了整整七年。在这个魔法少女平均寿命不过数年的世界里，她是极少数幸存至今的老兵。她见过太多同伴变成魔女或死于绝望，但每一次她都能站起来，继续战斗。她的部队继承了这份永不退缩的士气，而她对战场节奏的掌控让增援总能及时抵达前线。"
 NNM_ideas_bonus: "神滨魔法联盟"
 NNM_ideas_bonus_desc: "八千代以三日月庄为中心，团结了神滨市几乎所有派系的魔法少女——从玛吉斯之翼的叛离者到时女一族的战士。在对抗魔女之夜的终局之战中，这个前所未有的联盟展现了惊人的纪律性与战斗力。训练度是魔法少女存活的本钱。"
 kusarigama_master: "千变的战技"
 kusarigama_master_desc: "八千代是神滨市最强的魔法少女之一。她击败过沙地魔女、绝交阶梯之谣、圣麻美、谣鹤乃，甚至在第十章的终局之战中，借助环彩羽之手击败了魔女之夜。她的三叉戟在战场上造成毁灭性的冲击，而她灵活得近乎诡谲的机动能力，让敌军将领永远猜不透她的下一步。"
 nanami_model_charm: "模特七海的魅力"
 nanami_model_charm_desc: "除了魔法少女的身份，八千代还是一名职业模特。她在镜头前的从容与优雅延续到了外交场上——无论面对多么顽固的对手，这位经历过无数次生死谈判的老兵都能让对方放下戒备。她的名声本身就是国家威望的来源。"
 kamihama_guardian: "神滨市的守护者"
 kamihama_guardian_desc: "八千代将神滨市视为自己的归所。她建立了《神滨传言档案》，整理了这座城市所有魔法少女与魔女的情报。在她的经营下，神滨市的堡垒坚不可摧，守军数量远超常理。任何试图入侵的敌人，都要面对一座武装到牙齿的城池。"
 survivor_duty: "幸存者的责任"
 survivor_duty_desc: "梅露变成了魔女，加奈惠死在了战斗之后。作为三人中唯一的幸存者，八千代一度认为是自己的愿望害死了同伴。但最终她明白了——活着的人必须背负逝者的希望继续前行。这份觉悟让她的军队无论面对多大的伤亡都能迅速恢复人力，而长期战争带来的疲惫也无法摧毁她们的意志。"
 yachiyo_millennium: "八千代的七年"
 yachiyo_millennium_desc: "七年的战斗经验——在魔法少女的世界里，这近乎是永恒。八千代见证过无数战斗、掌握了数不清的战术，并将这一切传授给了新一代的三日月庄成员。她培养的将领以猛烈的冲击力著称，而她的日常训练体系让军队始终保持着临战状态。"
 eternal_magical_girl: "永不屈服的灵魂"
 eternal_magical_girl_desc: "八千代的魔女化身名为「Campanella」——银河铁道之夜中那个在旅途中燃尽自己的角色。正如其名，八千代即使面对死亡也不会退缩。她的灵魂宝石曾被逼至极限，但她每一次都活了下来。她的部队继承了这份韧性——无论敌人的冲击还是火力，都难以撼动这支历战之师。"
 bonds_power_nnm: "三日月庄的羁绊"
 bonds_power_nnm_desc: "在遇见环彩羽之前，八千代独自一人背负着一切。但在共同战斗中，她与彩羽、鹤乃、菲莉希亚、莎奈建立起了超越战友的羁绊。三日月庄的灯火照亮了她冰封的内心。这份羁绊的力量如此强大，以至于被征服的土地也能迅速融入这个温暖的大家庭，分离主义的火种无从点燃。"
