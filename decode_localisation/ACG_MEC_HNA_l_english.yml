l_english:
 # ===== 稗田阿求：将领特质 =====
 akyuu_chronicler_personality: "\n\n\n£HNA_akyuu£\n\n\n稗田阿求"
 desc_akyuu_chronicler_personality: "\n\n\n£HNA_akyuu£\n\n\n稗田阿求以史家之笔记述战阵之事。她所率领的部队更易重振士气，攻城亦更为老练。"
 akyuu_chronicler_peak_personality: "幻想乡史笔"
 desc_akyuu_chronicler_peak_personality: "£HNA_akyuu£\n百战之后，阿求的笔下已不再只是传闻。她兼通火器、冲击、机动与攻城之道，所率之军无处不可至、无城不可下。"
 # ===== 稗田阿求：政体改革 =====
 ACG_MEC_HNA_chronicle_reform: "稗田家史笔"
 ACG_MEC_HNA_chronicle_reform_desc: "稗田家世代执笔，为幻想乡编年纪事。当史笔成为国政之本，阿求便可将战阵见闻、魔法考据一并写入书稿，由是日益精进。"
 # ===== 稗田阿求：决议（键名规范：<key>_title + <key>_desc）=====
 # v3：5 条「著书」决议已删除 —— 著书改为玩家在贵族阶层界面自行授予特权
 ACG_MEC_HNA_adopt_chronicle_reform_title: "确立稗田家史笔之政"
 ACG_MEC_HNA_adopt_chronicle_reform_desc: "将记述与考据抬升为国政根本。此后阿求的见闻与著述都将化为真正的力量。"
 ACG_MEC_HNA_summon_akyuu_title: "召稗田阿求出任将领"
 ACG_MEC_HNA_summon_akyuu_desc: "阿求本为文人，然史笔需亲历方可信实。请她亲临军阵，记下真正的战争。"
 ACG_MEC_HNA_refit_akyuu_title: "为阿求整军"
 ACG_MEC_HNA_refit_akyuu_desc: "根据阿求当前累积的见闻重新整编其部曲，使其战力与见闻相符。"
 ACG_MEC_HNA_refit_cd_tooltip: "距上次整军已满一年"
 # ===== 稗田阿求：事件 =====
 ACG_MEC_HNA_events.1.t: "阿求的突破"
 ACG_MEC_HNA_events.1.d: "又一段见闻落于纸上。阿求对火器、冲击、机动与攻城的理解更进一层。"
 ACG_MEC_HNA_events.1.a: "善。"
 ACG_MEC_HNA_events.10.t: "《求闻史纪》成书"
 ACG_MEC_HNA_events.10.d: "笔墨既干，一部编年纪事已成。阿求问：此书写成，欲以何者为重？"
 ACG_MEC_HNA_events.10.a: "重发展：令地方富庶。"
 ACG_MEC_HNA_events.10.b: "重内政：以文治安邦。"
 ACG_MEC_HNA_events.10.c: "重军事：以见闻强兵。"
 ACG_MEC_HNA_events.11.t: "《幻想乡缘起》成书"
 ACG_MEC_HNA_events.11.d: "风土、妖怪、魔力之源，尽录一册。阿求请问此书的用处。"
 ACG_MEC_HNA_events.11.a: "重营造：以书中所载兴工。"
 ACG_MEC_HNA_events.11.b: "重魔法：以考据牵引魔力。"
 ACG_MEC_HNA_events.11.c: "重军事：以记述训练士卒。"
 ACG_MEC_HNA_events.12.t: "《魔法使通信》成书"
 ACG_MEC_HNA_events.12.d: "与魔法使往还问答，终成通信集。施法与实务之间，阿求择其一而深之。"
 ACG_MEC_HNA_events.12.a: "重魔法：积累施法经验。"
 ACG_MEC_HNA_events.12.b: "重军事：以魔法辅助军阵。"
 ACG_MEC_HNA_events.12.c: "重内政：以学问改善治理。"
 ACG_MEC_HNA_events.13.t: "《战术要略》成书"
 ACG_MEC_HNA_events.13.d: "以亲历之战写成的兵书已成。它可以成为军国之器，也可以只是阿求自己的经验。"
 ACG_MEC_HNA_events.13.a: "颁行军中，以强军势。"
 ACG_MEC_HNA_events.13.b: "留作己用，以砺己身。"
 ACG_MEC_HNA_events.13.c: "存于书库，以佐政事。"
 ACG_MEC_HNA_events.14.t: "《稗田家秘录》成书"
 ACG_MEC_HNA_events.14.d: "稗田家历代所藏之秘，终于成书。此书将决定阿求之名以何种方式留在历史上。"
 ACG_MEC_HNA_events.14.a: "重己身：以此书完成自身之道。"
 ACG_MEC_HNA_events.14.b: "重传承：使史笔成为国家常制。"
 ACG_MEC_HNA_events.14.c: "重魔法：将秘录交予魔法使。"
 ACG_MEC_HNA_events.30.t: "幻想乡史笔"
 ACG_MEC_HNA_events.30.d: "火器、冲击、机动、攻城——四项皆已登峰造极。阿求不再是记述战争的人，而是战争本身的一部分。"
 ACG_MEC_HNA_events.30.a: "此即稗田阿求。"
 ACG_MEC_HNA_events.40.t: "阿求出任将领"
 ACG_MEC_HNA_events.40.d: "阿求披上轻甲，随军而行。她的笔记从此写在战场之上。"
 ACG_MEC_HNA_events.40.a: "让她亲自去看。"
 ACG_MEC_HNA_events.50.t: "稗田家史笔之政"
 ACG_MEC_HNA_events.50.d: "史笔成为国政根本。自此，阿求的每一次亲历、每一部著述，都将化为实实在在的力量。"
 ACG_MEC_HNA_events.50.a: "执笔记之。"
 # ===== 稗田阿求：奖励与圆满修正 =====
 ACG_MEC_HNA_reward_dev_1: "史笔·劝农"
 ACG_MEC_HNA_reward_dev_2: "史笔·兴业"
 ACG_MEC_HNA_reward_build_1: "史笔·营造"
 ACG_MEC_HNA_reward_adm_1: "史笔·文治"
 ACG_MEC_HNA_reward_army_1: "史笔·振旅"
 ACG_MEC_HNA_reward_army_2: "史笔·练兵"
 ACG_MEC_HNA_reward_army_3: "史笔·武备"
 ACG_MEC_HNA_reward_magic_mana: "史笔·聚魔"
 ACG_MEC_HNA_reward_magic_exp: "史笔·通术"
 ACG_MEC_HNA_reward_magic_tech: "史笔·明理"
 ACG_MEC_HNA_chronicle_permanent: "稗田家秘录"
 ACG_MEC_HNA_peak_modifier: "幻想乡史笔"
 # v6 新增：任务树军事线骰子（3_1 / 3_3 / 3_4 各给一次，累计全局进攻骰子 +3、全局防御骰子 +3）
 ACG_MEC_HNA_dice_1: "史笔·临阵"
 ACG_MEC_HNA_dice_2: "史笔·料敌"
 ACG_MEC_HNA_dice_3: "史笔·决胜"
 # v6 新增：任务树军事包（新建独立键，与既有 reward_army_1/2/3 解耦，事件不受影响）
 ACG_MEC_HNA_mil_1: "史笔·坚壁"
 ACG_MEC_HNA_mil_2: "史笔·锐士"
 ACG_MEC_HNA_mil_3: "史笔·攻城"
 # v6 新增：每月君主点数（2_2 与 4_4 各给一次，累计每月行政 +2、外交 +2、军事 +2）
 ACG_MEC_HNA_power_1: "史笔·笔耕"
 ACG_MEC_HNA_power_2: "史笔·成书"
 # ===== 稗田阿求：著书特权（5 本，挂贵族阶层 estate_nobles）=====
 # 玩家在贵族阶层界面自行授予；特权的 on_granted 会排程对应年限的完成事件。
 # Debuff 就在特权自身（penalties），不再另挂修正。
 ACG_MEC_HNA_writing_1: "著述《求闻史纪》"
 ACG_MEC_HNA_writing_1_desc: "阿求正在编年纪事：发展花费 +15%、建筑花费 +15%、科技花费 +5%。三年后成书。"
 ACG_MEC_HNA_writing_2: "著述《幻想乡缘起》"
 ACG_MEC_HNA_writing_2_desc: "阿求正在考据风土：陆军士气 -5%、外交声誉 -1、建筑花费 +10%。五年后成书。"
 ACG_MEC_HNA_writing_3: "著述《魔法使通信》"
 ACG_MEC_HNA_writing_3_desc: "阿求正在与魔法使论道：施法经验月增 -10、科技花费 +10%、全国叛乱 +2。六年后成书。"
 ACG_MEC_HNA_writing_4: "著述《战术要略》"
 ACG_MEC_HNA_writing_4_desc: "阿求正在整理兵书：陆军士气 -10%、补员速度 -10%、训练度 -2%。四年后成书。"
 ACG_MEC_HNA_writing_5: "著述《稗田家秘录》"
 ACG_MEC_HNA_writing_5_desc: "阿求正在写稗田家最终之书：行政、外交、军事点数月增各 -1，发展花费 +20%。八年后成书。"
 # ===== 稗田阿求：任务树（键名规范：<任务名>_title + <任务名>_desc）=====
 # ----- 第 2 列（slot = 2）：内政 / 发展 / 建筑 -----
 HNA_missions_2_1_title: "稗田家的领地"
 HNA_missions_2_1_desc: "稗田家世代居于安科纳。先让自家领地富庶起来，方有记述他人的余裕。"
 HNA_missions_2_2_title: "五处聚落"
 HNA_missions_2_2_desc: "史书需有可记之人、可记之地。治下至少要有五处像样的聚落。"
 HNA_missions_2_3_title: "书库与学舍"
 HNA_missions_2_3_desc: "在都城建立学舍，供阿求查阅典籍、整理旧稿。"
 HNA_missions_2_4_title: "印刷工坊"
 HNA_missions_2_4_desc: "有工坊与市集，书稿方能传抄天下。"
 # ----- 第 3 列（slot = 3）：军事 / 意大利 -----
 HNA_missions_3_1_title: "城防与治安"
 HNA_missions_3_1_desc: "史笔需有安宁之地。修治官署与营房，使境内无虞。"
 HNA_missions_3_2_title: "安科纳的商路"
 HNA_missions_3_2_desc: "安科纳临海，货殖可通。设货栈以聚财货。"
 HNA_missions_3_3_title: "亚平宁的立足"
 HNA_missions_3_3_desc: "史书若只写一城，终究太薄。在意大利取得第二块土地。"
 HNA_missions_3_4_title: "罗马之路"
 HNA_missions_3_4_desc: "罗马是旧世界的中心。阿求若要记述这个时代，终须亲自走到罗马。"
 # ----- 第 4 列（slot = 4）：著书 / 魔法 -----
 HNA_missions_4_1_title: "《求闻史纪》"
 HNA_missions_4_1_desc: "第一部编年纪事成书，稗田家之名始著。"
 HNA_missions_4_2_title: "《幻想乡缘起》"
 HNA_missions_4_2_desc: "风土与妖怪的考据完成，阿求的视界不再限于人间。"
 HNA_missions_4_3_title: "魔法与史笔"
 HNA_missions_4_3_desc: "考据需要魔力的凭据。积累魔力与施法经验，让史笔与魔法互为表里。"
 HNA_missions_4_4_title: "幻想乡史笔"
 HNA_missions_4_4_desc: "记下一切，理解一切，最终成为一切。阿求的见闻已足以支撑一部传世之书。"
 # ===== 稗田阿求：脚本变量 =====
 # 键名规范：键名 = 变量名本身（依据本地 Wiki 变量.html §「本地化变量」：
 #   "我们能本地化变量，这样它就显示为我们定义的字符串，而不是变量脚本名"；
 #   实例：ACG1 localisation/Acg_events_l_english.yml 的 Mana:0、Acg_Professional_magic_l_english.yml 的 Magic_exp:0）
 # 注意：Mana / Magic_exp 是 ACG1 已有的魔法变量，ACG1 已自带本地化（还带 £magic_mana£ / £magic_exp£ 图标），
 #       此处刻意不重复定义，以免覆盖它的图标。
 HNA_akyuu_growth_points: "稗田阿求的成长"
 HNA_akyuu_tier: "稗田阿求的突破等级"
 HNA_akyuu_exp: "稗田阿求积累的见闻"
 # 注：v3 起著书改为「特权 on_granted 排程事件」，不再有年度计时，
 #     所以 HNA_writing_1..5_years 的本地化 key 已一并删除。
 # ===== 稗田阿求：最终任务「幻想乡史笔」的 custom_tooltip =====
 # custom_tooltip = ACG_MEC_HNA_final_mission_tt（写在本 mod missions/HNA_missions.txt 的
 # HNA_missions_4_4 的 effect 里）。因为全科技 +1 用 hidden_effect 包住了，
 # 三行自动 tooltip 不会生成，最终任务面板上显示的就是下面这段文字。
 ACG_MEC_HNA_final_mission_tt: "稗田家史笔圆满：全国的学问与技艺随之跃升——行政、外交、军事科技各 +1。\n此后即便阿求战殁或去职，也能随时「再召稗田阿求出任将领」：不受战争状态限制、冷却仅 30 天，且她累积的成长与突破等级完整保留。"
 # ===== 稗田阿求：再召决议（v4 新增，由最终任务解锁）=====
 ACG_MEC_HNA_recall_akyuu_title: "再召稗田阿求出任将领"
 ACG_MEC_HNA_recall_akyuu_desc: "《稗田家秘录》既已成书，阿求之名便不可磨灭。无论她战殁于阵前还是去职于朝堂，稗田家随时可以请她再度披甲——她此前的全部见闻与成长都不会丢失。"
 # ===== 稗田阿求：国家理念组 HNA_ideas（common/ideas/HNA_ideas.txt）=====
 # 键名规范：<组名>（组名本身）/ <组名>_ideas_start(_desc) / <组名>_ideas_bonus(_desc) / <理念键>(_desc)
 #   依据：本 mod decode_localisation/BLS_l_english.yml:7-10、YYK_l_english.yml:132-136 同族写法。
 HNA_ideas: "稗田家理念"
 HNA_ideas_start: "稗田家的史笔"
 HNA_ideas_start_desc: "稗田家世代居于安科纳，以记述为业。当史笔成为国政之本，全国的营造与治学便有了方向：发展花费降低，政体推进也更顺畅。"
 HNA_ideas_bonus: "幻想乡史笔"
 HNA_ideas_bonus_desc: "记下一切，理解一切。当稗田家的理念终为一体，阿求的见闻已足以支撑一部传世之书——开拓疆土与研习理念的代价都随之降低。"
 HNA_ancona_chronicle: "安科纳编年"
 HNA_ancona_chronicle_desc: "稗田家的领地编年使税制有据可依，乡里的争端也有了成例可循，境内因此安定。"
 HNA_house_of_books: "书库与学舍"
 HNA_house_of_books_desc: "都城的书库汇集典籍、学舍容纳门徒。思想在此碰撞，新技术与新思潮总是更快地传入这个国家。"
 HNA_woodblock_printing: "木版印刷"
 HNA_woodblock_printing_desc: "书稿一旦可以大量传抄，知识与手艺便不再囿于宫廷。工坊与市集随之兴旺，货物行销四方。"
 HNA_akyuus_records: "阿求的见闻"
 HNA_akyuus_records_desc: "阿求亲历亲闻的记述令稗田家声名远播，也让共和国的传统在一次次朝议中愈发稳固。"
 HNA_magic_research: "魔法考据"
 HNA_magic_research_desc: "考据需要魔力的凭据。稗田家以注疏与实验并行，聚敛魔力与施法经验的速度远超他国。"
 HNA_italian_footing: "亚平宁的立足"
 HNA_italian_footing_desc: "史书若只写一城，终究太薄。稗田家在意大利的扩张有理有据、有典可引，因此招致的非议更少，议和时的价码也更低。"
 HNA_akyuu_the_general: "阿求出阵"
 HNA_akyuu_the_general_desc: "阿求披甲随军，亲历战阵。她的笔记写在战场之上，士气与锋锐也随之而来。"
