l_english:

 HMC: "虹猫"
 HMC_ADJ: "虹猫的"
 HMC_ADJ2: "虹猫的"
 HMC_ideas: "虹猫理念"
 HMC_ideas_start: "七剑之誓"
 HMC_ideas_start_desc: "虹猫立誓集齐七剑，讨伐魔教，守护天下。长虹剑主的名号，让每一个追随者都心潮澎湃。"
 HMC_ideas_bonus: "七剑合璧"
 HMC_ideas_bonus_desc: "七剑合璧，天下无敌。当七位剑主的信念合而为一，虹猫的军队便拥有了摧枯拉朽的力量。"
 HMC_idea_1: "长虹贯日"
 HMC_idea_1_desc: "长虹剑的剑意如虹贯日，无坚不摧。虹猫的军队在正面战场上锐不可当。"
 HMC_idea_2: "麒麟祥瑞"
 HMC_idea_2_desc: "麒麟庇护虹猫，降下祥瑞。国运昌隆，治下安宁，四方的疆土迅速归心。"
 HMC_idea_3: "正义之师"
 HMC_idea_3_desc: "讨伐魔教乃正义之举。民心归附，天下安定，叛乱与不满在虹猫的旗帜下烟消云散。"
 HMC_idea_4: "七侠集结"
 HMC_idea_4_desc: "蓝兔、大奔、跳跳、达达、逗逗、莎莉——七侠汇聚，天下何人不服。"
 HMC_idea_5: "武学传承"
 HMC_idea_5_desc: "七侠的武学代代相传。教育与武艺并重，让虹猫的国力日新月异。"
 HMC_idea_6: "火舞旋风"
 HMC_idea_6_desc: "火舞旋风的剑法闻名天下。虹猫的军队擅长防御与机动，令来犯之敌望而却步。"
 HMC_idea_7: "天下归一"
 HMC_idea_7_desc: "当七剑真正合璧，虹猫便拥有了统一天下的力量。天下苍生，尽在其守护之下。"

 ### CULTURE ###

