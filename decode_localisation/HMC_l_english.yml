 ### GOVERNMENT REFORM ###

 HMC_qijian_reform: "七剑君主制"
 HMC_qijian_reform_desc: "虹猫以七剑为誓，统御群侠。长虹剑主不仅是一位君主，更是天下侠士的领袖。七剑合璧之力，让虹猫的军队所向披靡。"
 HMC_rank_1: "公国"
 HMC_rank_2: "王国"
 HMC_rank_3: "帝国"
 HMC_ruler_1: "少侠"
 HMC_ruler_2: "少侠"
 HMC_ruler_3: "天下共主"
 HMC_consort: "侠侣"
 HMC_heir: "候补剑主"

 ### MECHANIC ###

 HMC_china_core_unlocked_tt: "§G七剑合璧之力已经觉醒！§! 从此占领中国地区的省份将自动获得核心。"
 HMC_china_growth_1: "中原初定"
 HMC_china_growth_2: "群雄归附"
 HMC_china_growth_3: "七剑镇国"
 HMC_china_growth_4: "天下共主"
 HMC_china_growth_5: "海内一统"

 ### MISSION TITLES ###

 HMC_missions_1: "七剑之誓"
 HMC_missions_2: "长虹威名"
 HMC_missions_3: "麒麟祥瑞"
 HMC_missions_4: "七侠同袍"
 HMC_missions_5: "天下归一"

 HMC_missions_1_1_title: "初露锋芒"
 HMC_missions_1_1_desc: "虹猫初出茅庐，锋芒初露。积蓄国力，为讨伐魔教打下根基。"
 HMC_missions_1_2_title: "七剑合璧"
 HMC_missions_1_2_desc: "集齐七剑，合璧之力觉醒。从此占领中国地区的省份将自动获得核心，统一之路畅通无阻。"
 HMC_missions_1_3_title: "国泰民安"
 HMC_missions_1_3_desc: "发展国都，安定民心。让虹猫的旗帜下处处祥和。"
 HMC_missions_1_4_title: "固若金汤"
 HMC_missions_1_4_desc: "筑起坚固的要塞，让魔教的铁蹄无法越雷池一步。"
 HMC_missions_1_5_title: "麒麟赐福"
 HMC_missions_1_5_desc: "麒麟降世，祥瑞漫天。虹猫的国运达到新的高峰。"

 HMC_missions_2_1_title: "整军备战"
 HMC_missions_2_1_desc: "训练精锐之师，让长虹剑意充满每一名士兵的胸膛。"
 HMC_missions_2_2_title: "讨伐魔教"
 HMC_missions_2_2_desc: "魔教不除，天下难安。向魔教的势力发起征讨，光复中原。"
 HMC_missions_2_3_title: "剑锋所指"
 HMC_missions_2_3_desc: "扩充军队，让剑锋所向，无人能挡。"
 HMC_missions_2_4_title: "威震中原"
 HMC_missions_2_4_desc: "当半个中国都臣服于虹猫，魔教的末日便已临近。"
 HMC_missions_2_5_title: "势如破竹"
 HMC_missions_2_5_desc: "兵锋所指，势如破竹。虹猫的大军席卷中原。"

 HMC_missions_3_1_title: "百业兴旺"
 HMC_missions_3_1_desc: "发展城池，让万民安居乐业。"
 HMC_missions_3_2_title: "国库充盈"
 HMC_missions_3_2_desc: "积聚财富，为统一大业提供源源不断的支持。"
 HMC_missions_3_3_title: "商路通达"
 HMC_missions_3_3_desc: "广开商路，让天下的财富流入虹猫的国库。"
 HMC_missions_3_4_title: "祥瑞遍地"
 HMC_missions_3_4_desc: "麒麟所至，遍地祥瑞。繁荣的经济让国家如虎添翼。"
 HMC_missions_3_5_title: "富甲天下"
 HMC_missions_3_5_desc: "当国库充盈到足以买下整片中原，统一便只是时间问题。"

 HMC_missions_4_1_title: "广纳贤才"
 HMC_missions_4_1_desc: "收服一方势力，让其臣服于虹猫的旗帜之下。"
 HMC_missions_4_2_title: "七侠相聚"
 HMC_missions_4_2_desc: "蓝兔、大奔等七侠陆续归附，虹猫的阵营日益壮大。"
 HMC_missions_4_3_title: "号令一方"
 HMC_missions_4_3_desc: "当群雄臣服，虹猫便真正号令一方。"
 HMC_missions_4_4_title: "同仇敌忾"
 HMC_missions_4_4_desc: "七侠同袍，同仇敌忾。魔教的势力在团结面前土崩瓦解。"
 HMC_missions_4_5_title: "名震天下"
 HMC_missions_4_5_desc: "跻身列强之林，虹猫的名号响彻天下。"

 HMC_missions_5_1_title: "威望日隆"
 HMC_missions_5_1_desc: "虹猫的威望与日俱增，天下侧目。"
 HMC_missions_5_2_title: "登基称帝"
 HMC_missions_5_2_desc: "加冕为帝国，虹猫将君临天下。"
 HMC_missions_5_3_title: "定鼎中原"
 HMC_missions_5_3_desc: "占领中原大部，魔教的根基已经动摇。"
 HMC_missions_5_4_title: "光复中原"
 HMC_missions_5_4_desc: "中原尽归虹猫所有，魔教的残党无处遁形。"
 HMC_missions_5_5_title: "天下归心"
 HMC_missions_5_5_desc: "当整个中国都臣服于虹猫，天下归心，海内一统。七剑合璧的誓言终于圆满。"
