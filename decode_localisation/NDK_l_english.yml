 NDK_missions_5_1_title: "霜月之子"
 NDK_missions_5_1_desc: "霜月之子不谈政治，只谈月相。他们把历法交给国家，条件是国家不许改历法上的任何一天。"
 NDK_missions_5_2_title: "执灯人"
 NDK_missions_5_2_desc: "执灯人守的是路，不是城。他们愿意为挪德卡莱点灯，前提是灯油钱由挪德卡莱出。"
 NDK_missions_5_3_title: "伏尼契商会"
 NDK_missions_5_3_desc: "伏尼契的人不问货从哪来，只问价能不能再低半成。挪德卡莱喜欢这种不问来路的诚实。"
 NDK_missions_5_4_title: "叮铃哐啷蛋卷工坊"
 NDK_missions_5_4_desc: "工坊的名字听着像玩笑，出的货却一件比一件较真。他们只要求一件事：别催。"
 NDK_missions_5_5_title: "愚人众"
 NDK_missions_5_5_desc: "愚人众的使节从不空手来，也从不空手走。挪德卡莱清楚这一点，仍然开了门——因为门外还有别的人在排队。"

 NDK_tt_choose_side: "§Y三月空席§! 已成定局。此后挪德卡莱要走哪一条路，由一场抉择决定：§G分支a§!（析身诸我）或 §G分支b§!（新诞的悖论）。"
 NDK_tt_end_1a: "§Y分支1A · 析身诸我§! 已成。月线将在下一格收束为 §G新生之月§!。"
