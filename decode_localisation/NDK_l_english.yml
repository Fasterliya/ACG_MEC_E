 ### REFORM
 NDK_hollow_moon_poem_reform: "空月与长夜之诗"
 NDK_hollow_moon_poem_reform_desc: "挪德卡莱的政体不是一天铸成的。空月之年，各部族在霜月下重订盟约：灯由执灯人点，货由商会运，历由霜月之子记，炉由工坊烧，而刀——刀归愚人众。每一家都拿到了自己那一份，也都欠下了别人那一份。此后长夜再长，也长不过这首尚未写完的诗。"

