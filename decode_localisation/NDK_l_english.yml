l_english:

 NDK: "挪德卡莱"
 NDK_ADJ: "挪德卡莱的"
 NDK_ADJ2: "挪德卡莱的"
 NDK_ideas: "挪德卡莱理念"
 NDK_ideas_start: "挪德卡莱传统"
 NDK_ideas_start_desc: "极光之下没有王座，只有火堆旁的约定。挪德卡莱的部族各自为政，却在雪原上共享同一条商路、同一套规矩。"
 NDK_ideas_bonus: "挪德卡莱野心"
 NDK_ideas_bonus_desc: "雪原不会记住谁来过，却会记住谁留下。挪德卡莱要在这片被帝国遗忘的边境上，立起自己的界碑。"
 NDK_idea_1: "部族议会"
 NDK_idea_1_desc: "大事不决于一人。各部族的首领在极光下围火而坐，争执可以持续整夜，但一旦定议，便无人再提异议。"
 NDK_idea_2: "边贸要道"
 NDK_idea_2_desc: "南来的盐、北去的皮货、帝国不愿过问的货物，都要经过挪德卡莱的关卡。谁握住这条路，谁就握住了边境的呼吸。"
 NDK_idea_3: "雪原游击"
 NDK_idea_3_desc: "挪德卡莱的战士不与大军正面相撞。他们熟悉每一条冰缝与每一片桦林，等敌人冻得握不住枪，再从雪里站起来。"
 NDK_idea_4: "猎手传统"
 NDK_idea_4_desc: "在挪德卡莱，狩猎是成年礼，也是战术。猎手懂得等待、包抄与一击致命——这套本领用在战场上同样有效。"
 NDK_idea_5: "熔炉与铁砧"
 NDK_idea_5_desc: "雪原不缺矿石，缺的是火。沿河的熔炉把铁打成刀、钉与犁，让这片边境第一次有了自己的工匠。"
 NDK_idea_6: "月之民"
 NDK_idea_6_desc: "月亮的盈亏被挪德卡莱人当作历法与诫命。守夜者在月下宣誓，誓言比任何文书都更难撕毁。"
 NDK_idea_7: "极寒生存"
 NDK_idea_7_desc: "能在挪德卡莱的冬天活下来的人，本身就是一支军队。这里的每一户人家都备着柴、盐与一张能拉开的弓。"

 # ===== MISSION =====

 NDK_missions_1: "极北立国"
 NDK_missions_2: "边贸要道"
 NDK_missions_3: "白海航路"
 NDK_missions_4: "月下之约"
 NDK_missions_5: "五家角力"

 NDK_missions_1_1_title: "北隅未合"
 NDK_missions_1_1_desc: "九块地、三口盐井、一条走不通的雪路，这就是挪德卡莱的全部家当。基里尔在火堆边摊开羊皮纸，说：先把这块地坐实，再谈别的。"
 NDK_missions_1_2_title: "千湖之野"
 NDK_missions_1_2_desc: "冰化之后，湖与湖之间露出可以走的路。部族首领们第一次同意在同一处议事，条件是每人回家时都带得走一车鱼。"
 NDK_missions_1_3_title: "北方之路"
 NDK_missions_1_3_desc: "从白海到内陆的路不必修得漂亮，只要能过车。挪德卡莱收的不是过路费，是过路人往后必须记得的名字。"
 NDK_missions_1_4_title: "冰封的波尼亚"
 NDK_missions_1_4_desc: "波莫尔四省已经全数归心。剩下的事是把文书送到阿尔汉格尔斯克——那边的人会先称一称纸的分量，再决定要不要读。"
 NDK_missions_1_5_title: "北境王座"
 NDK_missions_1_5_desc: "界碑立起来那天，没有人加冕。基里尔只让人在碑上刻了一行字：此处往北，规矩由我们定。"

 NDK_missions_2_1_title: "雪浪与苍林"
 NDK_missions_2_1_desc: "雪浪压着苍林，林子里出的木头比金子实在。砍下来的第一根，被立在了税卡门口当门柱。"
 NDK_missions_2_2_title: "商会贸易"
 NDK_missions_2_2_desc: "南来的盐商抱怨路难走，北去的皮货商抱怨税太重。挪德卡莱的回答是：路归我修，税归我定，抱怨归你。"
 NDK_missions_2_3_title: "毛皮和盐"
 NDK_missions_2_3_desc: "毛皮出北，盐进南。账房先生第一次发现，这两样东西在同一个账本上时，数字会自己往上走。"
 NDK_missions_2_4_title: "北拉普兰"
 NDK_missions_2_4_desc: "拉普兰的驯鹿牧民不认国界，只认季节。挪德卡莱不打算教他们认字，只打算让他们记得在哪条路口交税。"
 NDK_missions_2_5_title: "格陵兰冰岛"
 NDK_missions_2_5_desc: "冰岛与格陵兰之间那条老航路，维京人走过、主教走过、后来没人走了。挪德卡莱把它重新走了一遍，然后记下了冰厚。"

 NDK_missions_3_2_title: "白海港口"
 NDK_missions_3_2_desc: "白海一年有四个月不冻。这四个月里，索罗卡的码头要装下整年的指望，装不下就烂在岸上。"
 NDK_missions_3_3_title: "白海的浮冰"
 NDK_missions_3_3_desc: "浮冰不看海图。领航的老舵手说，认冰比认星重要——星会骗人，冰不会，它只会在你撞上去的时候告诉你它在。"
 NDK_missions_3_4_title: "海图上的航线"
 NDK_missions_3_4_desc: "海图室里的那张图，边角被手汗磨得发亮。上面有一条线，从白海一直画到没人回来的地方。"
 NDK_missions_3_5_title: "文兰"
 NDK_missions_3_5_desc: "文兰的葡萄藤是传说，鱼群是实的。船队带回的第一批货不是黄金，是腌好的鳕鱼和一句「那边真的能住人」。"

 NDK_missions_4_1_title: "月佑之地"
 NDK_missions_4_1_desc: "守夜者在月下起誓，誓言里没有一个字提到国家。但从此以后，挪德卡莱的每一次决断，都要先看一眼月亮。"

